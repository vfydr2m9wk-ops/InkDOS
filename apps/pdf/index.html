<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f7f8fa"><title>PDF Workspace — InkDOS 2.0</title><link rel="icon" href="assets/pdf.svg"><link rel="stylesheet" href="runtime/tokens/base.css"><link rel="stylesheet" href="runtime/frame/app-frame.css"><link rel="stylesheet" href="ui/pdf-toolbar.css"><link rel="stylesheet" href="view/pdf-surface.css"><link rel="stylesheet" href="pdfjs/pdfjs-layers.css"><link rel="stylesheet" href="extensions/review-annotations.css"><link rel="stylesheet" href="ui/navigation.css"><style>
/* App-local start card. Shared visual contract; no cross-app runtime dependency. */
#contentViewport{position:relative}.start-state{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:18px;background:var(--bg);pointer-events:none}.start-state[hidden]{display:none!important}.start-card{width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:var(--shadow);text-align:center;pointer-events:auto}.start-icon{width:68px;height:68px}.start-card h1{margin:14px 0 6px}.start-card p{margin:0 0 18px;color:var(--muted)}.start-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.start-actions button{min-height:44px;border:1px solid var(--accent);border-radius:11px;background:var(--accent);padding:0 16px;color:#fff;cursor:pointer}.start-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style></head><body><div class="app-shell">
<header class="topbar"><div class="frame-side frame-left"><button id="menuBtn" class="frame-btn" type="button" aria-label="Open PDF menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="frame-btn" href="../../index.html" aria-label="Home" title="Home" style="color:inherit;text-decoration:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg></a></div><div class="document-title"><img src="assets/pdf.svg" class="pdf-icon" alt=""><span id="titleText" class="title-text">No PDF open</span><span id="dirtyDot" class="dirty-dot" aria-hidden="true"></span></div><div class="frame-side frame-right"></div></header>
<div id="editbar" class="editbar" tabindex="0" aria-label="PDF toolbar">
  <div class="mode-switch" role="group" aria-label="PDF mode"><button class="mode-btn active" data-pdf-mode="view" type="button">View</button><button class="mode-btn" data-pdf-mode="annotate" type="button">Annotate</button></div>
  <span class="tool-divider"></span>
  <div class="tool-group"><button id="navPanelBtn" class="tool-btn icon-only" type="button" aria-label="Pages and outline"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg></button><button id="prevPageBtn" class="tool-btn icon-only" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg></button><input id="pageInput" class="page-input" inputmode="numeric" value="1" aria-label="Page number"><span id="pageCount" class="page-count">/ 0</span><button id="nextPageBtn" class="tool-btn icon-only" type="button" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></svg></button></div>
  <span class="tool-divider annotate-only"></span>
  <div class="tool-group annotate-only"><button id="selectToolBtn" class="tool-btn" data-annotate-tool="select" type="button" aria-label="Select annotations or edit PDF form fields"><svg viewBox="0 0 24 24"><path d="M5 3l6 15 2.2-5.1L18 11z"/></svg><span class="tool-label">Select</span></button><button id="textToolBtn" class="tool-btn" data-annotate-tool="text" type="button" aria-label="Add text annotation"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg><span class="tool-label">Text</span></button><button id="penToolBtn" class="tool-btn" data-annotate-tool="pen" type="button" aria-label="Draw with pen"><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM13.5 7l3.5 3.5"/></svg><span class="tool-label">Pen</span></button><button id="highlightToolBtn" class="tool-btn" data-annotate-tool="highlight" type="button" aria-label="Highlight PDF text"><svg viewBox="0 0 24 24"><path d="m5 15 8-8 4 4-8 8H5zM13 7l2-2 4 4-2 2M4 20h8"/></svg><span class="tool-label">Highlight</span></button><button id="underlineToolBtn" class="tool-btn" data-annotate-tool="underline" type="button" aria-label="Underline PDF text"><svg viewBox="0 0 24 24"><path d="M7 4v6a5 5 0 0 0 10 0V4M5 20h14"/></svg><span class="tool-label">Underline</span></button><button id="commentToolBtn" class="tool-btn" data-annotate-tool="comment" type="button" aria-label="Add PDF comment"><svg viewBox="0 0 24 24"><path d="M5 5h14v11H9l-4 4z"/><path d="M8 9h8M8 12h5"/></svg><span class="tool-label">Comment</span></button><button id="deleteAnnotationBtn" class="tool-btn icon-only" type="button" aria-label="Delete selected annotation" disabled><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 10v8M12 10v8M16 10v8M7 7l1 13h8l1-13"/></svg></button></div>
  <div class="tool-group annotate-only text-only"><span class="property-label">Size</span><select id="textSize" class="property-select" aria-label="Text size"><option>10</option><option selected>14</option><option>18</option><option>24</option><option>32</option><option>48</option><option>72</option></select><input id="textColor" class="property-color" type="color" value="#202124" aria-label="Text color"></div>
  <div class="tool-group annotate-only pen-only"><span class="property-label">Pen</span><input id="penColor" class="property-color" type="color" value="#202124" aria-label="Pen color"><select id="penThickness" class="property-select" aria-label="Pen thickness"><option value="1">1 pt</option><option value="2" selected>2 pt</option><option value="3">3 pt</option><option value="5">5 pt</option><option value="8">8 pt</option></select><select id="penOpacity" class="property-select" aria-label="Pen opacity"><option value="35">35%</option><option value="60">60%</option><option value="80">80%</option><option value="100" selected>100%</option></select></div>
  <div class="tool-group annotate-only"><button id="undoBtn" class="tool-btn icon-only" type="button" aria-label="Undo annotation" disabled><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg></button><button id="redoBtn" class="tool-btn icon-only" type="button" aria-label="Redo annotation" disabled><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg></button></div>
  <span class="tool-divider"></span>
  <div class="tool-group"><select id="zoomSelect" class="zoom-select" aria-label="PDF zoom"><option value="fit-width" selected>Fit width</option><option value="fit-page">Fit page</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option><option value="300">300%</option><option value="400">400%</option></select><button id="saveToolbarBtn" class="tool-btn" type="button" aria-label="Save PDF copy" disabled><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span class="tool-label">Save</span></button></div><span class="toolbar-end-spacer"></span>
</div>
<main id="contentViewport" class="content-viewport" aria-label="PDF content viewport"><div class="pdf-stage"><div id="pdfStack" class="pdf-stack"></div></div><div id="pdfStartGate" class="start-state"><div class="start-card"><img src="assets/pdf.svg" class="start-icon" alt=""><h1>PDF Workspace</h1><p>Open a PDF file locally.</p><div class="start-actions single"><button id="openStartBtn" class="primary" type="button">Open PDF</button></div></div></div></main>
<footer class="statusbar"><span id="statusText">Ready</span><span class="status-spacer"></span><span id="pageStatus">No document</span><span>P4.2 · PDF.js View / Annotate</span></footer><input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
<div id="menuBackdrop" class="backdrop" hidden></div><aside id="generalMenu" class="drawer" role="dialog" aria-modal="true" aria-label="PDF menu" hidden><div class="drawer-head"><div class="drawer-title"><img src="assets/pdf.svg" class="drawer-icon" alt=""><span>PDF Workspace</span></div><button id="closeMenuBtn" class="close-btn" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="drawer-section-label">File</div><div class="menu-list"><button id="openMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><path d="M3.5 7h6l2 2h9v9.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 10h17"/></svg><span>Open PDF</span><span class="hint">⌘O</span></button><button id="saveMenuBtn" class="menu-item" type="button" disabled><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span>Save copy</span><span class="hint">⌘S</span></button></div><div class="drawer-section-label">Appearance</div><div class="appearance-switch"><button class="appearance-choice" data-appearance-choice="light">Light</button><button class="appearance-choice" data-appearance-choice="dark">Dark</button><button class="appearance-choice" data-appearance-choice="system">System</button></div></aside>
<section id="navigationPanel" class="navigation-panel" hidden aria-label="PDF navigation"><div class="navigation-tabs"><button id="outlineTab" class="nav-tab" type="button">Outline</button><button id="pagesTab" class="nav-tab active" type="button">Pages</button><button id="closeNavigation" class="nav-close" type="button" aria-label="Close navigation">×</button></div><div id="outlinePane" class="nav-pane"><div id="outlineList" class="outline-list"></div></div><div id="pagesPane" class="nav-pane active"><div class="thumb-toolbar"><button id="thumbPrevBlock" type="button">‹</button><span id="thumbRange">—</span><button id="thumbNextBlock" type="button">›</button></div><div id="thumbGrid" class="thumb-grid"></div></div></section>
<div id="commentBackdrop" class="modal-backdrop" hidden></div><form id="commentDialog" class="comment-dialog" hidden><h2 id="commentDialogTitle">Add comment</h2><textarea id="commentText" maxlength="4000" placeholder="Comment"></textarea><div class="dialog-actions"><button id="cancelComment" type="button">Cancel</button><button class="primary" type="submit">Save comment</button></div></form></div>
<script src="vendor/pdfjs/pdf.min.js"></script><script src="runtime/frame/frame-menu.js"></script><script src="runtime/platform/content-viewport-adapter.js"></script><script src="state/appearance.js"></script><script src="engine/pdf-policy.js"></script><script src="engine/pdf-session.js"></script><script src="pdfjs/event-bus.js"></script><script src="pdfjs/environment.js"></script><script src="pdfjs/editor-adapter.js"></script><script src="io/pdf-worker.js"></script><script src="io/file-delivery.js"></script><script src="io/save-adapter.js"></script><script src="view/page-renderer.js"></script><script src="view/page-scheduler.js"></script><script src="view/page-layout.js"></script><script src="view/zoom-controller.js"></script><script src="pdfjs/page-layers.js"></script><script src="extensions/review-annotations.js"></script><script src="ui/chrome-controller.js"></script><script src="ui/navigation-controller.js"></script><script src="ui/zoom-controls.js"></script><script src="modes/mode-controller.js"></script><script src="io/file-open-controller.js"></script><script src="io/save-controller.js"></script><script src="ui/command-controller.js"></script><script src="app.js"></script><script>
(function(){'use strict';
 const gate=document.getElementById('pdfStartGate'),title=document.getElementById('titleText');
 document.getElementById('openStartBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
 function syncStart(){gate.hidden=title.textContent!=='No PDF open'}
 new MutationObserver(syncStart).observe(title,{childList:true,characterData:true,subtree:true});
 syncStart();
})();
</script></body></html>
