      <button id="slidePanelBtn" class="tool-btn icon-only active" type="button" title="Show or hide slide thumbnails" aria-label="Show or hide slide thumbnails" aria-controls="slidePanel" aria-expanded="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/></svg></button>
      <button id="prevSlideBtn" class="tool-btn icon-only" type="button" title="Previous slide" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg></button>

      <button id="deleteSlideBtn" class="tool-btn labeled-tool" type="button" title="Delete slide" aria-label="Delete slide"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span class="tool-label">Delete</span></button>
    </div>
    <span class="tool-divider" aria-hidden="true"></span>
    <div id="pptToolbarInsert" class="tool-group" role="group" aria-label="Insert">

    </div>
    <span class="tool-divider" aria-hidden="true"></span>
    <div id="pptToolbarText" class="tool-group" role="group" aria-label="Text formatting">
      <select id="fontSize" class="font-size-select" title="Font size" aria-label="Font size"><option>12</option><option>16</option><option>20</option><option selected>24</option><option>28</option><option>32</option><option>36</option><option>44</option><option>54</option><option>72</option></select>
      <button id="boldBtn" class="tool-btn icon-only" type="button" title="Bold" aria-label="Bold"><b>B</b></button>
      <button id="italicBtn" class="tool-btn icon-only" type="button" title="Italic" aria-label="Italic"><i>I</i></button>
      <select id="alignSelect" class="align-select" title="Alignment" aria-label="Text alignment"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
    </div>
    <span class="tool-divider" aria-hidden="true"></span>
    <div id="pptToolbarObjectStyle" class="tool-group" role="group" aria-label="Object style"></div>
    <span class="tool-divider" aria-hidden="true"></span>
    <div class="tool-group" role="group" aria-label="View and presentation">
      <button id="zoomMenuBtn" class="tool-btn zoom-tool" type="button" title="Zoom" aria-label="Slide zoom" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg><span id="zoomToolbarLabel">100%</span></button>
      <button id="presentBtn" class="tool-btn labeled-tool" type="button" title="Present from current slide" aria-label="Present from current slide"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="12" rx="1.5"/><path d="M9.5 7.5 15 10l-5.5 2.5z"/><path d="M12 16v4M8.5 20h7"/></svg><span class="tool-label">Present</span></button>
    </div>
    <span class="toolbar-end-spacer" aria-hidden="true"></span>
  </div>

  <main id="workspace" class="presentation-workspace" data-panel-open="true">
    <div id="startState" class="start-state"><div class="start-card"><img src="assets/presentations.png" class="start-icon" alt=""><h1>Presentations</h1><p>Create a presentation or open a PPT/PPTX file locally.</p><div class="start-actions"><button id="startNew" type="button">New presentation</button><button id="startOpen" class="primary" type="button">Open presentation</button></div></div></div>

    <section id="viewport" class="content-viewport" tabindex="0" aria-label="Presentation content viewport"><div id="stage" class="slide-stage"><div id="slideShell" class="slide-shell"><div id="slideCanvas" class="slide-canvas"></div></div></div></section>
  </main>

  <footer class="statusbar"><span id="statusText">Ready</span><span id="slideStatus">Slide 1 of 1</span></footer>
  <input id="fileInput" type="file" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>

  <div id="menuBackdrop" class="backdrop" hidden></div>
  <aside id="generalMenu" class="drawer" role="dialog" aria-modal="true" aria-label="Presentations menu" hidden>
    <div class="drawer-head"><div class="drawer-title"><img src="assets/presentations.png" class="drawer-icon" alt=""><span>Presentations</span></div><button id="closeMenuBtn" class="close-btn" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="drawer-section-label">File</div><div class="menu-list">
      <button id="newMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New presentation</span><span class="hint">⌘N</span></button>
      <button id="openMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><path d="M3.5 7h6l2 2h9v9.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 10h17"/></svg><span>Open PPT / PPTX</span><span class="hint">⌘O</span></button>
      <button id="saveMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span>Save copy</span><span class="hint">⌘S</span></button>
      <button id="presentStartMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="12" rx="1.5"/><path d="M9.5 7.5 15 10l-5.5 2.5z"/><path d="M12 16v4M8.5 20h7"/></svg><span>Present from start</span><span></span></button>
    </div>
    <div class="drawer-section"><div class="drawer-section-label">Appearance</div><div class="appearance-switch" role="group" aria-label="App appearance"><button class="appearance-choice" type="button" data-appearance-choice="light">Light</button><button class="appearance-choice" type="button" data-appearance-choice="dark">Dark</button><button class="appearance-choice" type="button" data-appearance-choice="system">System</button></div></div>
  </aside>

  <div id="zoomPopover" class="zoom-popover" role="dialog" aria-label="Slide zoom" hidden><div class="zoom-head"><strong>Zoom</strong><output id="zoomOutput" for="zoomSlider">100%</output></div><div class="zoom-row"><button id="zoomOut" class="zoom-round" type="button" aria-label="Zoom out">−</button><input id="zoomSlider" type="range" min="50" max="200" step="5" value="100" aria-label="Zoom percentage"><button id="zoomIn" class="zoom-round" type="button" aria-label="Zoom in">+</button></div><div class="zoom-presets"><button id="fitWidth" type="button">Fit width</button><button id="fitPage" type="button">Fit page</button><button id="zoom100" type="button">100%</button></div><small>Manual 50–200% · fit modes recalculate on rotation</small></div>

  <section id="presentOverlay" hidden tabindex="0" aria-label="Presentation mode" style="position:fixed;inset:0;z-index:300;background:#090909;display:grid;place-items:center;overflow:hidden"><button data-present-exit type="button" aria-label="Exit presentation" style="position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:2;min-width:44px;min-height:44px;border:0;border-radius:12px;background:rgba(30,30,30,.72);color:white">×</button><div id="presentHost" style="position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);max-width:100vw;max-height:100vh;background:white"></div><div id="presentCounter" style="position:fixed;bottom:max(10px,env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));color:white;background:rgba(0,0,0,.45);padding:5px 8px;border-radius:8px;font-size:12px">1 / 1</div></section>

<script>
(function presentationStartGate(){
  const state=document.getElementById('startState');
  const startNew=document.getElementById('startNew');
  const startOpen=document.getElementById('startOpen');
  const fileInput=document.getElementById('fileInput');
  const menuNew=document.getElementById('newMenuBtn');
  const app=globalThis.__inkdosPresentations;
  if(!state||!startNew||!startOpen||!fileInput||!app)return;

  function showStart(){
    state.hidden=false;
    state.removeAttribute('hidden');
    state.dataset.active='true';
    state.style.setProperty('display','grid','important');
  }
  function hideStart(){
    state.dataset.active='false';
    state.style.removeProperty('display');
    state.hidden=true;
  }
  function waitForOpenCommit(beforeRevision){
    let frames=0;
    function check(){
      const kind=app.session.sourceKind;
      if((kind==='ppt'||kind==='pptx')&&app.session.revision>beforeRevision){hideStart();return}
      if(++frames<900&&state.dataset.active==='true')requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
  }

  /* The presentation engine creates its blank slide model during construction.
     Keep that implementation untouched and place a deterministic first-open gate
     above it until the user explicitly chooses New or a file open commits. */
  showStart();

  startNew.addEventListener('click',()=>{
    const accepted=app.newPresentation();
    if(accepted!==false)hideStart();
  });
  startOpen.addEventListener('click',()=>fileInput.click());

  fileInput.addEventListener('change',()=>{
    if(fileInput.files&&fileInput.files.length)waitForOpenCommit(app.session.revision);
  });

  if(menuNew)menuNew.addEventListener('click',()=>{
    const before=app.session.revision;
    setTimeout(()=>{if(app.session.sourceKind==='new'&&app.session.revision>before)hideStart()},0);
  },true);

  document.addEventListener('keydown',event=>{
    if(state.dataset.active!=='true'||!(event.metaKey||event.ctrlKey)||event.key.toLowerCase()!=='n')return;
    const before=app.session.revision;
    setTimeout(()=>{if(app.session.sourceKind==='new'&&app.session.revision>before)hideStart()},0);
  },true);
})();
</script>
