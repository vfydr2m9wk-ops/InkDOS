<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="../../assets/icons/documents.png">
  <meta name="color-scheme" content="light">
  <title>Documents — InkDOS</title>
  <link rel="stylesheet" href="styles.css?v=1.0.0-beta.6">
  <link rel="stylesheet" href="../../shared/office-shell.css?v=1.0.0-beta.6">
  <link rel="stylesheet" href="../../shared/ui/workspace-layout.css?v=1.0.0-beta.6" data-inkdos-ui="inkdos-ui-workspace-layout-css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/icons/office.png">
  <link rel="stylesheet" href="../../shared/ui/app-shell.css?v=1.0.0-beta.6">
  <link rel="stylesheet" href="../../shared/ui/app-home.css?v=1.0.0-beta.6">
</head>
<body class="office-product office-documents" data-inkdos-app="documents">
  <div class="app-shell">
    <header class="topbar">
      <div class="left-tools">
        <a class="icon-btn home-link" href="../../index.html" target="_top" title="InkDOS home" aria-label="Return to InkDOS home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 10.5v9h5v-5h3v5h5v-9"/></svg>
        </a>
        <button id="newBtn" class="icon-btn" type="button" title="New document" aria-label="New document">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <label class="icon-btn" for="fileInput" title="Open document" aria-label="Open document">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10.2a1.8 1.8 0 0 1-1.8 1.8H5.3a1.8 1.8 0 0 1-1.8-1.8z"/><path d="M3.5 9h17"/></svg>
        </label>
        <input id="fileInput" type="file" accept=".docx" hidden>
        <span class="top-divider" aria-hidden="true"></span>
        <button id="undoBtn" class="icon-btn" title="Undo" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
        </button>
        <button id="redoBtn" class="icon-btn" title="Redo" aria-label="Redo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg>
        </button>
        <span class="top-divider" aria-hidden="true"></span>
        <button id="sidebarBtn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/></svg>
        </button>
      </div>

      <div class="document-title">
        <span class="word-badge">W</span>
        <input id="titleText" class="title-input" type="text" value="Untitled.docx" aria-label="Document name" spellcheck="false" autocomplete="off"><span id="dirtyDot" class="dirty-dot" title="Unsaved changes"></span>
      </div>

      <div class="right-tools">
        <button id="saveBtn" class="icon-btn" title="Save" aria-label="Save" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>
        </button>
      </div>
    </header>

    <div id="formatbar" class="formatbar">
      <select id="styleSelect" title="Paragraph style"><option value="p">Normal</option><option value="h1">Title</option><option value="h2">Heading 1</option><option value="h3">Heading 2</option></select>
      <select id="fontSelect" title="Font"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option></select>
      <select id="sizeSelect" title="Font size"><option value="1">8</option><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option></select><select id="lineSpacing" title="Line spacing"><option value="1">1.0</option><option value="1.15" selected>1.15</option><option value="1.5">1.5</option><option value="2">2.0</option></select>
      <span class="separator"></span>
      <button class="fmt-btn" data-cmd="bold" title="Bold"><b>B</b></button><button class="fmt-btn" data-cmd="italic"><i>I</i></button><button class="fmt-btn" data-cmd="underline"><u>U</u></button>
      <span class="separator"></span>
      <select id="alignmentSelect" class="fmt-select" title="Alignment" aria-label="Alignment"><option value="" selected>Align</option><option value="justifyLeft">☰ Left</option><option value="justifyCenter">☰ Center</option><option value="justifyRight">☰ Right</option><option value="justifyFull">☰ Justify</option></select><button class="fmt-btn" data-cmd="outdent" title="Decrease indent" aria-label="Decrease indent">⇤</button><button class="fmt-btn" data-cmd="indent" title="Increase indent" aria-label="Increase indent">⇥</button>
      <span class="separator"></span>
      <button class="fmt-btn" data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">•≡</button><button class="fmt-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list">1≡</button>
      <button id="alphaList" class="fmt-btn" title="Alphabetic list" aria-label="Alphabetic list">A≡</button>
      <span class="separator"></span>
      <button id="tableBtn" class="fmt-btn" title="Insert table" aria-label="Insert table">▦</button><button id="rowBtn" class="fmt-btn" title="Add table row" aria-label="Add table row">▦↧</button><button id="colBtn" class="fmt-btn" title="Add table column" aria-label="Add table column">▦↦</button><label class="fmt-btn file-label" for="imageInput" title="Insert image">Insert</label><input id="imageInput" type="file" accept="image/*" hidden>
    </div>
    <div id="ruler" class="ruler" aria-label="Paragraph ruler"><div class="ruler-track">
      <div id="firstIndent" class="ruler-handle first-line" title="First line indent"></div>
      <div id="hangingIndent" class="ruler-handle hanging" title="Hanging indent"></div>
      <div id="leftIndent" class="ruler-handle left-block" title="Left indent (moves both markers)"></div>
      <div id="rightIndent" class="ruler-handle right-indent" title="Right indent"></div>
      <div class="ticks"></div></div></div>

    <div class="workspace">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-tabs" role="tablist">
          <button class="tab active" data-panel="pagesPanel">Pages</button>
          <button class="tab" data-panel="outlinePanel">Outline</button>
          <button class="tab" data-panel="searchPanel">Search</button>
        </div>
        <div id="pagesPanel" class="side-panel active"><div id="pageList" class="page-list"><p class="muted">Open a DOCX document.</p></div></div>
        <div id="outlinePanel" class="side-panel"><div id="outlineList" class="outline-list"><p class="muted">No outline available.</p></div></div>
        <div id="searchPanel" class="side-panel">
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input id="searchInput" type="search" placeholder="Search document" autocomplete="off">
          </div>
          <div class="search-meta"><span id="searchCount">0 results</span><span><button id="prevHit" class="mini-btn">↑</button><button id="nextHit" class="mini-btn">↓</button></span></div>
          <div id="searchResults" class="search-results"><p class="muted">Type a word or phrase.</p></div>
        </div>
      </aside>

      <main id="viewport" class="viewport" tabindex="0">
        <div id="welcome" class="welcome-card" data-app-home>
          <div class="welcome-icon">W</div>
          <h1>Documents</h1>
          <p>A focused DOCX workspace that runs locally in a browser.</p>
          <div class="welcome-actions inkdos-start-actions">
            <button id="newWelcomeBtn" class="open-primary new-primary inkdos-start-button inkdos-start-new" type="button"><span class="inkdos-start-icon inkdos-plus" aria-hidden="true">+</span><span>New document</span></button>
            <label class="open-primary open-document-primary inkdos-start-button inkdos-start-open" for="fileInput"><span class="inkdos-start-icon inkdos-folder" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 7h6l2 2h9v9.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 10h17"/></svg></span><span>Open document</span></label>
          </div>
          <p class="support-note">DOCX · Local editing · Saving creates a new copy</p>
        </div>
        <div id="pagesHost" class="pages-host" aria-live="polite"></div>
      </main>
    </div>

    <footer class="statusbar">
      <span id="statusText">Ready</span>
      <span id="pageStatus">—</span>
      <span class="status-spacer"></span>
      <div class="document-zoom" aria-label="Document zoom">
        <button id="zoomOut" class="icon-btn" title="Zoom out" aria-label="Zoom out">−</button>
        <input id="zoomSlider" type="range" min="45" max="180" step="5" value="100" aria-label="Zoom level">
        <button id="zoomIn" class="icon-btn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="fitWidth" class="icon-btn wide-icon" title="Fit width" aria-label="Fit width">Fit</button>
        <button id="zoomLabel" class="zoom-label zoom-percent" title="Reset zoom">100%</button>
      </div>
    </footer>
  </div>
  <script src="../../shared/vendor/pako_inflate.min.js?v=1.0.11"></script>
  <script src="../../shared/office-runtime.js?v=1.0.0-beta.6"></script>
  <script src="drawing-layout.js?v=1.0.0-beta.6"></script>
  <script src="docx-parser.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/vendor/jszip.min.js?v=3.10.1"></script>
  <script src="docx-writer.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/ui/workspace-panel-controller.js?v=1.0.0-beta.6" data-inkdos-ui="workspace-panel-controller"></script>
  <script src="../../shared/ui/document-ruler-model.js?v=1.0.0-beta.6" data-inkdos-ui="document-ruler-model"></script>
  <script src="../../shared/ui/document-ruler-drag-controller.js?v=1.0.0-beta.6" data-inkdos-ui="document-ruler-drag-controller"></script>
  <script src="../../shared/ui/workspace-layout.js?v=1.0.0-beta.6" data-inkdos-ui="workspace-layout"></script>
  <script src="../../shared/office-shell.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/product-config.js?v=1.0.0-beta.6"></script>
  <script src="../../modules/module-registry.js?v=1.0.0-beta.6"></script>
  <script src="../../modules/module-loader.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/recent-files.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/file-router.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/app-shell.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/app-home.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/local-recovery.js?v=1.0.0-beta.6"></script><script src="app.js?v=1.0.0-beta.6"></script>
  <script src="../../shared/register-service-worker.js?v=1.0.0-beta.6"></script>
</body>
</html>
