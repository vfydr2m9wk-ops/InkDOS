<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-+j0d5CZaVtB5SJ2+qtCCi6AaKaNs/aVHTyHc2qUIP0o='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; manifest-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fa">
<title>Documents — InkDOS 2.0</title>
<link rel="icon" href="assets/documents.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="runtime/tokens/base.css">
<link rel="stylesheet" href="runtime/frame/app-frame.css">
<link rel="stylesheet" href="ui/editor.css">
<link rel="stylesheet" href="view/document-surface.css">
<style>
/* InkDOS 2.0.1 — app-local first-open card; metrics mirror Spreadsheets. */
.viewport{position:relative}.start-state{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:var(--app-bg,#eef1f5);pointer-events:none}.start-card{width:min(430px,100%);padding:28px;border:1px solid var(--line,#d9dee7);border-radius:22px;background:var(--chrome,#fff);box-shadow:var(--shadow,0 12px 32px rgba(15,23,42,.10));text-align:center;pointer-events:auto}.start-icon{width:68px;height:68px}.start-card h1{margin:14px 0 6px}.start-card p{margin:0 0 18px;color:var(--muted,#697386)}.start-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.start-actions button{min-height:44px;border:1px solid var(--line,#d9dee7);border-radius:11px;background:var(--chrome,#fff);padding:0 16px;color:inherit}.start-actions .primary{background:var(--accent,#4673e8);color:#fff;border-color:var(--accent,#4673e8)}
</style>
  <link rel="stylesheet" href="../../shared/ui-density.css">
  <script src="../../shared/ui-density.js"></script>
  <script src="runtime/platform/file-launch.js" defer></script>
</head>
<body>
<div class="app-shell" id="appShell">
  <header class="topbar" id="topbar">
    <div class="frame-side frame-left">
      <button id="menuBtn" class="frame-btn" type="button" title="Menu" aria-label="Open Documents menu" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button><a class="frame-btn" href="../../index.html" aria-label="Home" title="Home" style="color:inherit;text-decoration:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg></a>
    </div>
    <div class="document-title" id="documentTitle">
      <img src="assets/documents.svg" class="documents-icon" alt="">
      <input id="titleText" class="title-input" value="Untitled.docx" aria-label="Document name" spellcheck="false" autocomplete="off">
      <span id="dirtyDot" class="dirty-dot" aria-hidden="true"></span>
    </div>
    <div class="frame-side frame-right" aria-hidden="true"></div>
  </header>

  <div id="formatbar" class="formatbar command-scroll" tabindex="0" aria-label="Horizontally scrollable editing toolbar">
    <button id="undoBtn" class="fmt-btn icon-only" type="button" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg></button>
    <button id="redoBtn" class="fmt-btn icon-only" type="button" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg></button>
    <button id="printBtn" class="fmt-btn icon-only" type="button" title="Print" aria-label="Print"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><path d="M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></svg></button>
    <button id="formatPainterBtn" class="fmt-btn icon-only" type="button" title="Format painter: copy formatting, then select target and press again" aria-label="Format painter" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12v6H4z"/><path d="M16 7h3v5h-7v8"/><path d="M10 20h4"/></svg></button>
    <button id="contextBtn" class="fmt-btn icon-only" type="button" title="Document panel" aria-label="Open document panel" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/></svg></button>
    <button id="zoomMenuBtn" class="fmt-btn zoom-tool" type="button" title="Zoom" aria-label="Document zoom" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg><span id="zoomToolbarLabel">100%</span></button>
    <span class="separator"></span>
    <select id="styleSelect" title="Paragraph style"><option value="p">Normal</option><option value="h1">Title</option><option value="h2">Heading 1</option><option value="h3">Heading 2</option></select>
    <select id="fontSelect" title="Font"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option></select>
    <select id="sizeSelect" title="Font size"><option value="1">8</option><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option></select>
    <span class="separator"></span>
    <button class="fmt-btn" data-cmd="bold" aria-pressed="false" title="Bold" aria-label="Bold"><b>B</b></button>
    <button class="fmt-btn" data-cmd="italic" aria-pressed="false" title="Italic" aria-label="Italic"><i>I</i></button>
    <button class="fmt-btn" data-cmd="underline" aria-pressed="false" title="Underline" aria-label="Underline"><u>U</u></button>
    <button id="d1FormatBtn" class="fmt-btn" type="button" title="Text color and highlight" aria-label="Text color and highlight">Aa</button>
    <button id="hyperlinkBtn" class="fmt-btn icon-only" type="button" title="Insert or edit hyperlink" aria-label="Insert or edit hyperlink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg></button>
    <button id="commentBtn" class="fmt-btn icon-only" type="button" title="Comment on selected text" aria-label="Comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v11H9l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></button>
    <label class="fmt-btn file-label icon-only" for="imageInput" title="Insert image" aria-label="Insert image">▧</label>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif" hidden>
    <span class="separator"></span>
    <select id="alignmentSelect" title="Alignment"><option value="" selected>Align</option><option value="justifyLeft">Left</option><option value="justifyCenter">Center</option><option value="justifyRight">Right</option><option value="justifyFull">Justify</option></select>
    <select id="lineSpacing" title="Line spacing"><option value="1">1.0</option><option value="1.15" selected>1.15</option><option value="1.5">1.5</option><option value="2">2.0</option></select>
    <button id="checklistBtn" class="fmt-btn" type="button" title="Checklist" aria-label="Checklist">☐≡</button>
    <button class="fmt-btn" data-cmd="insertUnorderedList" title="Bulleted list">•≡</button>
    <button class="fmt-btn" data-cmd="insertOrderedList" title="Numbered list">1≡</button>
    <button class="fmt-btn" data-cmd="outdent" title="Decrease indent">⇤</button>
    <button class="fmt-btn" data-cmd="indent" title="Increase indent">⇥</button>
    <button id="alphaList" class="fmt-btn" title="Alphabetic list">A≡</button>
    <button id="clearFormattingBtn" class="fmt-btn icon-only" type="button" title="Clear formatting" aria-label="Clear formatting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 7-7"/><path d="m14 4 6 6-8 8H6l-2-2 10-12Z"/><path d="M13 20h7"/></svg></button>
    <span class="separator"></span>
    <button id="tableBtn" class="fmt-btn" title="Insert table">▦</button>
    <button id="rowBtn" class="fmt-btn" title="Add row">▦↧</button>
    <button id="colBtn" class="fmt-btn" title="Add column">▦↦</button>
    <span class="toolbar-end-spacer" aria-hidden="true"></span>
  </div>

  <div id="ruler" class="ruler" aria-label="Paragraph ruler"><div class="ruler-track">
    <div id="firstIndent" class="ruler-handle first-line" title="First line indent"></div>
    <div id="hangingIndent" class="ruler-handle hanging" title="Hanging indent"></div>
    <div id="leftIndent" class="ruler-handle left-block" title="Left indent"></div>
    <div id="rightIndent" class="ruler-handle right-indent" title="Right indent"></div>
  </div></div>

  <main id="viewport" class="viewport" tabindex="0" aria-label="Document viewport">
    <div id="welcome" class="start-state">
      <div class="start-card">
        <img src="assets/documents.svg" class="start-icon" alt="">
        <h1>Documents</h1>
        <p>Create a document or open a DOCX, RTF, or legacy DOC file locally.</p>
        <div class="start-actions"><button id="startNew" type="button">New document</button><button id="startOpen" class="primary" type="button">Open document</button></div>
      </div>
    </div>
    <div id="pagesHost" class="pages-host" hidden></div>
  </main>

  <footer class="statusbar">
    <span id="statusText">Ready</span>
    <span id="pageStatus">—</span>
  </footer>

  <input id="fileInput" type="file" accept=".docx,.rtf,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/rtf,application/msword" hidden>

  <div id="menuBackdrop" class="backdrop" hidden></div>
  <aside id="generalMenu" class="drawer general-drawer" role="dialog" aria-modal="true" aria-label="Documents menu" hidden>
    <div class="drawer-head">
      <div class="drawer-title"><img src="assets/documents.svg" class="drawer-icon" alt=""><span>Documents</span></div>
      <button id="closeMenuBtn" class="close-btn" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer-section-label">File</div>
    <div class="menu-list">
      <button id="newMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New document</span><span class="hint">⌘N</span></button>
      <button id="openMenuBtn" class="menu-item" type="button"><svg viewBox="0 0 24 24"><path d="M3.5 7h6l2 2h9v9.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 10h17"/></svg><span>Open document</span><span class="hint">⌘O</span></button>
      <button id="saveMenuBtn" class="menu-item" type="button" disabled><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span>Save copy</span><span class="hint">⌘S</span></button>
    </div>
    <div class="drawer-section"><div class="drawer-section-label">Appearance</div>
      <div class="appearance-switch" role="group" aria-label="App appearance">
        <button class="appearance-choice" type="button" data-appearance-choice="light" aria-pressed="false">Light</button>
        <button class="appearance-choice" type="button" data-appearance-choice="dark" aria-pressed="false">Dark</button>
        <button class="appearance-choice" type="button" data-appearance-choice="system" aria-pressed="false">System</button>
      </div>
    </div>
  </aside>

  <div id="contextBackdrop" class="backdrop" hidden></div>
  <aside id="contextDrawer" class="drawer context-drawer" role="dialog" aria-modal="true" aria-label="Document panel" hidden>
    <div class="drawer-head">
      <div class="drawer-title"><span>Document</span></div>
      <button id="closeContextBtn" class="close-btn" type="button" aria-label="Close document panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sidebar-tabs" role="tablist">
      <button class="tab active" data-panel="pagesPanel">Pages</button>
      <button class="tab" data-panel="outlinePanel">Outline</button>
      <button class="tab" data-panel="searchPanel">Search</button>
    </div>
    <div id="pagesPanel" class="side-panel active"><div id="pageList"><p class="muted">Open a DOCX document.</p></div></div>
    <div id="outlinePanel" class="side-panel"><div id="outlineList"><p class="muted">No outline available.</p></div></div>
    <div id="searchPanel" class="side-panel"><div class="search-box"><input id="searchInput" type="search" placeholder="Search document"></div><div class="search-meta"><span id="searchCount">0 results</span><span><button id="prevHit" class="mini-btn">↑</button><button id="nextHit" class="mini-btn">↓</button></span></div><div id="searchResults"><p class="muted">Type a word or phrase.</p></div></div>
  </aside>

  <div id="zoomPopover" class="zoom-popover" role="dialog" aria-label="Document zoom" hidden>
    <div class="zoom-head"><strong>Zoom</strong><output id="zoomOutput" for="zoomSlider">100%</output></div>
    <div class="zoom-row"><button id="zoomOut" class="zoom-round" type="button" aria-label="Zoom out">−</button><input id="zoomSlider" type="range" min="25" max="400" step="5" value="100" aria-label="Zoom percentage"><button id="zoomIn" class="zoom-round" type="button" aria-label="Zoom in">+</button></div>
    <div class="zoom-presets"><button id="fitWidth" type="button">Fit width</button><button id="fitPage" type="button">Fit page</button><button id="zoom100" type="button">100%</button></div>
    <small>25–400% · 5% steps</small>
  </div>
</div>
<script src="state/appearance.js"></script>
<script src="engine/document-session.js"></script>
<script src="engine/document-state.js"></script>
<script src="engine/page-spec.js"></script>
<script src="runtime/frame/frame-menu.js"></script>
<script src="runtime/platform/content-viewport-adapter.js"></script>
<script src="io/file-delivery.js"></script>
<script src="vendor/pako_inflate.min.js"></script>
<script src="io/package-reader.js"></script>
<script src="view/drawing-layout.js"></script>
<script src="engine/docx-parser.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="io/docx-writer.js"></script>
<script src="view/zoom-controller.js"></script>
<script src="view/pagination-engine.js"></script>
<script src="ui/chrome-controller.js"></script>
<script src="ui/navigation-panel.js"></script>
<script src="view/page-surface.js"></script>
<script src="ui/editor-controller.js"></script>
<script src="ui/ruler-controller.js"></script>
<script src="ui/zoom-controls.js"></script>
<script src="ui/session-dialog.js"></script>
<script src="io/legacy-doc-reader.js"></script>
<script src="io/file-open-controller.js"></script>
<script src="io/save-controller.js"></script>
<script src="ui/command-controller.js"></script>
<script src="help/help.js"></script>
<script src="app.js"></script>
<script>
(function(){const n=document.getElementById('startNew'),o=document.getElementById('startOpen');if(n)n.addEventListener('click',()=>document.getElementById('newMenuBtn')?.click());if(o)o.addEventListener('click',()=>document.getElementById('openMenuBtn')?.click());})();
</script>

</body></html>
