<!doctype html>
<html lang="en" data-appearance-mode="system" data-appearance-resolved="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><title>Spreadsheets — InkDOS 2.0</title>
<link rel="icon" href="assets/spreadsheets.svg"><link rel="stylesheet" href="runtime/tokens/base.css"><link rel="stylesheet" href="runtime/frame/app-frame.css"><link rel="stylesheet" href="ui/editor-toolbar.css"><link rel="stylesheet" href="view/grid-surface.css">
</head>
<body>
<input id="fileInput" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<main class="app-shell">
<header class="topbar">
<div class="frame-side frame-left"><button id="menuButton" class="frame-btn" type="button" aria-label="App menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a class="frame-btn" href="../../index.html" aria-label="Home" title="Home" style="color:inherit;text-decoration:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg></a></div>
<div class="document-title"><img class="spreadsheets-icon" src="assets/spreadsheets.svg" alt=""><input id="docTitle" class="title-input" value="Untitled.xlsx" aria-label="Workbook name" spellcheck="false"><span id="dirtyDot" class="dirty-dot" aria-hidden="true"></span></div>
<div class="frame-side frame-right"></div>
</header>
<div id="formatbar" class="formatbar command-scroll" tabindex="0" aria-label="Horizontally scrollable spreadsheet editing toolbar">
<button id="undoBtn" class="fmt-btn icon-only" type="button" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg></button>
<button id="redoBtn" class="fmt-btn icon-only" type="button" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg></button>
<button id="zoomMenuBtn" class="fmt-btn zoom-tool" type="button" title="Zoom" aria-label="Spreadsheet zoom" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg><span id="zoomToolbarLabel">100%</span></button>
<span class="separator"></span>
<select id="fontFamily" title="Font"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option></select>
<select id="fontSize" title="Font size"><option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option></select>
<span class="separator"></span>
<button id="boldBtn" class="fmt-btn" type="button" title="Bold" aria-label="Bold"><b>B</b></button><button id="italicBtn" class="fmt-btn" type="button" title="Italic" aria-label="Italic"><i>I</i></button><button id="underlineBtn" class="fmt-btn" type="button" title="Underline" aria-label="Underline"><u>U</u></button>
<span class="separator"></span>
<select id="alignmentSelect" title="Alignment" aria-label="Cell alignment"><option value="" selected>Align</option><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
<button id="mergeBtn" class="fmt-btn" type="button" title="Merge or unmerge selected cells">Merge</button>
<span class="separator"></span>
<button id="addRowBtn" class="fmt-btn" type="button" title="Insert row below" aria-label="Insert row below">▦↧</button><button id="addColBtn" class="fmt-btn" type="button" title="Insert column right" aria-label="Insert column right">▦↦</button><button id="clearBtn" class="fmt-btn" type="button" title="Clear selected cells">Clear</button><button id="deleteRowBtn" class="fmt-btn" type="button" title="Delete selected rows">− Row</button><button id="deleteColBtn" class="fmt-btn" type="button" title="Delete selected columns">− Column</button>
<select id="operationSelect" title="Operations"><option value="">Operations…</option><option value="sum">AutoSum</option><option value="average">Average</option><option value="min">Minimum</option><option value="max">Maximum</option><option value="count">Count</option><option value="multiply">Multiply by…</option><option value="divide">Divide by…</option><option value="percent">Convert to %</option></select><button id="gridlinesBtn" class="fmt-btn icon-only" type="button" title="Show or hide gridlines" aria-label="Show or hide gridlines"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg></button>
<span class="toolbar-end-spacer" aria-hidden="true"></span>
</div>
<section class="formula-bar" aria-label="Cell and formula editor"><input id="nameBox" class="name-box" value="A1" aria-label="Cell reference"><span class="fx">fx</span><input id="formulaInput" class="formula-input" aria-label="Formula or cell value" autocomplete="off" spellcheck="false" placeholder="Type a value or formula"><select id="functionSelect" class="formula-functions" aria-label="Insert function"><option value="">Functions…</option><option>SUM</option><option>AVERAGE</option><option>MIN</option><option>MAX</option><option>COUNT</option></select></section>
<section id="contentViewport" class="content-viewport" tabindex="0" aria-label="Spreadsheet grid"><div id="gridStage" class="grid-stage"></div><div id="startState" class="start-state"><div class="start-card"><img src="assets/spreadsheets.svg" alt=""><h1>Spreadsheets</h1><p>Create a workbook or open an XLS/XLSX file locally.</p><div class="start-actions"><button id="startNew" type="button">New workbook</button><button id="startOpen" class="primary" type="button">Open workbook</button></div></div></div></section>
<footer class="bottom-shell"><div id="sheetTabs" class="sheet-tabs"></div><div class="status-area"><span id="statusText">Ready</span><span id="selectionStats">A1</span></div></footer>
</main>
<div id="drawerBackdrop" class="backdrop" hidden></div><aside id="appDrawer" class="drawer" hidden aria-label="Spreadsheet menu"><div class="drawer-head"><div class="drawer-title"><img class="drawer-icon" src="assets/spreadsheets.svg" alt="">Spreadsheets</div><button id="drawerClose" class="close-btn" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="drawer-section-label">File</div><div class="menu-list"><button id="menuNew" class="menu-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New workbook</span><span class="hint">⌘N</span></button><button id="menuOpen" class="menu-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h6l2 2h9v9.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 10h17"/></svg><span>Open workbook</span><span class="hint">⌘O</span></button><button id="menuSave" class="menu-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span>Save XLSX copy</span><span class="hint">⌘S</span></button></div><div class="drawer-section"><div class="drawer-section-label">Appearance</div><div class="appearance-switch"><button class="appearance-choice" data-appearance-choice="light">Light</button><button class="appearance-choice" data-appearance-choice="dark">Dark</button><button class="appearance-choice" data-appearance-choice="system">System</button></div></div><div class="drawer-section"><div class="drawer-section-label">Local-first</div><div class="hint">XLS/XLSX are processed locally. Saving creates an XLSX copy and never overwrites the source.</div></div></aside>
<div id="zoomPopover" class="zoom-popover" role="dialog" aria-label="Spreadsheet zoom" hidden>
<div class="zoom-head"><strong>Zoom</strong><output id="zoomOutput" for="zoomSlider">100%</output></div>
<div class="zoom-row"><button id="zoomOut" class="zoom-round" type="button" aria-label="Zoom out">−</button><input id="zoomSlider" type="range" min="25" max="400" step="5" value="100" aria-label="Zoom percentage"><button id="zoomIn" class="zoom-round" type="button" aria-label="Zoom in">+</button></div>
<div class="zoom-presets"><button id="fitWidth" type="button">Fit width</button><button id="zoom100" type="button">100%</button></div>
<small>25–400% · 5% steps</small>
</div><div id="loadingOverlay" class="loading-overlay" hidden><div class="loading-card"><strong id="loadingLabel">Opening workbook…</strong></div></div><div id="errorOverlay" class="error-overlay" hidden><div class="error-card"><h2>Workbook could not be opened</h2><p id="errorMessage"></p><div class="error-actions"><button id="errorClose" type="button">Close</button></div></div></div><div id="toast" class="toast" role="status"></div><div id="resizeGuide" class="resize-guide" hidden></div><div id="resizeBadge" class="resize-badge" hidden></div>
<script src="vendor/jszip.min.js"></script><script src="vendor/pako_inflate.min.js"></script><script src="io/package-validator.js"></script><script src="io/worksheet-package.js"></script><script src="io/xls-biff8-engine.js"></script><script src="io/xlsx-engine.js"></script><script src="runtime/frame/frame-menu.js"></script><script src="runtime/platform/content-viewport-adapter.js"></script><script src="state/appearance.js"></script><script src="engine/geometry/grid-geometry.js"></script><script src="engine/workbook-session.js"></script><script src="engine/selection-model.js"></script><script src="engine/history.js"></script><script src="engine/formula/arithmetic.js"></script><script src="engine/formula/evaluator.js"></script><script src="engine/workbook-editor.js"></script><script src="view/grid-surface.js"></script><script src="view/zoom-controller.js"></script><script src="ui/zoom-controls.js"></script><script src="ui/session-dialog.js"></script><script src="ui/worksheet-tabs.js"></script><script src="ui/formula-bar.js"></script><script src="ui/chrome-controller.js"></script><script src="ui/editor-controller.js"></script><script src="io/file-open-controller.js"></script><script src="io/file-delivery.js"></script><script src="io/save-controller.js"></script><script src="ui/file-menu-controller.js"></script><script src="app.js"></script>
</body></html>
