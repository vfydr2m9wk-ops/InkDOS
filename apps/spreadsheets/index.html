<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <link rel="icon" href="../../assets/icons/spreadsheets.png"><title>Spreadsheets — InkDesk 0.20.3.1</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="formula-reference.css?v=0.20.3.0"><link rel="stylesheet" href="formula-editor.css?v=0.20.3.0"><link rel="stylesheet" href="../../shared/office-shell.css">  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/icons/office.png">
</head><body class="office-product office-spreadsheets">
<input id="fileInput" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<header class="titlebar"><div class="left"><a class="icon-btn home-link" href="../../index.html" target="_top" title="InkDesk home" aria-label="Return to InkDesk home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 10.5v9h5v-5h3v5h5v-9"/></svg></a><button id="newBtn" class="icon-btn" title="New workbook" aria-label="New workbook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="openBtn" class="icon-btn" title="Open workbook" aria-label="Open workbook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/><path d="M3 9h18"/></svg></button><span class="top-divider" aria-hidden="true"></span><button id="undoBtn" class="icon-btn" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg></button><button id="redoBtn" class="icon-btn" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg></button></div><div class="document-title"><span class="office-badge" aria-hidden="true">S</span><input id="docTitle" class="title-input" type="text" value="Untitled.xlsx" aria-label="Workbook name" spellcheck="false" autocomplete="off"><span id="dirtyDot" hidden> •</span></div><div class="right"><button id="saveBtn" class="icon-btn save" type="button" title="Save XLSX copy" aria-label="Save XLSX copy" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3.5h11.5L20 7v13.5H4V3.5z"/><path d="M8 3.5V9h8V3.5"/><path d="M8 20.5v-7h8v7"/></svg></button></div></header>
<section class="toolbar" aria-label="Formatting toolbar">
<select id="fontFamily" title="Font"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option></select>
<select id="fontSize" title="Font size"><option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option></select>
<span class="separator"></span><button id="boldBtn" title="Bold"><b>B</b></button><button id="italicBtn" title="Italic"><i>I</i></button><button id="underlineBtn" title="Underline"><u>U</u></button>
<span class="separator"></span><button id="alignLeftBtn" title="Align left">≡</button><button id="alignCenterBtn" title="Align center">≡</button><button id="alignRightBtn" title="Align right">≡</button>
<span class="separator"></span><button id="mergeBtn" title="Merge or unmerge selected cells">Merge</button><button id="addRowBtn" title="Insert row below">+ Row</button><button id="addColBtn" title="Insert column right">+ Column</button><button id="deleteBtn" title="Clear selected cells">Clear</button><button id="deleteRowBtn" title="Delete selected rows">− Row</button><button id="deleteColBtn" title="Delete selected columns">− Column</button><select id="operationSelect" title="Operations"><option value="">Operations…</option><option value="sum">AutoSum</option><option value="average">Average</option><option value="multiply">Multiply by…</option><option value="divide">Divide by…</option><option value="percent">Convert to %</option></select>
<span class="view-switch" role="group" aria-label="View mode"><button id="gridMode" class="active" type="button">Sheet</button><button id="formMode" type="button">Page</button></span><button id="gridlinesBtn" class="gridlines-toggle" type="button" title="Show or hide gridlines">Gridlines</button><span class="viewer-label">InkDesk 0.20.3.1</span></section>
<section class="formula-row"><input id="nameBox" value="A1" aria-label="Cell reference"><span class="fx">fx</span><div class="formula-editor"><input id="formulaInput" aria-label="Formula bar" aria-describedby="formulaHint formulaReferenceStatus" autocomplete="off" spellcheck="false" placeholder="Type a value or formula"><span id="formulaHint" hidden>Formula editing help is shown in the status bar.</span><div id="formulaSuggestions" class="formula-suggestions" role="listbox" hidden></div></div><button id="addFormulaRangeBtn" class="formula-range-add" type="button" title="Add another formula reference" aria-label="Add another formula reference" hidden>+ Range</button></section>
<main id="workspace"><div id="emptyState" class="start-screen"><div class="start-card"><div class="app-badge">S</div><h1>Spreadsheets</h1><p>Create a blank workbook or open an Excel file locally.</p><div class="start-actions"><button id="newEmptyBtn" class="start-btn primary"><span class="ico">+</span><span>New Spreadsheet</span></button><button id="openEmptyBtn" class="start-btn secondary"><span class="ico folder" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg></span><span>Open Spreadsheet</span></button></div><small>XLS / XLSX · Local editing · Saving creates an XLSX copy</small></div></div><div id="gridViewport" tabindex="0" hidden><div id="pageCanvas"><div id="grid"></div></div></div></main>
<footer><div id="sheetTabs"></div><div class="status"><span id="selectionStats">Ready</span><span id="formulaReferenceStatus" class="formula-reference-status" role="status" aria-live="polite" hidden></span><div class="zoom-controls"><button id="zoomOut" aria-label="Zoom out">−</button><input id="zoomSlider" type="range" min="50" max="200" step="10" value="100" aria-label="Zoom"><button id="zoomIn" aria-label="Zoom in">+</button><button id="fitWidth" aria-label="Fit width">Fit</button><span id="zoomLabel">100%</span></div></div></footer>
<div id="resizeGuide" hidden></div><div id="resizeBadge" hidden></div><div id="toast" role="status"></div><div id="loading" hidden><div class="spinner"></div><span>Opening workbook…</span></div>
<div id="savePanel" hidden><div class="save-card"><h2>Save a copy</h2><p id="saveMessage">Your original workbook will not be overwritten.</p><button id="downloadBtn">Save XLSX copy</button><button id="closeSaveBtn" class="secondary">Cancel</button></div></div>
<script src="../../shared/office-runtime.js?v=0.20.3.0"></script><script src="../../shared/file-lifecycle.js?v=0.20.3.0"></script><script src="../../shared/file-router.js?v=0.20.3.0"></script><script src="../../shared/formula-engine.js?v=0.20.3.0"></script><script src="../../shared/vendor/jszip.min.js?v=3.10.1"></script><script src="xls-biff8-engine.js"></script><script src="xlsx-engine.js"></script><script src="../../shared/office-shell.js?v=0.20.3.1"></script><script src="../../shared/local-recovery.js?v=0.20.3.0"></script><script src="formula-safety.js?v=0.20.3.0"></script><script src="history-controller.js?v=0.20.3.0"></script><script src="app.js?v=0.20.3.0"></script><script src="formula-model.js?v=0.20.3.0"></script><script src="formula-session.js?v=0.20.3.0"></script><script src="formula-reference.js?v=0.20.3.0"></script><script src="formula-editor.js?v=0.20.3.0"></script>  <script src="../../shared/register-service-worker.js?v=0.20.3.0"></script>
</body></html>
