<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="InkDesk v1.0.0-beta.1 local-first workspaces for DOCX, XLS/XLSX, PPTX, PDF, TXT and EPUB.">
  <meta property="og:title" content="InkDesk v1.0.0-beta.1">
  <meta property="og:description" content="A consolidated local-first productivity suite.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://vfydr2m9wk-ops.github.io/InkDesk/docs/images/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>InkDesk v1.0.0-beta.1</title>
  <link rel="icon" href="./assets/icons/office.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/office.png">
  <link rel="stylesheet" href="./shared/hub.css?v=1.0.0-beta.1">
  <link rel="stylesheet" href="./shared/ui/visual-foundation-v0203.css?v=1.0.0-beta.1">
  <link rel="stylesheet" href="./shared/ui/light-only.css?v=stability-1">
</head>
<body>
  <main class="hub-shell">
    <header class="hub-topbar">
      <a class="brand-lockup" href="./index.html" aria-label="InkDesk home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy"><strong>InkDesk</strong><small>Local-first workspace</small></span>
      </a>
      <span class="release-badge">v1.0.0-beta.1</span>
    </header>

    <section class="hub-intro" aria-labelledby="hubTitle">
      <h1 id="hubTitle">Choose a workspace</h1>
    </section>

    <p id="moduleRegistryStatus" class="module-registry-status" role="status" aria-live="polite" hidden></p>

    <section class="workspace-grid" data-module-grid aria-label="InkDesk workspaces">
      <a class="workspace-card documents" href="./apps/documents/index.html"><span class="app-icon">D</span><span class="workspace-copy"><strong>Documents</strong><small>DOCX</small></span><span class="open-arrow">›</span></a>
      <a class="workspace-card spreadsheets" href="./apps/spreadsheets/index.html"><span class="app-icon">S</span><span class="workspace-copy"><strong>Spreadsheets</strong><small>XLS · XLSX</small></span><span class="open-arrow">›</span></a>
      <a class="workspace-card presentations" href="./apps/presentations/index.html"><span class="app-icon">P</span><span class="workspace-copy"><strong>Presentations</strong><small>PPTX</small></span><span class="open-arrow">›</span></a>
      <a class="workspace-card pdf" href="./apps/pdf/index.html"><span class="app-icon">PDF</span><span class="workspace-copy"><strong>PDF Workspace</strong><small>PDF</small></span><span class="open-arrow">›</span></a>
      <a class="workspace-card txt" href="./apps/txt/index.html"><span class="app-icon">TXT</span><span class="workspace-copy"><strong>Plain Text</strong><small>TXT</small></span><span class="open-arrow">›</span></a>
      <a class="workspace-card epub" href="./apps/epub/index.html"><span class="app-icon">EPUB</span><span class="workspace-copy"><strong>EPUB Reader</strong><small>EPUB</small></span><span class="open-arrow">›</span></a>
    </section>

    <footer class="hub-footer">
      <div class="footer-status"><span class="status-dot" aria-hidden="true"></span><span>v1.0.0-beta.1</span></div>
      <nav aria-label="Project links"><a href="https://github.com/vfydr2m9wk-ops/InkDesk">Source</a><a href="./docs/PROJECT_STATUS.md">Status</a><a href="./docs/KNOWN_LIMITATIONS.md">Limitations</a><a href="./CONTRIBUTING.md">Contribute</a></nav>
    </footer>
  </main>
  <noscript><p class="noscript-message">InkDesk requires JavaScript.</p></noscript>
  <script src="./modules/module-registry.js?v=1.0.0-beta.1"></script>
  <script src="./modules/module-loader.js?v=1.0.0-beta.1"></script>
  <script defer src="./shared/register-service-worker.js?v=1.0.0-beta.1"></script>
</body>
</html>
