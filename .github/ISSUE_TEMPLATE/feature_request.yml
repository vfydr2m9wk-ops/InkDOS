name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the user problem before the solution}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Offline, compatibility, and architectural impact}
    validations: {required: true}
