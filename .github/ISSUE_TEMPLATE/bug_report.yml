name: Bug report
description: Report a reproducible InkDOS defect
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: InkDOS version, placeholder: "1.0.0-beta.4"}
    validations: {required: true}
  - type: dropdown
    id: workspace
    attributes: {label: Workspace, options: [Application shell, Documents, Spreadsheets, Presentations, PDF, Plain Text, EPUB, Shared components]}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: Browser/version, OS, device, and launch mode}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior and console output}
    validations: {required: true}
