name: Bug report
description: Report a reproducible InkDOS defect.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: InkDOS version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
