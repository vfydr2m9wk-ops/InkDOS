name: InkDOS integrity and update

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Root ZIP name. Leave empty when only one InkDOS-update-v*.zip exists.
        required: false
        type: string
      dry_run:
        description: Validate without committing or removing the ZIP.
        required: true
        default: false
        type: boolean
      validation_profile:
        description: Validation level. "package" uses the level declared by the ZIP.
        required: true
        default: package
        type: choice
        options:
          - package
          - standard
          - full
  push:
    branches:
      - main
    paths-ignore:
      - 'InkDOS-update-v*.zip'
      - 'InkDOS-update-v*.zip.sha256'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: inkdos-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Validate repository
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          if command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_PATH={playwright.chromium.executable_path}")
          PY
          fi

      - name: Verify generated metadata is current
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_metadata.py
          git diff --exit-code -- BUILD_INFO.json SOURCE_MANIFEST.json RELEASE_MANIFEST.json

      - name: Run complete integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_no_legacy_runtime.py
          python scripts/run_release_validation.py

  validate-update:
    name: Validate update package without write credentials
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
      base_sha: ${{ steps.package.outputs.base_sha }}
      label: ${{ steps.report.outputs.label }}
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          if command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_PATH={playwright.chromium.executable_path}")
          PY
          fi

      - name: Select immutable package input
        id: package
        shell: bash
        env:
          REQUESTED_PACKAGE: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_PACKAGE}" ]]; then
            if [[ "${REQUESTED_PACKAGE}" == */* || "${REQUESTED_PACKAGE}" == *\\* ]]; then
              echo "package_name must be a root file name, not a path." >&2
              exit 1
            fi
            package="${REQUESTED_PACKAGE}"
            [[ -f "${package}" ]] || { echo "Package not found: ${package}" >&2; exit 1; }
          else
            mapfile -t packages < <(find . -maxdepth 1 -type f -name 'InkDOS-update-v*.zip' -printf '%f\n' | sort)
            if [[ ${#packages[@]} -ne 1 ]]; then
              echo "Expected exactly one root InkDOS-update-v*.zip, found ${#packages[@]}." >&2
              printf '%s\n' "${packages[@]:-}" >&2
              exit 1
            fi
            package="${packages[0]}"
          fi
          cp -- "${package}" /tmp/update-package.zip
          echo "package_name=${package}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum /tmp/update-package.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate package transaction with trusted updater
        id: validate_package
        shell: bash
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        run: |
          set -euo pipefail
          args=(
            --package /tmp/update-package.zip
            --repo "${GITHUB_WORKSPACE}"
            --report /tmp/update-report.json
            --dry-run
          )
          if [[ "${VALIDATION_PROFILE}" != "package" ]]; then
            args+=(--validation-profile "${VALIDATION_PROFILE}")
          fi
          python scripts/apply_update_package.py "${args[@]}"

      - name: Export validated package metadata
        id: report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/update-report.json').read_text(encoding='utf-8'))
          print(f"label={report['packageLabel']}")
          PY

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import json
          try:
              report = json.loads(Path('/tmp/update-report.json').read_text(encoding='utf-8'))
          except Exception:
              report = {}
          status = report.get('status', 'failed')
          print('## InkDOS update validation')
          print()
          print(f"- Status: **{status}**")
          print(f"- Package SHA-256: `${{ steps.package.outputs.sha256 }}`")
          if report.get('packageLabel'):
              print(f"- Package: `{report['packageLabel']}`")
          if report.get('validationProfile'):
              print(f"- Validation profile: `{report['validationProfile']}`")
          if report.get('error'):
              print(f"- Error: `{report['error']}`")
          print('- Repository write credentials: **not granted to this job**')
          PY

  apply-update:
    name: Apply prevalidated package
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    needs:
      - validate-update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the exact validated main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-update.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reverify immutable package bytes
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate-update.outputs.package_name }}
          EXPECTED_SHA256: ${{ needs.validate-update.outputs.sha256 }}
          EXPECTED_BASE_SHA: ${{ needs.validate-update.outputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_BASE_SHA}" ]] || {
            echo "Validated base commit mismatch." >&2
            exit 1
          }
          [[ -f "${PACKAGE_NAME}" ]] || {
            echo "Validated package is missing from the validated base commit." >&2
            exit 1
          }
          actual="$(sha256sum "${PACKAGE_NAME}" | awk '{print $1}')"
          [[ "${actual}" == "${EXPECTED_SHA256}" ]] || {
            echo "Package SHA-256 changed after validation." >&2
            exit 1
          }
          cp -- "${PACKAGE_NAME}" /tmp/update-package.zip

      - name: Apply with repository-trusted updater only
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_update_package.py \
            --package /tmp/update-package.zip \
            --repo "${GITHUB_WORKSPACE}" \
            --report /tmp/update-report.json \
            --validation-profile none

      - name: Commit and push applied update
        id: commit
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate-update.outputs.package_name }}
          PACKAGE_LABEL: ${{ needs.validate-update.outputs.label }}
          BASE_SHA: ${{ needs.validate-update.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          remote_base="$(git rev-parse origin/main)"
          if [[ "${remote_base}" != "${BASE_SHA}" ]]; then
            echo "main changed after package validation. Start a new validation run." >&2
            exit 1
          fi

          rm -- "${PACKAGE_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --name-only | grep -Eiq '^(\.github/|scripts/|tests/|requirements-ci\.txt$|pyproject\.toml$|pytest\.ini$|tox\.ini$|\.coveragerc$)'; then
            echo "Refusing to commit a trusted control-plane mutation from an update package." >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No repository changes were produced." >&2
            exit 1
          fi

          git commit -m "Apply InkDOS update ${PACKAGE_LABEL}"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        id: pages
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Write application summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import json
          try:
              report = json.loads(Path('/tmp/update-report.json').read_text(encoding='utf-8'))
          except Exception:
              report = {}
          print('## InkDOS update application')
          print()
          print(f"- Package: `${{ needs.validate-update.outputs.label }}`")
          print(f"- Package SHA-256: `${{ needs.validate-update.outputs.sha256 }}`")
          print(f"- Validated base: `${{ needs.validate-update.outputs.base_sha }}`")
          print(f"- Apply status: **{report.get('status', 'unknown')}**")
          print(f"- Commit: `${{ steps.commit.outputs.commit_sha }}`")
          print('- Candidate validation occurred in a separate read-only job.')
          print('- This write-capable job executed only the repository-trusted updater.')
          PY
