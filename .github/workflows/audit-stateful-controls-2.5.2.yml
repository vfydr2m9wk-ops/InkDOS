name: Audit InkDOS 2.5.2 Stateful Control Surfaces

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/test_online_stateful_control_surfaces_browser.py'
      - '.github/workflows/audit-stateful-controls-2.5.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateful-control-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Audit stateful controls on published GitHub Pages
        env:
          INKDOS_ONLINE_BASE: https://vfydr2m9wk-ops.github.io/InkDOS/
          INKDOS_STATEFUL_OUT: audit-stateful-controls
        run: python tests/test_online_stateful_control_surfaces_browser.py
      - name: Upload stateful control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InkDOS-2.5.2-stateful-control-audit
          path: audit-stateful-controls/
          if-no-files-found: warn
          retention-days: 14
