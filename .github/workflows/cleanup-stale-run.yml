name: Cleanup stale legacy run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-stale-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STALE_RUN: '31126506784'
    steps:
      - name: Remove stale queued InkDesk run
        shell: bash
        run: |
          set -euo pipefail
          if gh api --method DELETE "repos/$REPO/actions/runs/$STALE_RUN" >/dev/null 2>&1; then
            echo "Deleted stale run $STALE_RUN directly."
            exit 0
          fi
          gh api --method POST "repos/$REPO/actions/runs/$STALE_RUN/force-cancel" >/dev/null 2>&1 || \
            gh api --method POST "repos/$REPO/actions/runs/$STALE_RUN/cancel" >/dev/null 2>&1 || true
          sleep 2
          gh api --method DELETE "repos/$REPO/actions/runs/$STALE_RUN" >/dev/null
          echo "Deleted stale run $STALE_RUN after cancellation."
