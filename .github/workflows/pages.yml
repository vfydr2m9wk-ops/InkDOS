name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run release integrity and quality checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p "test_*.py"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/_site/' \
            --exclude='*.zip' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
