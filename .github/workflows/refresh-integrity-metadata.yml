name: Refresh integrity metadata

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'polish/**'
      - 'audit/stability-functional-isolation'
    paths-ignore:
      - 'CHECKSUMS.sha256'
      - 'SOURCE_LOCK.json'
      - 'BUILD_INFO.json'
      - 'SOURCE_MANIFEST.json'
      - 'RELEASE_MANIFEST.json'

permissions:
  contents: read

concurrency:
  group: inkdos-integrity-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Generate and validate metadata without write credentials
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.patch.outputs.base_sha }}
      changed: ${{ steps.patch.outputs.changed }}
      patch_b64: ${{ steps.patch.outputs.patch_b64 }}
      patch_sha256: ${{ steps.patch.outputs.patch_sha256 }}
    steps:
      - name: Check out branch without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build Plain Text distribution
        run: python scripts/build_txt_bundle.py

      - name: Generate hash-based CSP metadata
        run: python scripts/generate_csp.py

      - name: Refresh integrated app locks outside active stability audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          stability_path = root / 'STABILITY_STATE.json'
          if stability_path.is_file():
              stability = json.loads(stability_path.read_text(encoding='utf-8'))
              if stability.get('active') is True and stability.get('program') == 'stability-functional-isolation':
                  print('Active stability audit: preserving SOURCE_LOCK.json as the approved main baseline.')
                  raise SystemExit(0)

          lock_path = root / 'SOURCE_LOCK.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          version = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))['version']

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def tree_digest(path, exclude=()):
              path = Path(path)
              excluded = set(exclude)
              digest = hashlib.sha256()
              for item in sorted(path.rglob('*')):
                  if not item.is_file():
                      continue
                  rel = item.relative_to(path).as_posix()
                  if rel in excluded:
                      continue
                  rel_bytes = rel.encode()
                  digest.update(len(rel_bytes).to_bytes(4, 'big'))
                  digest.update(rel_bytes)
                  digest.update(bytes.fromhex(sha(item)))
              return digest.hexdigest()

          lock['release'] = version
          for app, entry in lock['apps'].items():
              app_root = root / 'apps' / app
              entry['integratedIndexSha256'] = sha(app_root / 'index.html')
              entry['nonIndexTreeSha256'] = tree_digest(app_root, exclude=('index.html',))

          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Refresh generated release metadata
        run: python scripts/generate_release_metadata.py

      - name: Refresh checksums
        run: python scripts/generate_checksums.py

      - name: Validate frozen stability lifecycle
        run: python tests/test_stability_freeze_contract.py

      - name: Validate refreshed snapshot
        run: python scripts/run_release_validation.py

      - name: Restrict generated changes to integrity and entry-point outputs
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(index\.html|apps/(documents|spreadsheets|presentations|pdf|txt|epub)/index\.html|SOURCE_LOCK\.json|BUILD_INFO\.json|SOURCE_MANIFEST\.json|RELEASE_MANIFEST\.json|CHECKSUMS\.sha256)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Integrity refresh produced an unauthorized path: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only)
          git diff --check

      - name: Export validated immutable patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- \
            index.html \
            apps/documents/index.html \
            apps/spreadsheets/index.html \
            apps/presentations/index.html \
            apps/pdf/index.html \
            apps/txt/index.html \
            apps/epub/index.html \
            SOURCE_LOCK.json \
            BUILD_INFO.json \
            SOURCE_MANIFEST.json \
            RELEASE_MANIFEST.json \
            CHECKSUMS.sha256 > /tmp/integrity.patch
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          data = Path('/tmp/integrity.patch').read_bytes()
          packed = gzip.compress(data, compresslevel=9, mtime=0)
          print('base_sha=' + subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          print('changed=' + ('true' if data else 'false'))
          print('patch_sha256=' + hashlib.sha256(data).hexdigest())
          print('patch_b64=' + base64.b64encode(packed).decode('ascii'))
          PY

      - name: Record validation handoff
        shell: bash
        run: |
          {
            echo '### Integrity refresh handoff'
            echo
            echo 'Generated entry-point/CSP and integrity metadata was produced and validated with read-only repository permissions.'
            echo 'The write-capable job will only apply this validated patch to the same branch head and will not execute repository scripts.'
          } >> "$GITHUB_STEP_SUMMARY"

  commit:
    name: Apply validated metadata patch
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact validated branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Verify branch has not changed
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          remote_sha="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [[ "$remote_sha" != "$BASE_SHA" ]]; then
            echo "Branch changed after metadata validation; refusing stale write." >&2
            exit 1
          fi

      - name: Apply validated metadata patch only
        shell: bash
        env:
          PATCH_B64: ${{ needs.prepare.outputs.patch_b64 }}
          PATCH_SHA256: ${{ needs.prepare.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/integrity.patch
          actual="$(sha256sum /tmp/integrity.patch | awk '{print $1}')"
          [[ "$actual" == "$PATCH_SHA256" ]] || {
            echo "Validated metadata patch SHA-256 mismatch." >&2
            exit 1
          }
          git apply --check /tmp/integrity.patch
          git apply /tmp/integrity.patch
          allowed='^(index\.html|apps/(documents|spreadsheets|presentations|pdf|txt|epub)/index\.html|SOURCE_LOCK\.json|BUILD_INFO\.json|SOURCE_MANIFEST\.json|RELEASE_MANIFEST\.json|CHECKSUMS\.sha256)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Refusing unexpected metadata patch path: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only)
          git diff --check

      - name: Commit refreshed metadata
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            apps/documents/index.html \
            apps/spreadsheets/index.html \
            apps/presentations/index.html \
            apps/pdf/index.html \
            apps/txt/index.html \
            apps/epub/index.html \
            SOURCE_LOCK.json \
            BUILD_INFO.json \
            SOURCE_MANIFEST.json \
            RELEASE_MANIFEST.json \
            CHECKSUMS.sha256
          git diff --cached --quiet && { echo "No metadata changes to commit."; exit 0; }
          git commit -m "Refresh InkDOS integrity metadata"
          git push origin "HEAD:$TARGET_BRANCH"
