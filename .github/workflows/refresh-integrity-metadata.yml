name: Refresh integrity metadata

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'CHECKSUMS.sha256'
      - 'SOURCE_LOCK.json'
      - 'BUILD_INFO.json'
      - 'SOURCE_MANIFEST.json'
      - 'RELEASE_MANIFEST.json'

permissions:
  contents: write

concurrency:
  group: inkdos-integrity-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build Plain Text distribution
        run: python scripts/build_txt_bundle.py

      - name: Refresh integrated app locks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          lock_path = root / 'SOURCE_LOCK.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          version = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))['version']

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def tree_digest(path, exclude=()):
              path = Path(path)
              excluded = set(exclude)
              digest = hashlib.sha256()
              for item in sorted(path.rglob('*')):
                  if not item.is_file():
                      continue
                  rel = item.relative_to(path).as_posix()
                  if rel in excluded:
                      continue
                  rel_bytes = rel.encode()
                  digest.update(len(rel_bytes).to_bytes(4, 'big'))
                  digest.update(rel_bytes)
                  digest.update(bytes.fromhex(sha(item)))
              return digest.hexdigest()

          lock['release'] = version
          for app, entry in lock['apps'].items():
              app_root = root / 'apps' / app
              entry['integratedIndexSha256'] = sha(app_root / 'index.html')
              entry['nonIndexTreeSha256'] = tree_digest(app_root, exclude=('index.html',))

          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Refresh generated release metadata
        run: python scripts/generate_release_metadata.py

      - name: Refresh checksums
        run: python scripts/generate_checksums.py

      - name: Validate refreshed snapshot
        run: python scripts/run_release_validation.py

      - name: Commit refreshed metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/txt/index.html SOURCE_LOCK.json BUILD_INFO.json SOURCE_MANIFEST.json RELEASE_MANIFEST.json CHECKSUMS.sha256
          if git diff --cached --quiet; then
            echo "Integrity metadata already current."
            exit 0
          fi
          git commit -m "Refresh InkDOS integrity metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
