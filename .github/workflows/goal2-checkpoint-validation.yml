# Final Goal 2 validation; validate the permanent workflow surface in an isolated fixture.
name: Goal 2 checkpoint validation

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-checkpoint-validation.yml'

permissions:
  contents: read

concurrency:
  group: inkdos-goal2-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
      - name: Run static contracts and validate final workflow surface separately
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*_contract.py; do
            if [ "$test" = "tests/test_minimal_workflow_set_contract.py" ]; then continue; fi
            echo "==> $test"
            python "$test"
          done
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/tests" "$fixture/.github/workflows"
          cp tests/test_minimal_workflow_set_contract.py "$fixture/tests/"
          for workflow in apply-inkdos-update.yml desktop-tauri.yml refresh-integrity-metadata.yml release.yml stability-freeze-regression.yml; do
            cp ".github/workflows/$workflow" "$fixture/.github/workflows/$workflow"
          done
          python "$fixture/tests/test_minimal_workflow_set_contract.py"
      - name: Run update trust-boundary regression
        run: python tests/test_update_trust_boundary.py
      - name: Run security configuration regression
        run: python tests/test_security_pdfjs_config.py
      - name: Check consolidated runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check apps/documents/app.js
          node --check apps/documents/runtime/commands/document-commands.js
          node --check apps/documents/ui/command-controller.js
          node --check apps/spreadsheets/app.js
          node --check apps/spreadsheets/ui/editor-controller.js
          node --check apps/spreadsheets/engine/workbook-editor.js
          node --check apps/spreadsheets/engine/formula/evaluator.js
          node --check apps/spreadsheets/view/grid-surface.js
          node --check apps/presentations/app.js
          node --check apps/presentations/engine/presentation-policy.js
          node --check apps/presentations/engine/presentation-session.js
          node --check apps/presentations/ui/command-controller.js
          node --check apps/presentations/ui/editing-controller.js
          node --check apps/presentations/ui/slide-panel-controller.js
          node --check apps/presentations/ui/ppt-p1-tools.js
          node --check apps/presentations/ui/ppt-p2-tools.js
          node --check apps/presentations/ui/ppt-p2-table-tools-ui.js
          node --check apps/presentations/io/ppt-p2-package.js
          node --check apps/presentations/io/pptx-open-controller.js
          node --check apps/presentations/io/pptx-preservation-writer.js
          node --check apps/presentations/io/save-controller.js
          node --check apps/presentations/presentation/slideshow-controller.js
          node --check apps/presentations/view/slide-surface.js
          node --check apps/presentations/view/zoom-controller.js
          node --check apps/pdf/app.js
          node --check apps/pdf/runtime/commands/command-registry.js
          node --check apps/pdf/runtime/frame/frame-menu.js
          node --check apps/pdf/ui/command-bindings.js
          node --check apps/pdf/ui/toolbar-rail.js
          node --check apps/pdf/modes/mode-controller.js
          node --check apps/pdf/ui/mode-bindings.js
          node --check apps/pdf/ui/command-controller.js
          node --check apps/pdf/ui/navigation-controller.js
          node --check apps/pdf/extensions/review-annotations.js
          node --check apps/pdf/pdfjs/editor-adapter.js
          node --check apps/pdf/view/page-layout.js
          node --check apps/pdf/features/reader/reader-runtime.js
          node --check apps/pdf/ui/reader-tools.js
          node --check apps/pdf/features/page-tools/page-tools-runtime.js
          node --check apps/pdf/features/page-tools/actions/move-page.js
          node --check apps/pdf/features/page-tools/actions/rotate-page.js
          node --check apps/pdf/features/page-tools/actions/delete-page.js
          node --check apps/pdf/features/page-tools/actions/extract-page.js
          node --check apps/pdf/features/page-tools/actions/split-pdf.js
          node --check apps/pdf/features/page-tools/actions/merge-pdfs.js
          node --check apps/pdf/ui/page-tools.js

  browser-stability:
    name: Stability browser suite (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Isolate unrelated Chrome apt source
        shell: bash
        run: |
          while IFS= read -r source; do sudo mv "$source" "$source.inkdos-disabled"; done < <(grep -RIl 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
      - name: Install Playwright browser with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=15s 300s python -m playwright install --with-deps "$BROWSER"; then exit 0; fi
            [ "$attempt" -eq 2 ] && exit 1
            sleep 5
          done
      - name: Run primary stability browser suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*_stability_browser.py; do echo "==> $test [$BROWSER]"; python "$test"; done

  browser-feature-regressions:
    name: Feature browser regressions (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Isolate unrelated Chrome apt source
        shell: bash
        run: |
          while IFS= read -r source; do sudo mv "$source" "$source.inkdos-disabled"; done < <(grep -RIl 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run preserved feature browser regressions plus Goal 2 fidelity
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_pdf_stability_frame.py
            tests/test_pdf_stability_comments.py
            tests/test_pdf_stability_offline.py
            tests/test_pptx_security_browser.py
            tests/test_ppt_p2_transitions_browser.py
            tests/test_ppt_p2_notes_browser.py
            tests/test_ppt_p2_theme_browser.py
            tests/test_ppt_p2_tables_browser.py
            tests/test_ppt_p2_table_structure_browser.py
            tests/test_ppt_p2_table_merge_browser.py
            tests/test_ppt_p2_table_format_browser.py
            tests/test_ppt_p2_table_style_browser.py
            tests/test_ppt_p2_table_tools_ui_browser.py
            tests/test_pptx_norm_autofit_default_scale_browser.py
            tests/test_pptx_character_spacing_fidelity_browser.py
            tests/test_pptx_slide_background_fidelity_browser.py
            tests/test_pptx_real_title_fidelity_browser.py
            tests/test_xls_s1_structural_formulas_browser.py
            tests/test_xls_s1_structural_columns_browser.py
            tests/test_xls_s2_clipboard_browser.py
          )
          for test in "${tests[@]}"; do echo "==> $test [$BROWSER]"; python "$test"; done

  preservation-roundtrips:
    name: Format preservation round-trips
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Isolate unrelated Chrome apt source
        shell: bash
        run: |
          while IFS= read -r source; do sudo mv "$source" "$source.inkdos-disabled"; done < <(grep -RIl 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
      - run: python -m playwright install --with-deps chromium
      - name: Run all preserved format round-trips
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*roundtrip.py; do echo "==> $test"; python "$test"; done
