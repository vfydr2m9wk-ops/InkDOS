name: Goal 3 WiX diagnostic

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal3-wix-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wix-link:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Materialize workspace icons
        run: python desktop/scripts/generate_workspace_icons.py
      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py
      - name: Build MSI and retain WiX staging on failure
        id: build
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles msi
      - name: Replay WiX linker with visible diagnostics
        id: replay
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $light = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'tauri') -Filter light.exe -Recurse -File | Select-Object -First 1
          if (-not $light) { throw 'light.exe was not found.' }
          $wixDir = Get-ChildItem 'desktop/src-tauri/target/release/wix' -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'main.wixobj') } | Select-Object -First 1
          if (-not $wixDir) { throw 'Generated WiX object directory was not found.' }
          $objects = @(Get-ChildItem $wixDir.FullName -Filter '*.wixobj' -File | ForEach-Object { $_.FullName })
          if ($objects.Count -lt 2) { throw 'Expected generated main and fragment WiX objects.' }
          Push-Location $wixDir.FullName
          try {
            $args = @('-ext','WixUIExtension','-ext','WixUtilExtension','-o','diagnostic.msi','-cultures:en-us','-loc','locale.wxl') + $objects
            & $light.FullName @args 2>&1 | Tee-Object -FilePath 'light-diagnostic.log'
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($code -eq 0) { throw 'Direct WiX link unexpectedly succeeded after Tauri MSI failure.' }
          exit $code
      - name: Upload WiX linker diagnostic
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: goal3-wix-link-diagnostic
          path: desktop/src-tauri/target/release/wix/**/light-diagnostic.log
          if-no-files-found: error
      - name: Require MSI build success
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktop/src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'Expected MSI artifact.' }
      - name: Preserve RED when WiX replay fails
        if: steps.replay.outcome == 'failure'
        shell: pwsh
        run: exit 1
