name: PPTX preview yield visual diagnostic
on:
  push:
    branches:
      - perf/pptx-preview-overhead-diagnostic
permissions:
  contents: read
jobs:
  webkit-preview-yield-visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps webkit
      - name: Compare preview yield visually
        run: python scripts/diagnose_pptx_preview_yield_visual.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pptx-preview-yield-visual
          path: artifacts/pptx-preview-yield-visual/
          if-no-files-found: warn
          retention-days: 14
