name: Verify Home regression gate integration

on:
  push:
    branches:
      - ci/2.4.3-home-regression-gate
    paths:
      - '.github/workflows/verify-home-regression-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run Home density contract
        run: python tests/test_home_density_layout_contract.py
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
