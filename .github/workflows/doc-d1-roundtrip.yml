name: DOC-D1 browser roundtrip

on:
  push:
    branches:
      - 'feature/doc-d1-*'
    paths:
      - 'apps/documents/**'
      - 'tests/test_doc_d1_roundtrip.py'
      - 'requirements-ci.txt'
      - '.github/workflows/doc-d1-roundtrip.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/documents/**'
      - 'tests/test_doc_d1_roundtrip.py'
      - 'requirements-ci.txt'
      - '.github/workflows/doc-d1-roundtrip.yml'

permissions:
  contents: read

concurrency:
  group: doc-d1-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run DOC-D1 save and reopen roundtrip
        run: python tests/test_doc_d1_roundtrip.py
