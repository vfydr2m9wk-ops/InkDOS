name: Repair InkDesk repository

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkdesk-repair-main
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract source archive safely
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f InkDesk-source.zip
          export SOURCE_DIR="$RUNNER_TEMP/inkdesk-source"
          rm -rf -- "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os

          archive = Path("InkDesk-source.zip")
          destination = Path(os.environ["SOURCE_DIR"])
          destination.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as package:
              for entry in package.infolist():
                  path = PurePosixPath(entry.filename.replace("\\", "/"))
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {entry.filename}")
              package.extractall(destination)

          required = (
              "README.md",
              ".editorconfig",
              ".gitignore",
              ".nojekyll",
              "scripts/generate_checksums.py",
              "scripts/verify_checksums.py",
              "tests/compatibility-fixtures/documents",
              "tests/compatibility-fixtures/spreadsheets",
              "tests/compatibility-fixtures/presentations",
          )

          missing = [
              name
              for name in required
              if not (destination / name).exists()
          ]

          if missing:
              raise SystemExit(
                  "Source archive is incomplete: " + ", ".join(missing)
              )
          PY

      - name: Apply requested corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/inkdesk-source"

          cp -- "$SOURCE_DIR/README.md" README.md
          cp -- "$SOURCE_DIR/.editorconfig" .editorconfig
          cp -- "$SOURCE_DIR/.gitignore" .gitignore
          cp -- "$SOURCE_DIR/.nojekyll" .nojekyll

          rm -rf -- tests/compatibility-fixtures
          mkdir -p -- tests
          cp -a -- "$SOURCE_DIR/tests/compatibility-fixtures" tests/

          python3 - <<'PY'
          from pathlib import Path

          for path in Path(".").rglob(".gitkeep"):
              if ".git" not in path.parts and path.is_file():
                  print(f"Removing {path}")
                  path.unlink()
          PY

          python3 scripts/generate_checksums.py

      - name: Validate corrected repository
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_DIR="$RUNNER_TEMP/inkdesk-source"

          cmp --silent README.md "$SOURCE_DIR/README.md"

          test -f tests/compatibility-fixtures/documents/era2_office_2007_2013_baseline.docx
          test -f tests/compatibility-fixtures/spreadsheets/era2_office_2007_2013_baseline.xlsx
          test -f tests/compatibility-fixtures/presentations/era2_office_2007_2013_baseline.pptx

          python3 - <<'PY'
          from pathlib import Path

          remaining = [
              str(path)
              for path in Path(".").rglob(".gitkeep")
              if ".git" not in path.parts and path.is_file()
          ]

          if remaining:
              raise SystemExit(
                  "Remaining .gitkeep files: " + ", ".join(remaining)
              )
          PY

          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify_checksums.py

      - name: Commit corrections
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if [[ -n "$(git diff --cached --name-only -- .github/workflows)" ]]; then
            echo "The repair attempted to modify a workflow file; refusing to commit." >&2
            git diff --cached --name-status -- .github/workflows >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No corrections are required."
            exit 0
          fi

          git diff --cached --name-status
          git commit -m "Repair fixtures, README, and placeholders"
          git push origin HEAD:main
