name: Bootstrap InkDesk repository

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkdesk-repository-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f InkDesk-source.zip
          echo "Source archive: InkDesk-source.zip"
          echo "Archive size: $(stat -c '%s bytes' InkDesk-source.zip)"
          sha256sum InkDesk-source.zip

      - name: Extract source archive safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import shutil
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("InkDesk-source.zip").resolve()
          staging = Path(os.environ["RUNNER_TEMP"]) / "inkdesk-bootstrap"
          required = (
              "index.html",
              "README.md",
              "VERSION.json",
              "apps/documents/index.html",
              "apps/spreadsheets/index.html",
              "apps/presentations/index.html",
              ".github/workflows/bootstrap-inkdesk.yml",
          )

          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)

          with ZipFile(archive) as package:
              entries = package.infolist()
              if not entries:
                  raise SystemExit("Source archive is empty.")
              if len(entries) > 5000:
                  raise SystemExit(f"Source archive has too many entries: {len(entries)}")

              total_compressed = sum(entry.compress_size for entry in entries)
              total_uncompressed = sum(entry.file_size for entry in entries)
              if total_compressed > 100 * 1024 * 1024:
                  raise SystemExit("Compressed source archive exceeds 100 MiB.")
              if total_uncompressed > 300 * 1024 * 1024:
                  raise SystemExit("Expanded source archive exceeds 300 MiB.")
              if total_compressed and total_uncompressed / total_compressed > 200:
                  raise SystemExit("Source archive compression ratio is unreasonable.")

              for entry in entries:
                  raw_name = entry.filename
                  if not raw_name or "\x00" in raw_name:
                      raise SystemExit("Source archive contains an invalid path.")
                  if "\\" in raw_name:
                      raise SystemExit(f"Backslash path is not allowed: {raw_name}")

                  path = PurePosixPath(raw_name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {raw_name}")
                  if path.parts and path.parts[0].endswith(":"):
                      raise SystemExit(f"Drive-qualified archive path: {raw_name}")
                  if entry.flag_bits & 0x1:
                      raise SystemExit(f"Encrypted archive entry is not supported: {raw_name}")

                  file_type = (entry.external_attr >> 16) & 0o170000
                  if file_type == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {raw_name}")

              package.extractall(staging)

          missing = [relative for relative in required if not (staging / relative).is_file()]
          if missing:
              raise SystemExit("Source archive is missing required files: " + ", ".join(missing))

          print(f"Safely extracted {len(entries)} entries to {staging}")
          PY

      - name: Validate extracted application
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/inkdesk-bootstrap"
          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p "test_*.py"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Install complete repository structure
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/InkDesk-source.zip' \
            "$RUNNER_TEMP/inkdesk-bootstrap/" ./

      - name: Verify installed structure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Commit application structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The repository already matches InkDesk-source.zip."
            exit 0
          fi

          git commit -m "Bootstrap InkDesk application structure"
          git push origin HEAD:main
