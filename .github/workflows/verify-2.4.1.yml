name: Verify InkDOS 2.4.1 candidate

on:
  push:
    branches:
      - release/2.4.1-fixes
    paths:
      - '.github/workflows/verify-2.4.1.yml'

permissions:
  contents: read

jobs:
  release-validation:
    name: Full release validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@1e60f620b9541d6213dfbd2d8a5b1b0e0a6d5b6b # v4
        with:
          node-version: "22"
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
