name: Prepare InkDesk prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag to package
        required: true
        default: v0.19.2-beta
        type: string
      publish:
        description: Publish a GitHub prerelease after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate tagged source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_checksums.py | tee validation-checksums.log
          python3 scripts/validate_repository.py | tee validation-repository.log
          python3 scripts/audit_source.py | tee validation-audit.log
          python3 -m unittest discover -s tests -p "test_*.py" 2>&1 | tee validation-unit.log
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find apps shared -type f -name '*.js' -print0)
      - name: Upload validation logs
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: validation-*.log
          if-no-files-found: error

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        group: [package-security, lifecycle, isolation-offline, documents-presentations, spreadsheets]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install selected Playwright engine
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Execute browser round trips
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          CHROMIUM_PATH: ""
        run: python3 scripts/run_browser_regressions.py --group "${{ matrix.group }}"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-browser-${{ matrix.browser }}-${{ matrix.group }}-${{ github.sha }}
          path: tests/browser/results/
          if-no-files-found: error

  package:
    needs: [validate, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Confirm tag and build deterministic runtime package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 '${{ inputs.tag }}')" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/build_release.py --output-dir dist
          cat > dist/CI_TEST_REPORT.md <<EOF
          # CI prerelease test report

          - Tag: \\`${{ inputs.tag }}\\`
          - Commit: \\`$GITHUB_SHA\\`
          - Repository validation: passed
          - Source audit: passed
          - Unit/package suite: passed
          - Playwright Chromium: passed
          - Playwright Firefox: passed
          - Playwright WebKit: passed
          - Native Safari/iPadOS: not tested by this workflow
          EOF
          sha256sum dist/*.zip
      - name: Upload reviewable prerelease artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkDesk-${{ inputs.tag }}-${{ github.sha }}
          path: |
            dist/*
            RELEASE_NOTES.md
            RELEASE_TEST_REPORT.md
            COMPATIBILITY.md
            UPGRADE_NOTES.md
            docs/KNOWN_LIMITATIONS.md
            docs/MANUAL_DEVICE_CHECKLIST.md
          if-no-files-found: error
          retention-days: 90

  publish:
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: InkDesk-${{ inputs.tag }}-${{ github.sha }}
          path: release-assets
      - name: Publish explicit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets/dist -maxdepth 1 -type f -print | sort)
          gh release create "${{ inputs.tag }}" \
            --verify-tag \
            --prerelease \
            --title "InkDesk ${{ inputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"
