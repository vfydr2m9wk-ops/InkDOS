name: Goal 3 native checkpoint

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal3-native-checkpoint.yml'
      - 'desktop/src-tauri/**'
      - 'desktop/workspaces.json'
      - 'desktop/launchers.json'
      - 'desktop/scripts/**'
      - 'tests/test_tauri_goal3_*.py'
      - 'tests/test_tauri_desktop_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-goal3-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Goal 3 contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Run workspace and association contract
        run: python tests/test_tauri_goal3_workspace_contract.py
      - name: Run workspace launcher contract
        run: python tests/test_tauri_goal3_workspace_launchers_contract.py
      - name: Run installed workspace launcher contract
        run: python tests/test_tauri_goal3_installed_launchers_contract.py
      - name: Run macOS workspace launcher contract
        run: python tests/test_tauri_goal3_macos_workspace_launchers_contract.py
      - name: Run native multiwindow contract
        run: python tests/test_tauri_goal3_native_window_contract.py
      - name: Run AppImage inspection contract
        run: python tests/test_tauri_goal3_appimage_inspection_contract.py
      - name: Run baseline desktop contract
        run: python tests/test_tauri_desktop_contract.py
      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check

  workspace-icons:
    name: Materialize canonical workspace icons
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Generate native workspace icons from canonical sources
        run: python desktop/scripts/generate_workspace_icons.py
      - name: Upload generated workspace ICOs
        uses: actions/upload-artifact@v4
        with:
          name: goal3-workspace-icons
          path: desktop/src-tauri/windows/workspace-icons/*/icon.ico
          if-no-files-found: error
          retention-days: 1

  macos-launchers:
    name: Materialize macOS workspace launchers
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Generate macOS workspace launch entries
        run: python desktop/scripts/generate_macos_workspace_launchers.py
      - name: Verify generated macOS helper bundles
        shell: bash
        run: |
          set -euo pipefail
          test "$(find desktop/src-tauri/macos/workspace-launchers -path '*/Contents/MacOS/launcher' -type f | wc -l | tr -d ' ')" = "6"
          test "$(find desktop/src-tauri/macos/workspace-launchers -path '*/Contents/Resources/icon.icns' -type f | wc -l | tr -d ' ')" = "6"
          test "$(find desktop/src-tauri/macos/workspace-launchers -path '*/Contents/Info.plist' -type f | wc -l | tr -d ' ')" = "6"
      - name: Upload generated macOS launchers
        uses: actions/upload-artifact@v4
        with:
          name: goal3-macos-workspace-launchers
          path: desktop/src-tauri/macos/workspace-launchers/*/Contents/**
          if-no-files-found: error
          retention-days: 1

  cargo-check:
    name: Tauri cargo check (${{ matrix.os }})
    needs: [workspace-icons, macos-launchers]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Materialize canonical workspace icon resources
        uses: actions/download-artifact@v4
        with:
          name: goal3-workspace-icons
          path: desktop/src-tauri/windows/workspace-icons
      - name: Materialize macOS workspace launcher resources
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: goal3-macos-workspace-launchers
          path: desktop/src-tauri/macos/workspace-launchers
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py
      - name: Check Tauri host
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo check 2>&1 | tee cargo-check.log
      - name: Upload cargo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal3-cargo-${{ matrix.os }}
          path: desktop/src-tauri/cargo-check.log
          if-no-files-found: error

  package-build:
    name: Build and inspect package (${{ matrix.os }})
    needs: [contracts, workspace-icons, macos-launchers, cargo-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: goal3-package-windows
            bundles: nsis,msi
          - os: macos-latest
            artifact: goal3-package-macos
            bundles: app,dmg
          - os: ubuntu-22.04
            artifact: goal3-package-linux
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Materialize canonical workspace icon resources
        uses: actions/download-artifact@v4
        with:
          name: goal3-workspace-icons
          path: desktop/src-tauri/windows/workspace-icons
      - name: Materialize macOS workspace launcher resources
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: goal3-macos-workspace-launchers
          path: desktop/src-tauri/macos/workspace-launchers
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            cpio
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py
      - name: Build native packages
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Inspect Windows package output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'desktop/src-tauri/target/release/bundle'
          $nsis = Get-ChildItem "$bundle/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw 'Expected both NSIS and MSI installer artifacts.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'inkdos-goal3-install'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          Start-Process -FilePath $nsis.FullName -ArgumentList '/S', "/D=$installDir" -Wait
          if (-not (Test-Path "$installDir/InkDOS.exe")) { throw 'Installed InkDOS.exe is missing.' }
          $workspaces = @('documents','spreadsheets','presentations','pdf','epub','txt')
          foreach ($workspace in $workspaces) {
            if (-not (Test-Path "$installDir/workspace-icons/$workspace/icon.ico")) { throw "Missing installed $workspace workspace icon." }
          }
          $programs = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/InkDOS'
          $shortcutNames = @('InkDOS Documents.lnk','InkDOS Spreadsheets.lnk','InkDOS Presentations.lnk','InkDOS PDF.lnk','InkDOS EPUB.lnk','InkDOS Plain Text.lnk')
          foreach ($shortcut in $shortcutNames) {
            if (-not (Test-Path (Join-Path $programs $shortcut))) { throw "Missing installed workspace shortcut $shortcut" }
          }
          $fullExecutables = @(Get-ChildItem $installDir -Recurse -Filter '*.exe' | Where-Object { $_.Name -match '^InkDOS.*\.exe$' })
          if ($fullExecutables.Count -ne 1 -or $fullExecutables[0].Name -ne 'InkDOS.exe') { throw 'Workspace launchers must not install duplicate InkDOS executables.' }
      - name: Inspect macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name 'InkDOS.app' -type d | head -n 1)"
          test -n "$app"
          test -x "$app/Contents/MacOS/InkDOS"
          helpers="$app/Contents/Helpers"
          test -d "$helpers"
          test "$(find "$helpers" -maxdepth 1 -name 'InkDOS *.app' -type d | wc -l | tr -d ' ')" = "6"
          test "$(find "$helpers" -path '*/Contents/MacOS/launcher' -type f | wc -l | tr -d ' ')" = "6"
          test "$(find "$helpers" -path '*/Contents/Resources/icon.icns' -type f | wc -l | tr -d ' ')" = "6"
          test "$(find "$app/Contents/MacOS" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          test "$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | wc -l | tr -d ' ')" -ge 1
      - name: Inspect Linux package contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=desktop/src-tauri/target/release/bundle
          deb="$(find "$bundle/deb" -name '*.deb' -type f | head -n 1)"
          rpm_pkg="$(find "$bundle/rpm" -name '*.rpm' -type f | head -n 1)"
          appimage="$(find "$bundle/appimage" -name '*.AppImage' -type f | head -n 1)"
          test -n "$deb" && test -n "$rpm_pkg" && test -n "$appimage"
          deb_root="$RUNNER_TEMP/inkdos-deb"
          rpm_root="$RUNNER_TEMP/inkdos-rpm"
          mkdir -p "$deb_root" "$rpm_root"
          dpkg-deb -x "$deb" "$deb_root"
          (cd "$rpm_root" && rpm2cpio "$GITHUB_WORKSPACE/$rpm_pkg" | cpio -idmu)
          for root in "$deb_root" "$rpm_root"; do
            test "$(find "$root/usr/share/applications" -name 'inkdos-*.desktop' -type f | wc -l | tr -d ' ')" = "6"
            test "$(find "$root/usr/share/inkdos/workspace-icons" -type f | wc -l | tr -d ' ')" = "6"
            binaries="$(find "$root/usr" -type f -perm -111 -name 'InkDOS*' | wc -l | tr -d ' ')"
            test "$binaries" = "1"
          done
          chmod +x "$appimage"
          appdir="$RUNNER_TEMP/inkdos-appimage"
          mkdir -p "$appdir"
          (cd "$appdir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          # AppImage must expose exactly one canonical desktop identity
          test "$(find "$appdir/squashfs-root" -name '*.desktop' -type f | wc -l | tr -d ' ')" = "1"
          # AppImage must not contain auxiliary inkdos-* workspace desktop entries
          test "$(find "$appdir/squashfs-root" -name 'inkdos-*.desktop' -type f | wc -l | tr -d ' ')" = "0"
          # AppImage must not contain the package-manager workspace icon tree
          test ! -d "$appdir/squashfs-root/usr/share/inkdos/workspace-icons"
      - name: Upload inspected native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 2
