name: Goal 3 native checkpoint

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal3-native-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: inkdos-goal3-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Goal 3 contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Run workspace and association contract
        run: python tests/test_tauri_goal3_workspace_contract.py
      - name: Run native multiwindow contract
        run: python tests/test_tauri_goal3_native_window_contract.py
      - name: Run baseline desktop contract
        run: python tests/test_tauri_desktop_contract.py
      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check

  cargo-check:
    name: Tauri cargo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py
      - name: Check Tauri host
        id: cargo_check
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo check 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Surface Linux cargo failure for diagnosis
        if: failure() && runner.os == 'Linux' && steps.cargo_check.outputs.status != '0'
        working-directory: desktop/src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Goal 3 Linux cargo diagnostic'
            echo
            echo 'Exact head: `${{ github.sha }}`'
            echo
            echo '```text'
            grep -E -A 8 -B 3 '(^error(\[|:)|error: could not compile)' cargo-check.log | tail -n 160 || tail -n 160 cargo-check.log
            echo '```'
          } > cargo-diagnostic.md
          gh pr comment 132 --body-file cargo-diagnostic.md
