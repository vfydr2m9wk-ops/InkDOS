name: PDF Open focused regression

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/pdf-open-focused.yml'
      - 'tests/test_pdf_open_picker_browser.py'
      - 'tests/test_pdf_stability_roundtrip.py'
      - 'tests/test_pdf_stability_contract.py'
      - 'apps/pdf/ui/command-controller.js'
      - 'apps/pdf/runtime/commands/command-registry.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-pdf-open-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  picker-and-roundtrip:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium, firefox]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify Open PDF picker preserves user gesture
        run: python tests/test_pdf_open_picker_browser.py
      - name: Verify PDF save and reopen round-trip
        run: python tests/test_pdf_stability_roundtrip.py

  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify PDF stability contract
        run: python tests/test_pdf_stability_contract.py
