name: Goal 2 PPTX preservation verification

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-pptx-preserve-verify.yml'
      - 'tests/test_pptx_slide_background_fidelity_browser.py'
      - 'tests/test_pptx_character_spacing_fidelity_browser.py'
      - 'apps/presentations/io/pptx-open-controller.js'
      - 'apps/presentations/io/pptx-preservation-writer.js'
      - 'apps/presentations/engine/presentation-session.js'
      - 'apps/presentations/view/slide-surface.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Background fidelity
        run: python tests/test_pptx_slide_background_fidelity_browser.py
      - name: Character spacing render
        env:
          PPTX_TRACKING_PHASE: render
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Preservation writer eligibility predicate
        env:
          PPTX_TRACKING_PHASE: render
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('tests/test_pptx_character_spacing_fidelity_browser.py').read_text()
          needle='            if phase in {"all", "render"}:'
          insert='''            eligibility = page.evaluate("""marker => {\n                const NS=globalThis.InkDOS2Presentations,app=globalThis.__inkdosPresentations;\n                const slide=app.session.currentSlide;\n                const object=slide.objects.find(o=>o.type==='text' && String(o.text||'').includes(marker));\n                const run=object?.paragraphs?.flatMap(p=>p.runs||[]).find(r=>r.text===marker)||null;\n                if(!object||!run)throw new Error('Eligibility object/run missing');\n                const before=object.sourceSignature;\n                run.text=marker+'!';\n                object.text=object.paragraphs.map(p=>(p.runs||[]).map(r=>r.text||'').join('')).join('\\\\n');\n                return {\n                  hasSourceRef:!!object.sourceRef,\n                  sourcePart:object.sourceRef?.slidePart||null,\n                  slidePart:slide.sourcePart||null,\n                  signatureChanged:before!==NS.PresentationModel.textSignature(object),\n                  eligible:!!object.sourceRef && object.sourceRef.slidePart===slide.sourcePart && before!==NS.PresentationModel.textSignature(object)\n                };\n            }""", MARKER)\n            assert eligibility["hasSourceRef"] is True, eligibility\n            assert eligibility["sourcePart"] == eligibility["slidePart"], eligibility\n            assert eligibility["signatureChanged"] is True, eligibility\n            assert eligibility["eligible"] is True, eligibility\n            browser.close()\n            return\n\n'''
          if src.count(needle)!=1: raise SystemExit('eligibility anchor mismatch')
          Path('tests/_goal2_eligibility.py').write_text(src.replace(needle,insert+needle,1))
          PY
          python tests/_goal2_eligibility.py
          rm tests/_goal2_eligibility.py
      - name: Preservation writer source-shape mapping
        env:
          PPTX_TRACKING_PHASE: render
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('tests/test_pptx_character_spacing_fidelity_browser.py').read_text()
          needle='            if phase in {"all", "render"}:'
          insert='''            mapping = page.evaluate("""async marker => {\n                const app=globalThis.__inkdosPresentations;\n                const slide=app.session.currentSlide;\n                const object=slide.objects.find(o=>o.type==='text' && String(o.text||'').includes(marker));\n                if(!object?.sourceRef)throw new Error('Mapping sourceRef missing');\n                const zip=await JSZip.loadAsync(app.session.sourceBytes,{checkCRC32:true});\n                const xml=await zip.file(object.sourceRef.slidePart).async('text');\n                const doc=new DOMParser().parseFromString(xml,'application/xml');\n                const shapes=Array.from(doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/presentationml/2006/main','sp'));\n                const shape=shapes.find(sp=>{\n                  const nv=Array.from(sp.children).find(n=>n.localName==='nvSpPr');\n                  const c=nv?Array.from(nv.children).find(n=>n.localName==='cNvPr'):null;\n                  return c?.getAttribute('id')===String(object.sourceRef.shapeId);\n                })||null;\n                const tx=shape?Array.from(shape.children).find(n=>n.localName==='txBody'):null;\n                return {shapeFound:!!shape,txBodyFound:!!tx,shapeId:String(object.sourceRef.shapeId||'')};\n            }""", MARKER)\n            assert mapping["shapeFound"] is True, mapping\n            assert mapping["txBodyFound"] is True, mapping\n            browser.close()\n            return\n\n'''
          if src.count(needle)!=1: raise SystemExit('mapping anchor mismatch')
          Path('tests/_goal2_mapping.py').write_text(src.replace(needle,insert+needle,1))
          PY
          python tests/_goal2_mapping.py
          rm tests/_goal2_mapping.py
      - name: Character spacing writer detection
        env:
          PPTX_TRACKING_PHASE: build
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Character spacing rewritten text
        env:
          PPTX_TRACKING_PHASE: text
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Character spacing serialized spc
        env:
          PPTX_TRACKING_PHASE: spc
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
