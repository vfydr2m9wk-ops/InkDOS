name: Goal 2 PPTX preservation verification

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-pptx-preserve-verify.yml'
      - 'tests/test_pptx_slide_background_fidelity_browser.py'
      - 'tests/test_pptx_character_spacing_fidelity_browser.py'
      - 'apps/presentations/io/pptx-open-controller.js'
      - 'apps/presentations/io/pptx-preservation-writer.js'
      - 'apps/presentations/engine/presentation-session.js'
      - 'apps/presentations/view/slide-surface.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Background fidelity
        run: python tests/test_pptx_slide_background_fidelity_browser.py
      - name: Character spacing render
        env:
          PPTX_TRACKING_PHASE: render
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Character spacing preservation round-trip
        env:
          PPTX_TRACKING_PHASE: preserve
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
