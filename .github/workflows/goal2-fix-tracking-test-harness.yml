name: Goal 2 fix tracking regression harness

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-fix-tracking-test-harness.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Patch regression harness escaping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_pptx_character_spacing_fidelity_browser.py')
          src=path.read_text(encoding='utf-8')
          old=r"object.text=object.paragraphs.map(p=>(p.runs||[]).map(r=>r.text||'').join('')).join('\n');"
          new=r"object.text=object.paragraphs.map(p=>(p.runs||[]).map(r=>r.text||'').join('')).join('\\n');"
          count=src.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one preservation newline harness match, found {count}')
          path.write_text(src.replace(old,new,1),encoding='utf-8')
          PY
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Background fidelity
        run: python tests/test_pptx_slide_background_fidelity_browser.py
      - name: Character spacing render
        env:
          PPTX_TRACKING_PHASE: render
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Character spacing preservation build
        env:
          PPTX_TRACKING_PHASE: build
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Character spacing rewritten text
        env:
          PPTX_TRACKING_PHASE: text
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Character spacing serialized spc
        env:
          PPTX_TRACKING_PHASE: spc
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Commit tested harness fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/inkdos-2.3
          test "$(git rev-parse origin/feature/inkdos-2.3)" = "${GITHUB_SHA}" || { echo 'Branch advanced during harness run' >&2; exit 1; }
          git rm .github/workflows/goal2-fix-tracking-test-harness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_pptx_character_spacing_fidelity_browser.py
          git commit -m 'test: fix PPTX tracking preservation harness escaping'
          git push origin HEAD:feature/inkdos-2.3
