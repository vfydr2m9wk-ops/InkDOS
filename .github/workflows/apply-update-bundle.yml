name: Apply validated update bundle

run-name: Apply bundle to ${{ inputs.target_branch }}

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch that must remain unchanged
        required: true
        default: main
        type: string

      payload_ref:
        description: Branch containing the bundle file
        required: true
        default: update/payload-0.19.1-beta-clean
        type: string

      bundle_path:
        description: Bundle file in the payload branch
        required: true
        default: InkDesk_0.19.1-beta_hardening.bundle
        type: string

      bundle_sha256:
        description: Expected SHA-256 of the bundle
        required: true
        default: 19e60fef1bcc1b596d4ddc933f1e32ba35cbdd5038d865cc245bb8cc6fc56449
        type: string

      bundle_commit:
        description: Exact source commit contained in the bundle
        required: true
        default: cf96539b36c277f1ac4af54147da49f3ac5c4fef
        type: string

      bundle_head:
        description: Branch name stored inside the bundle
        required: true
        default: hardening/0.19.1-beta
        type: string

      target_branch:
        description: Review branch to create; a unique suffix is added if it already exists
        required: true
        default: hardening/0.19.1-beta
        type: string

      run_browser_tests:
        description: Run Chromium regressions as advisory checks
        required: true
        default: true
        type: boolean

      draft_pr:
        description: Open the pull request as a draft
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: apply-update-bundle-${{ inputs.target_branch }}
  cancel-in-progress: false

env:
  BUNDLE_MAX_BYTES: "10485760"
  PLAYWRIGHT_VERSION: "1.57.0"
  BEAUTIFULSOUP_VERSION: "4.14.3"
  OPENPYXL_VERSION: "3.1.5"

jobs:
  validate:
    name: Validate and test imported tree
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read

    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      payload_sha: ${{ steps.prepare.outputs.payload_sha }}
      bundle_sha256: ${{ steps.prepare.outputs.bundle_sha256 }}
      final_commit: ${{ steps.prepare.outputs.final_commit }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      browser_status: ${{ steps.browser_status.outputs.status }}

    steps:
      - name: Check out base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate inputs and obtain bundle
        id: prepare
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          EXPECTED_BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          BUNDLE_HEAD: ${{ inputs.bundle_head }}
          REQUESTED_TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -Eeuo pipefail

          validate_branch() {
            local value="$1"
            local label="$2"

            if [[ -z "$value" ]] || ! git check-ref-format --branch "$value" >/dev/null 2>&1; then
              echo "Invalid ${label}: ${value}" >&2
              exit 1
            fi
          }

          validate_branch "$BASE_REF" "base branch"
          validate_branch "$PAYLOAD_REF" "payload branch"
          validate_branch "$BUNDLE_HEAD" "bundle head"
          validate_branch "$REQUESTED_TARGET_BRANCH" "target branch"

          if [[ "$REQUESTED_TARGET_BRANCH" == "$BASE_REF" ||
                "$REQUESTED_TARGET_BRANCH" == "$PAYLOAD_REF" ]]; then
            echo "The target branch must differ from the base and payload branches." >&2
            exit 1
          fi

          if [[ "$BUNDLE_PATH" == /* ||
                "$BUNDLE_PATH" == *".."* ||
                "$BUNDLE_PATH" == *":"* ||
                "$BUNDLE_PATH" == *"\\"* ||
                "$BUNDLE_PATH" != *.bundle ]]; then
            echo "The bundle path must be a safe relative path ending in .bundle." >&2
            exit 1
          fi

          expected_sha="${EXPECTED_BUNDLE_SHA256,,}"
          expected_commit="${EXPECTED_BUNDLE_COMMIT,,}"

          if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "bundle_sha256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          if [[ ! "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "bundle_commit must contain exactly 40 hexadecimal characters." >&2
            exit 1
          fi

          base_sha="$(git rev-parse HEAD^{commit})"

          git fetch --no-tags --prune origin \
            "+refs/heads/${PAYLOAD_REF}:refs/remotes/origin/${PAYLOAD_REF}"

          payload_sha="$(git rev-parse "refs/remotes/origin/${PAYLOAD_REF}^{commit}")"
          bundle_file="$RUNNER_TEMP/inkdesk-update.bundle"

          git show "refs/remotes/origin/${PAYLOAD_REF}:${BUNDLE_PATH}" > "$bundle_file"

          bundle_bytes="$(wc -c < "$bundle_file" | tr -d ' ')"
          if (( bundle_bytes == 0 || bundle_bytes > BUNDLE_MAX_BYTES )); then
            echo "Bundle size is outside the permitted range: ${bundle_bytes} bytes." >&2
            exit 1
          fi

          actual_sha="$(sha256sum "$bundle_file" | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Bundle checksum mismatch." >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

          mapfile -t bundle_heads < <(git bundle list-heads "$bundle_file")
          expected_line="${expected_commit} refs/heads/${BUNDLE_HEAD}"

          if (( ${#bundle_heads[@]} != 1 )); then
            echo "The bundle must expose exactly one branch." >&2
            printf '%s\n' "${bundle_heads[@]}" >&2
            exit 1
          fi

          if [[ "${bundle_heads[0]}" != "$expected_line" ]]; then
            echo "The bundle contains an unexpected branch or commit." >&2
            echo "Expected: $expected_line" >&2
            echo "Actual:   ${bundle_heads[0]}" >&2
            exit 1
          fi

          resolved_target="$REQUESTED_TARGET_BRANCH"
          if git ls-remote --exit-code --heads origin "$resolved_target" >/dev/null 2>&1; then
            resolved_target="${REQUESTED_TARGET_BRANCH}-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            validate_branch "$resolved_target" "resolved target branch"
            echo "Requested target already exists; using: $resolved_target"
          fi

          if git ls-remote --exit-code --heads origin "$resolved_target" >/dev/null 2>&1; then
            echo "Resolved target branch already exists: $resolved_target" >&2
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "payload_sha=$payload_sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "final_commit=$expected_commit" >> "$GITHUB_OUTPUT"
          echo "target_branch=$resolved_target" >> "$GITHUB_OUTPUT"

      - name: Import exact tree from bundle
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.bundle_commit }}
          BUNDLE_HEAD: ${{ inputs.bundle_head }}
        run: |
          set -Eeuo pipefail

          bundle_file="$RUNNER_TEMP/inkdesk-update.bundle"
          final_tree="$RUNNER_TEMP/final-tree"
          remote_ref="refs/remotes/bundle/${BUNDLE_HEAD}"

          rm -rf "$final_tree"
          mkdir -p "$final_tree"
          git -C "$final_tree" init
          git -C "$final_tree" fetch "$bundle_file" \
            "refs/heads/${BUNDLE_HEAD}:${remote_ref}"

          actual_commit="$(git -C "$final_tree" rev-parse "${remote_ref}^{commit}")"
          if [[ "$actual_commit" != "${EXPECTED_COMMIT,,}" ]]; then
            echo "Imported commit does not match the expected commit." >&2
            echo "Expected: ${EXPECTED_COMMIT,,}" >&2
            echo "Actual:   $actual_commit" >&2
            exit 1
          fi

          git -C "$final_tree" checkout --detach "$actual_commit"

          if [[ -f "$final_tree/.gitmodules" ]]; then
            echo "The imported tree may not contain .gitmodules." >&2
            exit 1
          fi

          if find "$final_tree" -type l -print -quit | grep -q .; then
            echo "The imported tree may not contain symbolic links." >&2
            exit 1
          fi

          for temporary_workflow in \
            .github/workflows/apply-update-patch.yml \
            .github/workflows/apply-update-bundle.yml \
            .github/workflows/apply-update-bundle-v3.yml; do
            if [[ -e "$final_tree/$temporary_workflow" ]]; then
              echo "Temporary installer workflow unexpectedly exists in the imported tree: $temporary_workflow" >&2
              exit 1
            fi
          done

      - name: Install validation dependencies
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 -m pip install --disable-pip-version-check \
            "beautifulsoup4==${BEAUTIFULSOUP_VERSION}" \
            "openpyxl==${OPENPYXL_VERSION}" \
            "playwright==${PLAYWRIGHT_VERSION}"

          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --no-package-lock
          fi

      - name: Run deterministic repository validation
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          node tests/js/security-modules.test.js
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Check JavaScript syntax
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Report missing referenced icon assets
        id: asset_report
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0
          for asset in \
            assets/icons/office.png \
            assets/icons/documents.png \
            assets/icons/spreadsheets.png \
            assets/icons/presentations.png; do
            if [[ ! -s "$asset" ]]; then
              echo "::warning file=$asset::Referenced icon asset is missing or empty. This can produce a browser-console 404."
              missing=$((missing + 1))
            fi
          done

          echo "missing_count=$missing" >> "$GITHUB_OUTPUT"
          echo "Referenced icon assets missing: $missing" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Chromium regressions (advisory)
        id: browser
        if: ${{ inputs.run_browser_tests }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 -m playwright install --with-deps chromium

          chromium_path="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"

          if [[ ! -x "$chromium_path" ]]; then
            echo "Playwright Chromium executable not found: $chromium_path" >&2
            exit 1
          fi

          export CHROMIUM_PATH="$chromium_path"
          export PLAYWRIGHT_BROWSER=chromium

          status=0
          for group in \
            package-security \
            lifecycle \
            isolation-offline \
            documents-presentations \
            spreadsheets; do
            echo "Running browser regression group: $group"
            if ! python3 scripts/run_browser_regressions.py --group "$group"; then
              status=1
            fi
          done

          exit "$status"

      - name: Record browser regression status
        id: browser_status
        if: ${{ always() }}
        shell: bash
        env:
          RUN_BROWSER_TESTS: ${{ inputs.run_browser_tests }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          MISSING_ICONS: ${{ steps.asset_report.outputs.missing_count }}
        run: |
          set -Eeuo pipefail

          if [[ "$RUN_BROWSER_TESTS" != "true" ]]; then
            status="skipped"
          elif [[ "$BROWSER_OUTCOME" == "success" ]]; then
            status="passed"
          else
            status="failed-advisory"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### Browser validation"
            echo
            echo "- Status: $status"
            echo "- Missing referenced icons: ${MISSING_ICONS:-unknown}"
            echo "- Browser failure is advisory and does not modify or block the base branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser diagnostics
        if: ${{ always() && inputs.run_browser_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: inkdesk-browser-diagnostics
          path: ${{ runner.temp }}/final-tree/tests/browser/results
          if-no-files-found: warn
          retention-days: 7

      - name: Create validated tree artifact
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.bundle_commit }}
        run: |
          set -Eeuo pipefail

          final_tree="$RUNNER_TEMP/final-tree"
          artifact="$RUNNER_TEMP/inkdesk-validated-tree.tar"

          tar --exclude='.git' --format=posix -C "$final_tree" -cf "$artifact" .

          artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          printf '%s\n' "$artifact_sha" > "$RUNNER_TEMP/inkdesk-validated-tree.tar.sha256"
          printf '%s\n' "${EXPECTED_COMMIT,,}" > "$RUNNER_TEMP/inkdesk-validated-tree.commit"

      - name: Upload validated tree
        uses: actions/upload-artifact@v4
        with:
          name: inkdesk-validated-tree
          path: |
            ${{ runner.temp }}/inkdesk-validated-tree.tar
            ${{ runner.temp }}/inkdesk-validated-tree.tar.sha256
            ${{ runner.temp }}/inkdesk-validated-tree.commit
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Create review branch and draft pull request
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out exact validated base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated tree
        uses: actions/download-artifact@v4
        with:
          name: inkdesk-validated-tree
          path: ${{ runner.temp }}/validated-artifact

      - name: Verify artifact and create review branch
        id: branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ needs.validate.outputs.target_branch }}
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          EXPECTED_FINAL_COMMIT: ${{ needs.validate.outputs.final_commit }}
          EXPECTED_BUNDLE_SHA: ${{ needs.validate.outputs.bundle_sha256 }}
        run: |
          set -Eeuo pipefail

          current_base_sha="$(git rev-parse HEAD^{commit})"
          if [[ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Checked-out base commit does not match the validated base commit." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch unexpectedly exists: $TARGET_BRANCH" >&2
            exit 1
          fi

          artifact_dir="$RUNNER_TEMP/validated-artifact"
          artifact="$artifact_dir/inkdesk-validated-tree.tar"

          expected_artifact_sha="$(tr -d '[:space:]' < "$artifact_dir/inkdesk-validated-tree.tar.sha256")"
          actual_artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          if [[ "$actual_artifact_sha" != "$expected_artifact_sha" ]]; then
            echo "Validated tree artifact checksum mismatch." >&2
            exit 1
          fi

          artifact_commit="$(tr -d '[:space:]' < "$artifact_dir/inkdesk-validated-tree.commit")"
          if [[ "$artifact_commit" != "$EXPECTED_FINAL_COMMIT" ]]; then
            echo "Validated tree commit metadata mismatch." >&2
            exit 1
          fi

          git switch --create "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          tar -C . -xf "$artifact"

          for temporary_workflow in \
            .github/workflows/apply-update-patch.yml \
            .github/workflows/apply-update-bundle.yml \
            .github/workflows/apply-update-bundle-v3.yml; do
            if [[ -e "$temporary_workflow" ]]; then
              echo "Temporary installer workflow unexpectedly exists in final tree: $temporary_workflow" >&2
              exit 1
            fi
          done

          git add --all
          if git diff --cached --quiet; then
            echo "The imported tree produces no changes relative to the base branch." >&2
            exit 1
          fi

          git commit \
            -m "Apply InkDesk 0.19.1-beta hardening update" \
            -m "Validated bundle commit: $EXPECTED_FINAL_COMMIT" \
            -m "Validated bundle SHA-256: $EXPECTED_BUNDLE_SHA"

          created_commit="$(git rev-parse HEAD^{commit})"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "created_commit=$created_commit" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request
        id: pull_request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_BRANCH: ${{ needs.validate.outputs.target_branch }}
          DRAFT_PR: ${{ inputs.draft_pr }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          PAYLOAD_SHA: ${{ needs.validate.outputs.payload_sha }}
          BUNDLE_SHA: ${{ needs.validate.outputs.bundle_sha256 }}
          FINAL_COMMIT: ${{ needs.validate.outputs.final_commit }}
          CREATED_COMMIT: ${{ steps.branch.outputs.created_commit }}
          BROWSER_STATUS: ${{ needs.validate.outputs.browser_status }}
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Summary

          Applies the checksum-verified InkDesk 0.19.1-beta hardening tree in a separate review branch.

          ## Validation metadata

          - Base commit: \`${BASE_SHA}\`
          - Payload commit: \`${PAYLOAD_SHA}\`
          - Bundle SHA-256: \`${BUNDLE_SHA}\`
          - Bundled source commit: \`${FINAL_COMMIT}\`
          - Created repository commit: \`${CREATED_COMMIT}\`
          - Chromium regressions: **${BROWSER_STATUS}**

          ## Safety

          - The base branch was not modified.
          - No tag or release was created.
          - Merge remains a manual repository-owner decision.
          - A failed Chromium result is recorded as advisory; deterministic validation still had to pass.
          EOF

          draft_argument=()
          if [[ "$DRAFT_PR" == "true" ]]; then
            draft_argument+=(--draft)
          fi

          pr_url="$(
            gh pr create \
              --base "$BASE_REF" \
              --head "$TARGET_BRANCH" \
              --title "Apply InkDesk 0.19.1-beta hardening update" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              "${draft_argument[@]}"
          )"

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain manual pull request creation when needed
        if: ${{ steps.pull_request.outcome == 'failure' }}
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_BRANCH: ${{ needs.validate.outputs.target_branch }}
        run: |
          {
            echo "### Branch created, but the pull request was not opened automatically"
            echo
            echo "Open:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${TARGET_BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
