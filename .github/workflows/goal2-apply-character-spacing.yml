name: Goal 2 apply character spacing fix

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-apply-character-spacing.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Apply narrow character-spacing patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'apps/presentations/io/pptx-open-controller.js',
              "const sz=pick('sz'),b=pick('b'),i=pick('i'),u=pick('u');return {fontSizePt:Math.max(5,Math.min(144,sz!=null?num(sz,2400)/100:(Number(fallback.fontSizePt)||24))),bold:b!=null?bool(b):!!fallback.bold,italic:i!=null?bool(i):!!fallback.italic,underline:u!=null?!['none','0',null].includes(u):!!fallback.underline,color:styleColor(rPr,def,theme,map,fallback),fontFamily:family}",
              "const sz=pick('sz'),b=pick('b'),i=pick('i'),u=pick('u'),spc=pick('spc');return {fontSizePt:Math.max(5,Math.min(144,sz!=null?num(sz,2400)/100:(Number(fallback.fontSizePt)||24))),bold:b!=null?bool(b):!!fallback.bold,italic:i!=null?bool(i):!!fallback.italic,underline:u!=null?!['none','0',null].includes(u):!!fallback.underline,color:styleColor(rPr,def,theme,map,fallback),fontFamily:family,charSpacingPt:spc!=null?num(spc,0)/100:(Number(fallback.charSpacingPt)||0)}"
          )
          replace(
              'apps/presentations/io/pptx-open-controller.js',
              "fontSizePt:r0.fontSizePt||24,bold:!!r0.bold,italic:!!r0.italic,underline:!!r0.underline,align:pars[0]?.align||'left',color:r0.color||null,fontFamily:r0.fontFamily||null,...bodyInfo(tx)}",
              "fontSizePt:r0.fontSizePt||24,bold:!!r0.bold,italic:!!r0.italic,underline:!!r0.underline,align:pars[0]?.align||'left',color:r0.color||null,fontFamily:r0.fontFamily||null,charSpacingPt:Number(r0.charSpacingPt)||0,...bodyInfo(tx)}"
          )

          replace(
              'apps/presentations/engine/presentation-session.js',
              "runs:Array.isArray(p.runs)&&p.runs.length?p.runs.map(r=>({text:String(r.text??''),fontSizePt:sane(r.fontSizePt,fallback.fontSizePt||24),bold:!!r.bold,italic:!!r.italic,underline:!!r.underline,color:r.color||fallback.color||null,fontFamily:r.fontFamily||fallback.fontFamily||null})):[{text:'',fontSizePt:fallback.fontSizePt||24,bold:!!fallback.bold,italic:!!fallback.italic,underline:false,color:fallback.color||null,fontFamily:fallback.fontFamily||null}]",
              "runs:Array.isArray(p.runs)&&p.runs.length?p.runs.map(r=>({text:String(r.text??''),fontSizePt:sane(r.fontSizePt,fallback.fontSizePt||24),bold:!!r.bold,italic:!!r.italic,underline:!!r.underline,color:r.color||fallback.color||null,fontFamily:r.fontFamily||fallback.fontFamily||null,charSpacingPt:sane(r.charSpacingPt,fallback.charSpacingPt||0)})):[{text:'',fontSizePt:fallback.fontSizePt||24,bold:!!fallback.bold,italic:!!fallback.italic,underline:false,color:fallback.color||null,fontFamily:fallback.fontFamily||null,charSpacingPt:sane(fallback.charSpacingPt,0)}]"
          )
          replace(
              'apps/presentations/engine/presentation-session.js',
              "runs:[{text:line,fontSizePt:fallback.fontSizePt||24,bold:!!fallback.bold,italic:!!fallback.italic,underline:false,color:fallback.color||null,fontFamily:fallback.fontFamily||null}]}));",
              "runs:[{text:line,fontSizePt:fallback.fontSizePt||24,bold:!!fallback.bold,italic:!!fallback.italic,underline:false,color:fallback.color||null,fontFamily:fallback.fontFamily||null,charSpacingPt:sane(fallback.charSpacingPt,0)}]}));"
          )

          replace(
              'apps/presentations/view/slide-surface.js',
              "if(r.color)span.style.color=r.color;if(r.fontFamily)span.style.fontFamily=`${JSON.stringify(r.fontFamily)}, Arial, sans-serif`;line.appendChild(span)",
              "if(r.color)span.style.color=r.color;if(r.fontFamily)span.style.fontFamily=`${JSON.stringify(r.fontFamily)}, Arial, sans-serif`;if(Number.isFinite(Number(r.charSpacingPt))&&Number(r.charSpacingPt)!==0)span.style.letterSpacing=(Number(r.charSpacingPt)*(o.autoFitScale||1))+'pt';line.appendChild(span)"
          )

          replace(
              'apps/presentations/io/pptx-preservation-writer.js',
              "rp.setAttribute('sz',String(Math.max(500,Math.min(14400,Math.round(Number(r.fontSizePt||24)*100)))));if(r.bold)",
              "rp.setAttribute('sz',String(Math.max(500,Math.min(14400,Math.round(Number(r.fontSizePt||24)*100)))));if(Number.isFinite(Number(r.charSpacingPt))&&Math.abs(Number(r.charSpacingPt))>.0001)rp.setAttribute('spc',String(Math.round(Number(r.charSpacingPt)*100)));if(r.bold)"
          )
          replace(
              'apps/presentations/io/pptx-preservation-writer.js',
              "function runStructure(r){return {fontSizePt:Number(r?.fontSizePt||0),bold:!!r?.bold,italic:!!r?.italic,underline:!!r?.underline,color:r?.color||null,fontFamily:r?.fontFamily||null}}",
              "function runStructure(r){return {fontSizePt:Number(r?.fontSizePt||0),bold:!!r?.bold,italic:!!r?.italic,underline:!!r?.underline,color:r?.color||null,fontFamily:r?.fontFamily||null,charSpacingPt:Number(r?.charSpacingPt||0)}}"
          )
          PY
      - name: Syntax check changed runtime files
        run: |
          node --check apps/presentations/io/pptx-open-controller.js
          node --check apps/presentations/engine/presentation-session.js
          node --check apps/presentations/view/slide-surface.js
          node --check apps/presentations/io/pptx-preservation-writer.js
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify background regression remains green
        run: python tests/test_pptx_slide_background_fidelity_browser.py
      - name: Verify character-spacing regression turns green
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Commit tested production fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/inkdos-2.3
          test "$(git rev-parse origin/feature/inkdos-2.3)" = "${GITHUB_SHA}" || { echo 'Branch advanced during patch run' >&2; exit 1; }
          git rm .github/workflows/goal2-apply-character-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/presentations/io/pptx-open-controller.js apps/presentations/engine/presentation-session.js apps/presentations/view/slide-surface.js apps/presentations/io/pptx-preservation-writer.js
          git commit -m 'fix: preserve PPTX character spacing fidelity'
          git push origin HEAD:feature/inkdos-2.3
