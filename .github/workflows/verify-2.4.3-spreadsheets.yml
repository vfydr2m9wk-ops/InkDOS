name: Verify InkDOS 2.4.3 Spreadsheets RED

on:
  push:
    branches:
      - feat/2.4.3-spreadsheet-fill-clear
    paths:
      - '.github/workflows/verify-2.4.3-spreadsheets.yml'
      - 'tests/test_spreadsheets_243_fill_clear_browser.py'
      - 'apps/spreadsheets/**'

permissions:
  contents: read

jobs:
  spreadsheets-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Spreadsheets 2.4.3 fill/clear regression
        run: python tests/test_spreadsheets_243_fill_clear_browser.py
