name: Verify InkDOS 2.4.3 Home candidate

on:
  push:
    branches:
      - fix/2.4.3-home-density
    paths:
      - '.github/workflows/verify-2.4.3-home.yml'

permissions:
  contents: read

jobs:
  home-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Home density source contract
        run: python tests/test_home_density_layout_contract.py
      - name: Run Home density browser regression
        run: python tests/test_home_density_layout_browser.py
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
