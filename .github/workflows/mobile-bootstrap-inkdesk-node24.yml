name: Mobile package import

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Exact ZIP filename uploaded to the repository root
        required: true
        default: InkDesk_v0.19.0-beta.zip
        type: string

permissions:
  contents: write

concurrency:
  group: inkdesk-mobile-import
  cancel-in-progress: false

jobs:
  import-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.INKDESK_BOOTSTRAP_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Locate and safely extract package
        id: package
        env:
          REQUESTED_ZIP: ${{ inputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$REQUESTED_ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "Requested package was not found: $ZIP"
            echo "ZIP files in repository root:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort
            exit 1
          fi

          rm -rf .mobile-import
          mkdir .mobile-import

          python3 - "$ZIP" <<'PYEXTRACT'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive_name = sys.argv[1]
          total_uncompressed = 0
          max_uncompressed = 500 * 1024 * 1024

          with zipfile.ZipFile(archive_name) as archive:
              for member in archive.infolist():
                  path = PurePosixPath(member.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.filename}")

                  total_uncompressed += member.file_size

                  if total_uncompressed > max_uncompressed:
                      raise SystemExit(
                          "Archive exceeds the 500 MB uncompressed safety limit."
                      )

              archive.extractall(".mobile-import")

          print(f"Extracted {total_uncompressed} bytes.")
          PYEXTRACT

          IMPORT_ROOT=$(python3 <<'PYROOT'
          from pathlib import Path

          root = Path(".mobile-import")
          ignored = {"__MACOSX", ".DS_Store"}

          def valid_project(path):
              return (
                  path.is_dir()
                  and (path / "VERSION.json").is_file()
                  and (path / "index.html").is_file()
                  and (path / "apps").is_dir()
              )

          if valid_project(root):
              print(root)
              raise SystemExit(0)

          direct_entries = [
              entry for entry in root.iterdir()
              if entry.name not in ignored
          ]

          direct_matches = [
              entry for entry in direct_entries
              if valid_project(entry)
          ]

          if len(direct_matches) == 1:
              print(direct_matches[0])
              raise SystemExit(0)

          matches = sorted(
              {
                  version_file.parent.resolve()
                  for version_file in root.rglob("VERSION.json")
                  if valid_project(version_file.parent)
              },
              key=lambda path: (len(path.parts), path.as_posix()),
          )

          if len(matches) == 1:
              print(matches[0])
              raise SystemExit(0)

          if not matches:
              raise SystemExit(
                  "No valid InkDesk source tree was found inside the ZIP."
              )

          raise SystemExit(
              "Multiple InkDesk source trees were found inside the ZIP."
          )
          PYROOT
          )

          PROJECT_NAME=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("name",""))' \
            "$IMPORT_ROOT/VERSION.json")

          if [ "$PROJECT_NAME" != "InkDesk" ]; then
            echo "Unexpected project name in VERSION.json: $PROJECT_NAME"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "import_root=$IMPORT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Using package: $ZIP"
          echo "Detected project root: $IMPORT_ROOT"

      - name: Validate extracted project
        env:
          IMPORT_ROOT: ${{ steps.package.outputs.import_root }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$IMPORT_ROOT"

          python3 scripts/validate_repository.py

          if [ -f scripts/audit_source.py ]; then
            python3 scripts/audit_source.py
          elif [ -f scripts/audit_repository.py ]; then
            python3 scripts/audit_repository.py
          fi

          python3 -m unittest discover -s tests -p "test_*.py" -v

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find apps shared -type f -name '*.js' -print0
          )

      - name: Replace repository contents
        env:
          IMPORT_ROOT: ${{ steps.package.outputs.import_root }}
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.mobile-import/' \
            --exclude="$ZIP" \
            "$IMPORT_ROOT/" ./

          rm -rf .mobile-import
          rm -f "$ZIP"
          rm -f .github/workflows/mobile-bootstrap-inkdesk.yml
          rm -f .github/workflows/mobile-bootstrap-inkdesk-node24.yml

      - name: Validate repository after replacement
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/validate_repository.py

          if [ -f scripts/audit_source.py ]; then
            python3 scripts/audit_source.py
          elif [ -f scripts/audit_repository.py ]; then
            python3 scripts/audit_repository.py
          fi

          python3 -m unittest discover -s tests -p "test_*.py" -v

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find apps shared -type f -name '*.js' -print0
          )

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(python3 -c \
            'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')

          RELEASE_NAME=$(python3 -c \
            'import json; print(json.load(open("VERSION.json", encoding="utf-8")).get("codename", "Foundation"))')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit \
              -m "release: publish InkDesk ${VERSION}" \
              -m "${RELEASE_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Write summary
        shell: bash
        run: |
          VERSION=$(python3 -c \
            'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')

          {
            echo "# InkDesk Mobile Import"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Validation: passed"
            echo "- Tests: passed"
            echo "- Official workflows: imported"
            echo "- Temporary bootstrap workflow: removed"
          } >> "$GITHUB_STEP_SUMMARY"
