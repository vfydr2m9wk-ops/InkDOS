name: Prune workflow runs

# Manual maintenance: deletes runs of workflows whose file no longer exists
# on the default branch, and keeps only the newest runs of active workflows.
# Release runs are always kept (they document published builds).

on:
  workflow_dispatch:
    inputs:
      keep:
        description: Newest runs kept per active workflow
        default: '15'
      dry_run:
        description: List only, delete nothing
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const keep = Math.max(1, parseInt(process.env.KEEP, 10) || 15);
            const dry = process.env.DRY_RUN === 'true';
            const { owner, repo } = context.repo;
            const self = context.runId;
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 });
            let deleted = 0;
            for (const wf of workflows) {
              if (wf.path.endsWith('/release.yml')) { core.info(`keep all: ${wf.path}`); continue; }
              let active = wf.path.startsWith('dynamic/');
              if (!active) {
                try { await github.rest.repos.getContent({ owner, repo, path: wf.path }); active = true; }
                catch (e) { if (e.status !== 404) throw e; }
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { owner, repo, workflow_id: wf.id, per_page: 100 });
              const done = runs.filter(r => r.status === 'completed' && r.id !== self);
              const victims = active ? done.slice(keep) : done;
              core.info(`${wf.path}: ${runs.length} runs, ${active ? 'active' : 'removed'}, ${dry ? 'would delete' : 'deleting'} ${victims.length}`);
              for (const r of victims) {
                if (!dry) await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                deleted++;
              }
            }
            core.notice(`${dry ? 'Would delete' : 'Deleted'} ${deleted} runs`);
