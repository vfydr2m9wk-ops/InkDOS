name: InkDOS unified release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'config/release-trigger-*.json'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

concurrency:
  group: inkdos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 40
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      native_builds: ${{ steps.release.outputs.native_builds }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      latest: ${{ steps.release.outputs.latest }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Resolve release channel and immutable tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          CHANNEL="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["releaseChannel"])')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = "refs/heads/main"
            RELEASE_TAG="v${VERSION}"
            TRIGGER="config/release-trigger-${VERSION}.json"
            test -f "$TRIGGER"
            python - "$TRIGGER" "$VERSION" "$RELEASE_TAG" "$CHANNEL" <<'PY'
          import json, sys
          path, version, tag, channel = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          expected = {'version': version, 'tag': tag, 'channel': channel}
          if data != expected:
              raise SystemExit(f'Release trigger mismatch: expected {expected!r}, received {data!r}')
          PY
          fi
          case "$CHANNEL" in
            stable) NATIVE_BUILDS=true; PRERELEASE=false; LATEST=true; TITLE="InkDOS ${VERSION}" ;;
            beta) NATIVE_BUILDS=false; PRERELEASE=true; LATEST=false; TITLE="InkDOS ${VERSION} Beta" ;;
            *) echo "Unsupported release channel: $CHANNEL" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "native_builds=$NATIVE_BUILDS" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Require tag commit to belong to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${RELEASE_COMMIT}"
          else
            ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          fi

      - name: Validate tag and desktop version
        run: |
          python desktop/scripts/release_version.py --check-tag "$RELEASE_TAG"
          python desktop/scripts/release_version.py --check-config

      - name: Validate final candidate version surfaces
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          python desktop/scripts/check_release_candidate.py --version "$VERSION"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install Chromium for browser release validation
        run: python -m playwright install --with-deps chromium

      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py

      - name: Run desktop contract
        run: python tests/test_tauri_desktop_contract.py

      - name: Run Goal 4 updater contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_goal4_*contract.py; do
            python "$test"
          done

      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check

      - name: Install verified Rust toolchain for signing preflight
        if: steps.release.outputs.native_builds == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Restore verified Tauri CLI cache for signing preflight
        if: steps.release.outputs.native_builds == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: inkdos-tauri-cli-${{ runner.os }}-rust-1.98.1-tauri-2.11.4-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install verified Tauri CLI for signing preflight
        if: steps.release.outputs.native_builds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo tauri --version 2>/dev/null | grep -F "2.11.4" >/dev/null; then
            cargo install tauri-cli --version "2.11.4" --locked --force
          fi
          cargo tauri --version | grep -F "2.11.4"

      - name: Signing preflight
        if: steps.release.outputs.native_builds == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is missing." >&2
            exit 1
          }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || {
            echo "TAURI_UPDATER_PUBLIC_KEY is missing." >&2
            exit 1
          }
          python desktop/scripts/prepare_updater_release_config.py \
            --pubkey "$TAURI_UPDATER_PUBLIC_KEY"
          printf 'InkDOS updater signing preflight\n' > /tmp/inkdos-signing-preflight.txt
          cargo tauri signer sign /tmp/inkdos-signing-preflight.txt

      - name: Record immutable build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-provenance
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, os
          version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))['version']
          payload = {
              'release_tag': os.environ['RELEASE_TAG'],
              'commit_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'version': version,
          }
          Path('release-provenance/provenance.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload immutable build provenance
        uses: actions/upload-artifact@v4
        with:
          name: Release-Provenance
          path: release-provenance/provenance.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    if: needs.validate.outputs.native_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: InkDOS-Windows
            bundles: nsis
            release_paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          - os: macos-latest
            artifact: InkDOS-macOS
            bundles: app,dmg
            release_paths: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - os: ubuntu-22.04
            artifact: InkDOS-Linux
            bundles: appimage
            release_paths: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install verified Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Restore stable native build cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: inkdos-native-${{ runner.os }}-rust-1.98.1-tauri-2.11.4-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install verified Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo tauri --version 2>/dev/null | grep -F "2.11.4" >/dev/null; then
            cargo install tauri-cli --version "2.11.4" --locked --force
          fi
          cargo tauri --version | grep -F "2.11.4"

      - name: Revalidate release metadata
        run: |
          python desktop/scripts/release_version.py --check-tag "$RELEASE_TAG"
          python desktop/scripts/release_version.py --check-config

      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py

      - name: Generate desktop icons
        working-directory: desktop/src-tauri
        run: cargo tauri icon ../../assets/icons/office.png

      - name: Generate workspace native icons from canonical sources
        run: python desktop/scripts/generate_workspace_icons.py

      - name: Generate macOS workspace launch entries
        if: runner.os == 'macOS'
        run: python desktop/scripts/generate_macos_workspace_launchers.py

      - name: Check Tauri shell
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Prepare signed updater release config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python desktop/scripts/prepare_updater_release_config.py \
            --pubkey "$TAURI_UPDATER_PUBLIC_KEY"

      - name: Build signed native installers and updater artifacts
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: cargo tauri build --bundles ${{ matrix.bundles }} --config tauri.updater.release.conf.json

      - name: Upload final native installers and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.release_paths }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    if: ${{ always() && needs.validate.result == 'success' && (needs.validate.outputs.native_builds == 'false' || needs.build.result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download current-run native artifacts
        if: needs.validate.outputs.native_builds == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: InkDOS-*
          path: release-assets
          merge-multiple: true

      - name: Download current-run provenance
        uses: actions/download-artifact@v4
        with:
          name: Release-Provenance
          path: release-provenance

      - name: Verify artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          provenance = json.loads(Path('release-provenance/provenance.json').read_text(encoding='utf-8'))
          version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))['version']
          commit_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = {
              'release_tag': os.environ['RELEASE_TAG'],
              'commit_sha': commit_sha,
              'version': version,
          }
          if provenance != expected:
              raise SystemExit(
                  'Artifact provenance mismatch. Expected ' + json.dumps(expected, sort_keys=True) +
                  ', received ' + json.dumps(provenance, sort_keys=True)
              )
          print(f"Verified artifacts for {expected['release_tag']} at {commit_sha}.")
          PY

      - name: Select and validate release artifacts
        if: needs.validate.outputs.native_builds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('release-assets')
          final = Path('release-final')
          final.mkdir(exist_ok=True)

          required_installers = ('.exe', '.dmg', '.AppImage')
          selected = {}
          for suffix in required_installers:
              matches = sorted(
                  p for p in root.rglob('*')
                  if p.is_file() and p.name.endswith(suffix) and not p.name.endswith('.sig')
              )
              if len(matches) != 1:
                  rendered = ', '.join(p.as_posix() for p in matches) or 'none'
                  raise SystemExit(
                      f'Expected exactly one {suffix} installer, found {len(matches)}: {rendered}'
                  )
              selected[suffix] = matches[0]

          updater_required = ('.exe.sig', '.app.tar.gz', '.app.tar.gz.sig', '.AppImage.sig')
          updater_selected = {}
          for suffix in updater_required:
              matches = sorted(p for p in root.rglob('*') if p.is_file() and p.name.endswith(suffix))
              if len(matches) != 1:
                  rendered = ', '.join(p.as_posix() for p in matches) or 'none'
                  raise SystemExit(
                      f'Expected exactly one updater artifact *{suffix}, found {len(matches)}: {rendered}'
                  )
              updater_selected[suffix] = matches[0]

          all_selected = list(selected.values()) + list(updater_selected.values())
          names = [path.name for path in all_selected]
          if len(names) != len(set(names)):
              raise SystemExit('Release artifact basenames are not unique.')

          for path in all_selected:
              shutil.copy2(path, final / path.name)

          print('Validated release artifacts:')
          for path in sorted(final.iterdir()):
              if path.is_file():
                  print(path.as_posix())
          PY

      - name: Validate release inventory and generate SHA-256 checksums
        if: needs.validate.outputs.native_builds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          python desktop/scripts/validate_release_inventory.py \
            --version "$VERSION" \
            --assets release-final \
            --output release-final/SHA256SUMS

      - name: Prepare stable release notes
        if: needs.validate.outputs.native_builds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          cat > release-notes.md <<EOF
          # InkDOS ${VERSION}

          One source version for the web/PWA and installable desktop editions.

          Web edition: https://vfydr2m9wk-ops.github.io/InkDOS/

          Desktop installers attached to this stable release are NSIS/EXE for Windows, DMG for macOS and AppImage for Linux. Signed Tauri updater artifacts are generated from the same tagged commit.
          EOF

      - name: Prepare beta web-only release
        if: needs.validate.outputs.native_builds == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          mkdir -p release-final
          if find release-final -mindepth 1 -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Beta release-final must stay empty." >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          # InkDOS ${VERSION} Beta

          Web/PWA/source-only prerelease for real-device validation.

          Web edition: https://vfydr2m9wk-ops.github.io/InkDOS/

          This beta intentionally publishes no EXE, DMG, AppImage or native updater artifacts. InkDOS 2.6.1 remains the stable/latest release.
          EOF

      - name: Build signed updater manifest
        if: needs.validate.outputs.native_builds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          python desktop/scripts/build_updater_manifest.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --assets release-final \
            --notes release-notes.md \
            --output release-final/latest.json

      - name: Validate final release bundle coherence
        if: needs.validate.outputs.native_builds == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          python desktop/scripts/validate_release_bundle.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --assets release-final

      - name: Validate explicit publication authorization
        run: python desktop/scripts/validate_release_authorization.py --version "$(python -c 'import json; print(json.load(open("VERSION.json"))["version"])')" --assets release-final

      - name: Publish verified release transactionally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')"
          CHANNEL="${{ needs.validate.outputs.channel }}"
          NATIVE_BUILDS="${{ needs.validate.outputs.native_builds }}"
          PRERELEASE="${{ needs.validate.outputs.prerelease }}"
          LATEST="${{ needs.validate.outputs.latest }}"
          TITLE="${{ needs.validate.outputs.title }}"

          case "$CHANNEL" in
            stable) test "$NATIVE_BUILDS" = "true" ;;
            beta) test "$NATIVE_BUILDS" = "false" ;;
            *) echo "Unsupported release channel: $CHANNEL" >&2; exit 1 ;;
          esac

          ASSETS=()
          if [ "$NATIVE_BUILDS" = "true" ]; then
            test -s release-final/latest.json
            mapfile -d '' ASSETS < <(find release-final -maxdepth 1 -type f -print0)
            if [ "${#ASSETS[@]}" -lt 8 ]; then
              echo "Release is missing required installer/updater assets." >&2
              exit 1
            fi
          else
            if find release-final -mindepth 1 -maxdepth 1 -type f -print -quit | grep -q .; then
              echo "Beta release-final must stay empty." >&2
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" --json isDraft,assets > /tmp/release-state.json 2>/dev/null; then
            IS_DRAFT="$(python -c 'import json; print(str(json.load(open("/tmp/release-state.json"))["isDraft"]).lower())')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Refusing to overwrite an already-public release: $RELEASE_TAG" >&2
              exit 1
            fi
            if [ "$NATIVE_BUILDS" = "false" ]; then
              EXISTING_ASSETS="$(python -c 'import json; print(len(json.load(open("/tmp/release-state.json"))["assets"]))')"
              if [ "$EXISTING_ASSETS" != "0" ]; then
                echo "Beta releases must not contain uploaded assets." >&2
                exit 1
              fi
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_COMMIT" \
              --draft \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi

          if [ "$NATIVE_BUILDS" = "true" ]; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          fi

          mapfile -t REMOTE_ASSETS < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if [ "$NATIVE_BUILDS" = "true" ]; then
            printf '%s\n' "${ASSETS[@]##*/}" | LC_ALL=C sort -u > /tmp/local-assets.txt
            printf '%s\n' "${REMOTE_ASSETS[@]}" | LC_ALL=C sort -u > /tmp/remote-assets.txt
            REMOTE_SORTED="$(cat /tmp/remote-assets.txt)"
            if ! cmp -s /tmp/local-assets.txt /tmp/remote-assets.txt; then
              echo "Refusing to promote draft with non-exact asset inventory." >&2
              comm -3 /tmp/local-assets.txt /tmp/remote-assets.txt >&2 || true
              exit 1
            fi
            printf '%s\n' "$REMOTE_SORTED" | grep -Fx 'latest.json' >/dev/null
          else
            REMOTE_SORTED="$(printf '%s\n' "${REMOTE_ASSETS[@]}")"
            if [ "${#REMOTE_ASSETS[@]}" -ne 0 ]; then
              echo "Beta releases must not contain uploaded assets." >&2
              printf '%s\n' "$REMOTE_SORTED" >&2
              exit 1
            fi
          fi

          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease="$PRERELEASE" \
            --latest="$LATEST" \
            --title "$TITLE" \
            --notes-file release-notes.md
