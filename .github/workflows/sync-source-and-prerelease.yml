name: Synchronize source and publish prerelease

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: Source update ZIP committed temporarily at repository root
        required: true
        default: InkDesk_v0.19.1-beta_source-update.zip
        type: string
      expected_version:
        description: Version expected inside VERSION.json
        required: true
        default: 0.19.1-beta
        type: string
      tag:
        description: Tag that will point to the synchronized main commit
        required: true
        default: v0.19.1-beta
        type: string
      release_title:
        description: GitHub prerelease title
        required: true
        default: InkDesk v0.19.1-beta — Export Verification, Parser Hardening, and Unified Navigation
        type: string
      publish_release:
        description: Publish or update the GitHub prerelease after every validation passes
        required: true
        default: true
        type: boolean
      replace_existing_tag:
        description: Move an existing tag to the newly synchronized commit
        required: true
        default: false
        type: boolean
      replace_existing_release:
        description: Update an existing release with this tag and replace its assets
        required: true
        default: true
        type: boolean
      confirmation:
        description: Type UPDATE to authorize synchronization of main and release publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inkdesk-source-release-sync
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.metadata.outputs.base_sha }}
      archive_name: ${{ steps.metadata.outputs.archive_name }}
      expected_version: ${{ steps.metadata.outputs.expected_version }}
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      RELEASE_PAT: ${{ secrets.INKDESK_RELEASE_PAT }}
      SOURCE_ARCHIVE: ${{ inputs.source_archive }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      RELEASE_TAG: ${{ inputs.tag }}
      REPLACE_EXISTING_TAG: ${{ inputs.replace_existing_tag }}
      REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate authorization and inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "UPDATE" || {
            echo "The confirmation input must be exactly UPDATE." >&2
            exit 1
          }
          test -n "$RELEASE_PAT" || {
            echo "Repository secret INKDESK_RELEASE_PAT is missing." >&2
            echo "Use a fine-grained PAT limited to this repository with Contents and Workflows read/write." >&2
            exit 1
          }
          [[ "$SOURCE_ARCHIVE" =~ ^[A-Za-z0-9._-]+\.zip$ ]] || {
            echo "source_archive must be a ZIP filename at repository root." >&2
            exit 1
          }
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid expected_version: $EXPECTED_VERSION" >&2
            exit 1
          }
          test "$RELEASE_TAG" = "v$EXPECTED_VERSION" || {
            echo "tag must equal v + expected_version (expected v$EXPECTED_VERSION)." >&2
            exit 1
          }
          test -f "$SOURCE_ARCHIVE" || {
            echo "Source archive not found at repository root: $SOURCE_ARCHIVE" >&2
            exit 1
          }

      - name: Check tag and release conflicts before changing main
        env:
          GH_TOKEN: ${{ secrets.INKDESK_RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$REPLACE_EXISTING_TAG" != "true" ]; then
              echo "Tag $RELEASE_TAG already exists. Enable replace_existing_tag only after reviewing the existing tag." >&2
              exit 1
            fi
            echo "Existing tag $RELEASE_TAG will be moved after validation."
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$REPLACE_EXISTING_RELEASE" != "true" ]; then
              echo "A release already exists for $RELEASE_TAG. Enable replace_existing_release to update it." >&2
              exit 1
            fi
            echo "Existing release $RELEASE_TAG will be updated after validation."
          fi

      - name: Extract source archive safely
        env:
          STAGING_DIR: ${{ runner.temp }}/inkdesk-candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import shutil
          import stat
          import unicodedata
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZIP_STORED, BadZipFile, ZipFile

          archive = Path(os.environ["SOURCE_ARCHIVE"]).resolve()
          destination = Path(os.environ["STAGING_DIR"]).resolve()
          required = (
              "index.html",
              "README.md",
              "VERSION.json",
              "RELEASE_MANIFEST.json",
              "package.json",
              "apps/documents/index.html",
              "apps/spreadsheets/index.html",
              "apps/presentations/index.html",
              ".github/workflows/sync-source-and-prerelease.yml",
              "scripts/build_release.py",
              "scripts/verify_checksums.py",
          )

          try:
              package = ZipFile(archive)
          except BadZipFile as error:
              raise SystemExit(f"Invalid source ZIP: {error}") from error

          with package:
              entries = package.infolist()
              if not entries:
                  raise SystemExit("Source archive is empty.")
              if len(entries) > 5000:
                  raise SystemExit(f"Source archive has too many entries: {len(entries)}")

              total_compressed = sum(entry.compress_size for entry in entries)
              total_expanded = sum(entry.file_size for entry in entries)
              if total_compressed > 100 * 1024 * 1024:
                  raise SystemExit("Source archive exceeds the 100 MiB compressed limit.")
              if total_expanded > 300 * 1024 * 1024:
                  raise SystemExit("Source archive exceeds the 300 MiB expanded limit.")
              if total_compressed and total_expanded / total_compressed > 250:
                  raise SystemExit("Source archive compression ratio is unreasonable.")

              exact: set[str] = set()
              folded: set[str] = set()
              normalized: set[str] = set()
              for entry in entries:
                  raw_name = entry.filename
                  if not raw_name or "\\" in raw_name or any(ord(char) < 32 for char in raw_name):
                      raise SystemExit(f"Invalid source archive path: {raw_name!r}")
                  path = PurePosixPath(raw_name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe source archive path: {raw_name}")
                  if path.parts and path.parts[0].endswith(":"):
                      raise SystemExit(f"Drive-qualified source archive path: {raw_name}")
                  if raw_name in exact:
                      raise SystemExit(f"Duplicate source archive path: {raw_name}")
                  folded_name = raw_name.casefold()
                  normalized_name = unicodedata.normalize("NFC", raw_name).casefold()
                  if folded_name in folded:
                      raise SystemExit(f"Case-insensitive path collision: {raw_name}")
                  if normalized_name in normalized:
                      raise SystemExit(f"Unicode-normalization path collision: {raw_name}")
                  exact.add(raw_name)
                  folded.add(folded_name)
                  normalized.add(normalized_name)

                  if entry.flag_bits & 0x1:
                      raise SystemExit(f"Encrypted entry is not supported: {raw_name}")
                  if entry.compress_type not in {ZIP_STORED, ZIP_DEFLATED}:
                      raise SystemExit(f"Unsupported compression method for {raw_name}")
                  file_type = (entry.external_attr >> 16) & 0o170000
                  if file_type == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {raw_name}")

              for entry in entries:
                  target = (destination / entry.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"Entry escapes extraction directory: {entry.filename}")
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with package.open(entry) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)

          missing = [relative for relative in required if not (destination / relative).is_file()]
          if missing:
              raise SystemExit("Source archive is missing required files: " + ", ".join(missing))
          print(f"Safely extracted {len(entries)} entries to {destination}")
          PY

      - name: Verify candidate version and metadata
        env:
          STAGING_DIR: ${{ runner.temp }}/inkdesk-candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STAGING_DIR"])
          expected = os.environ["EXPECTED_VERSION"]
          files = {
              "VERSION.json": "version",
              "RELEASE_MANIFEST.json": "version",
              "app-manifest.json": "version",
              "package.json": "version",
          }
          for filename, key in files.items():
              observed = json.loads((root / filename).read_text(encoding="utf-8"))[key]
              if observed != expected:
                  raise SystemExit(f"{filename} contains {observed!r}; expected {expected!r}")
          print(f"Candidate metadata consistently declares {expected}.")
          PY

      - name: Run candidate quality gate
        env:
          STAGING_DIR: ${{ runner.temp }}/inkdesk-candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$STAGING_DIR"
          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p "test_*.py"
          node tests/js/security-modules.test.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Package validated candidate for downstream jobs
        id: metadata
        env:
          STAGING_DIR: ${{ runner.temp }}/inkdesk-candidate
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$STAGING_DIR" -czf "$RUNNER_TEMP/inkdesk-candidate-source.tar.gz" .
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "archive_name=$SOURCE_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "expected_version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload validated candidate source
        uses: actions/upload-artifact@v4
        with:
          name: inkdesk-candidate-source-${{ github.run_id }}
          path: ${{ runner.temp }}/inkdesk-candidate-source.tar.gz
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Playwright ${{ matrix.browser }} / ${{ matrix.group }}
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
        group: [package-security, lifecycle, isolation-offline, documents-presentations, spreadsheets]

    steps:
      - name: Download validated candidate source
        uses: actions/download-artifact@v4
        with:
          name: inkdesk-candidate-source-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-download

      - name: Extract candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inkdesk-candidate"
          tar -xzf "$RUNNER_TEMP/candidate-download/inkdesk-candidate-source.tar.gz" \
            -C "$RUNNER_TEMP/inkdesk-candidate"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install selected Playwright engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Execute browser regression group
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          CHROMIUM_PATH: ""
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/inkdesk-candidate"
          python3 scripts/run_browser_regressions.py --group "${{ matrix.group }}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-browser-${{ matrix.browser }}-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/inkdesk-candidate/tests/browser/results/
          if-no-files-found: error
          retention-days: 30

  synchronize-and-release:
    name: Update main, tag, package, and prerelease
    needs: [validate-source, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_PAT: ${{ secrets.INKDESK_RELEASE_PAT }}
      EXPECTED_VERSION: ${{ needs.validate-source.outputs.expected_version }}
      RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
      SOURCE_ARCHIVE: ${{ needs.validate-source.outputs.archive_name }}
      BASE_SHA: ${{ needs.validate-source.outputs.base_sha }}
      REPLACE_EXISTING_TAG: ${{ inputs.replace_existing_tag }}
      REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}

    steps:
      - name: Check out current main without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated candidate source
        uses: actions/download-artifact@v4
        with:
          name: inkdesk-candidate-source-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-download

      - name: Extract validated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/inkdesk-candidate"
          mkdir -p "$RUNNER_TEMP/inkdesk-candidate"
          tar -xzf "$RUNNER_TEMP/candidate-download/inkdesk-candidate-source.tar.gz" \
            -C "$RUNNER_TEMP/inkdesk-candidate"

      - name: Confirm main did not change during validation
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA=$(git rev-parse HEAD)
          test "$CURRENT_SHA" = "$BASE_SHA" || {
            echo "main changed during validation: expected $BASE_SHA, found $CURRENT_SHA." >&2
            echo "Run the workflow again against the new main state." >&2
            exit 1
          }

      - name: Synchronize validated source into main worktree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            "$RUNNER_TEMP/inkdesk-candidate/" ./
          test ! -e "$SOURCE_ARCHIVE"
          test ! -e InkDesk-source.zip

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Revalidate synchronized worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_checksums.py | tee validation-checksums.log
          python3 scripts/validate_repository.py | tee validation-repository.log
          python3 scripts/audit_source.py | tee validation-audit.log
          python3 -m unittest discover -s tests -p "test_*.py" 2>&1 | tee validation-unit.log
          node tests/js/security-modules.test.js 2>&1 | tee validation-javascript.log
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Commit and push synchronized main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "main already matches the validated candidate source."
          else
            git commit -m "Release InkDesk $EXPECTED_VERSION"
          fi

          RELEASE_SHA=$(git rev-parse HEAD)
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Create or update exact release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            EXISTING_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$EXISTING_SHA" = "$RELEASE_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to $RELEASE_SHA."
            elif [ "$REPLACE_EXISTING_TAG" = "true" ]; then
              git tag -d "$RELEASE_TAG"
              git push origin ":refs/tags/$RELEASE_TAG"
              git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "InkDesk $EXPECTED_VERSION"
              git push origin "refs/tags/$RELEASE_TAG"
            else
              echo "Tag $RELEASE_TAG points to $EXISTING_SHA, not $RELEASE_SHA." >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "InkDesk $EXPECTED_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"

      - name: Build deterministic release assets from tagged commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 scripts/build_release.py \
            --output-dir dist \
            --commit "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
          cat > dist/CI_TEST_REPORT.md <<EOF
          # InkDesk $EXPECTED_VERSION CI validation

          - Tag: \`$RELEASE_TAG\`
          - Commit: \`$RELEASE_SHA\`
          - Repository checksum verification: passed
          - Repository validation: passed
          - Source audit: passed
          - Python unit/package tests: passed
          - JavaScript security-module assertions: passed
          - Playwright Chromium groups: passed
          - Playwright Firefox groups: passed
          - Playwright WebKit groups: passed
          - Native Safari and physical iPadOS: not tested by GitHub Actions
          - Installed-PWA device behavior: not tested by GitHub Actions
          EOF
          sha256sum dist/InkDesk_v"$EXPECTED_VERSION".zip
          cat dist/InkDesk_v"$EXPECTED_VERSION".zip.sha256

      - name: Upload complete release review artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkDesk-${{ needs.validate-source.outputs.tag }}-${{ github.run_id }}
          path: |
            dist/*
            RELEASE_NOTES.md
            RELEASE_TEST_REPORT.md
            COMPATIBILITY.md
            UPGRADE_NOTES.md
            docs/KNOWN_LIMITATIONS.md
            docs/MANUAL_DEVICE_CHECKLIST.md
            validation-*.log
          if-no-files-found: error
          retention-days: 90

      - name: Publish or update GitHub prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.INKDESK_RELEASE_PAT }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$REPLACE_EXISTING_RELEASE" = "true" || {
              echo "Release $RELEASE_TAG already exists and replacement is disabled." >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --prerelease \
              --draft=false
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              "${assets[@]}"
          fi

      - name: Write completion summary
        shell: bash
        run: |
          {
            echo "# InkDesk source and prerelease synchronization"
            echo
            echo "- main commit: \`$RELEASE_SHA\`"
            echo "- version: \`$EXPECTED_VERSION\`"
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- source archive removed from main: yes"
            echo "- old InkDesk-source.zip removed: yes"
            echo "- deterministic runtime ZIP generated from tagged commit: yes"
            echo "- prerelease publication requested: \`${{ inputs.publish_release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
