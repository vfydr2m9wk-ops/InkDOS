name: Replace repository and publish prerelease

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: Full source ZIP already uploaded to the repository root
        required: true
        default: InkDesk_v0.19.2-beta_full-source.zip
        type: string
      expected_version:
        description: Version assigned to the release
        required: true
        default: 0.19.2-beta
        type: string
      tag:
        description: Tag to force-move to the replacement commit
        required: true
        default: v0.19.2-beta
        type: string
      release_title:
        description: GitHub prerelease title
        required: true
        default: InkDesk 0.19.2-beta — Release Packaging and Privacy Cleanup
        type: string
      confirmation:
        description: Type REPLACE_ALL to delete and replace the repository worktree
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: inkdesk-full-replacement
  cancel-in-progress: false

jobs:
  replace:
    name: Replace main and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_PAT: ${{ secrets.INKDESK_RELEASE_PAT }}
      SOURCE_ARCHIVE: ${{ inputs.source_archive }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.release_title }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.INKDESK_RELEASE_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Authorize destructive replacement
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "REPLACE_ALL" || {
            echo "The confirmation input must be exactly REPLACE_ALL." >&2
            exit 1
          }
          test -n "$RELEASE_PAT" || {
            echo "Repository secret INKDESK_RELEASE_PAT is missing." >&2
            exit 1
          }
          test "$RELEASE_TAG" = "v$EXPECTED_VERSION" || {
            echo "Tag must equal v + expected_version." >&2
            exit 1
          }
          [[ "$SOURCE_ARCHIVE" =~ ^[A-Za-z0-9._-]+\.zip$ ]] || {
            echo "source_archive must be a ZIP filename in the repository root." >&2
            exit 1
          }
          test -f "$SOURCE_ARCHIVE" || {
            echo "Source archive not found: $SOURCE_ARCHIVE" >&2
            exit 1
          }
          echo "STAGING_DIR=$RUNNER_TEMP/inkdesk-replacement" >> "$GITHUB_ENV"
          echo "ARCHIVE_COPY=$RUNNER_TEMP/$SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          cp "$SOURCE_ARCHIVE" "$RUNNER_TEMP/$SOURCE_ARCHIVE"

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          python3 - <<'PYEXTRACT'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_COPY"])
          target = Path(os.environ["STAGING_DIR"])
          with zipfile.ZipFile(archive) as package:
              for item in package.infolist():
                  path = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if not item.filename or "\\" in item.filename or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename!r}")
                  if path.parts and path.parts[0] == ".git":
                      raise SystemExit("The replacement archive must not contain .git metadata.")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not allowed: {item.filename}")
              package.extractall(target)

          children = [path for path in target.iterdir()]
          source = target
          if len(children) == 1 and children[0].is_dir():
              source = children[0]
          if not any(source.iterdir()):
              raise SystemExit("The replacement archive is empty.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SOURCE_ROOT={source}\n")
          PYEXTRACT

      - name: Replace repository worktree in full
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --is-inside-work-tree >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude='/.git/' "$SOURCE_ROOT/" ./
          git rev-parse --is-inside-work-tree >/dev/null

      - name: Commit replacement and build tagged artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "release: replace repository with InkDesk $EXPECTED_VERSION"
          git tag -f "$RELEASE_TAG"
          mkdir -p "$RUNNER_TEMP/release-assets"
          python3 scripts/build_release.py --output-dir "$RUNNER_TEMP/release-assets"
          cp "$ARCHIVE_COPY" "$RUNNER_TEMP/release-assets/InkDesk_v${EXPECTED_VERSION}_full-source.zip"
          sha256sum "$RUNNER_TEMP/release-assets/InkDesk_v${EXPECTED_VERSION}_full-source.zip"             > "$RUNNER_TEMP/release-assets/InkDesk_v${EXPECTED_VERSION}_full-source.zip.sha256"

      - name: Force-update main and tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main --force
          git push origin "refs/tags/$RELEASE_TAG" --force

      - name: Replace GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INKDESK_RELEASE_PAT }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              test -z "$asset" || gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --prerelease
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"/* --clobber
