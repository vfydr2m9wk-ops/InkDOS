name: Goal 1 full validation checkpoint

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/goal1-validation-trigger'

permissions:
  contents: read

concurrency:
  group: goal1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Clean-snapshot validation
        run: python scripts/run_release_validation.py
      - name: All static contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*_contract.py; do echo "==> $test"; python "$test"; done
      - name: Security and trust-boundary regressions
        run: |
          python tests/test_update_trust_boundary.py
          python tests/test_security_pdfjs_config.py
      - name: Changed-runtime syntax
        run: |
          node --check service-worker.js
          node --check apps/spreadsheets/app.js
          node --check apps/spreadsheets/io/delimited-text.js
          node --check apps/spreadsheets/io/file-delivery.js
          node --check apps/spreadsheets/io/file-open-controller.js
          node --check apps/spreadsheets/io/save-controller.js
          node --check apps/spreadsheets/ui/editor-controller.js
          node --check apps/spreadsheets/ui/session-dialog.js
          node --check apps/spreadsheets/engine/workbook-session.js

  browsers:
    name: Browser validation (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Isolate unrelated Chrome apt source
        run: |
          while IFS= read -r source; do sudo mv "$source" "$source.inkdos-disabled"; done < <(grep -RIl 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
      - name: Install Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            timeout --signal=TERM --kill-after=15s 300s python -m playwright install --with-deps "$BROWSER" && exit 0
            [[ "$attempt" -eq 2 ]] && exit 1
            sleep 5
          done
      - name: Stability suites
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*_stability_browser.py; do echo "==> $test [$BROWSER]"; python "$test"; done
      - name: Preserved feature browser regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_pdf_stability_frame.py
            tests/test_pdf_stability_comments.py
            tests/test_pdf_stability_offline.py
            tests/test_pptx_security_browser.py
            tests/test_ppt_p2_transitions_browser.py
            tests/test_ppt_p2_notes_browser.py
            tests/test_ppt_p2_theme_browser.py
            tests/test_ppt_p2_tables_browser.py
            tests/test_ppt_p2_table_structure_browser.py
            tests/test_ppt_p2_table_merge_browser.py
            tests/test_ppt_p2_table_format_browser.py
            tests/test_ppt_p2_table_style_browser.py
            tests/test_ppt_p2_table_tools_ui_browser.py
            tests/test_xls_s1_structural_formulas_browser.py
            tests/test_xls_s1_structural_columns_browser.py
            tests/test_xls_s2_clipboard_browser.py
          )
          for test in "${tests[@]}"; do echo "==> $test [$BROWSER]"; python "$test"; done

  roundtrips:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Isolate unrelated Chrome apt source
        run: |
          while IFS= read -r source; do sudo mv "$source" "$source.inkdos-disabled"; done < <(grep -RIl 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
      - run: python -m playwright install --with-deps chromium
      - name: Format preservation round-trips
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*roundtrip.py; do echo "==> $test"; python "$test"; done
