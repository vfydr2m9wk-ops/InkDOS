name: Apply adaptive density integration

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/intervention-density-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkdos-density-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate shared density assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          entries = {
              Path('index.html'): ('./shared/ui-density.css', './shared/ui-density.js'),
              Path('apps/documents/index.html'): ('../../shared/ui-density.css', '../../shared/ui-density.js'),
              Path('apps/spreadsheets/index.html'): ('../../shared/ui-density.css', '../../shared/ui-density.js'),
              Path('apps/presentations/index.html'): ('../../shared/ui-density.css', '../../shared/ui-density.js'),
              Path('apps/pdf/index.html'): ('../../shared/ui-density.css', '../../shared/ui-density.js'),
              Path('apps/epub/index.html'): ('../../shared/ui-density.css', '../../shared/ui-density.js'),
              Path('apps/txt/page.template.html'): ('../../shared/ui-density.css', '../../shared/ui-density.js'),
          }
          for path, (css, js) in entries.items():
              text = path.read_text(encoding='utf-8')
              if text.count('</head>') != 1:
                  raise SystemExit(f'Expected one </head> in {path}')
              css_tag = f'<link rel="stylesheet" href="{css}">'
              js_tag = f'<script src="{js}"></script>'
              if css_tag not in text or js_tag not in text:
                  insertion = ''
                  if css_tag not in text:
                      insertion += f'  {css_tag}\n'
                  if js_tag not in text:
                      insertion += f'  {js_tag}\n'
                  text = text.replace('</head>', insertion + '</head>', 1)
                  path.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8')
          marker = 'const APP_SHELL=[\n'
          if text.count(marker) != 1:
              raise SystemExit('Unexpected service-worker APP_SHELL declaration')
          additions = []
          for asset in ('./shared/ui-density.js', './shared/ui-density.css'):
              quoted = f'  "{asset}",\n'
              if quoted not in text:
                  additions.append(quoted)
          if additions:
              text = text.replace(marker, marker + ''.join(additions), 1)
              sw.write_text(text, encoding='utf-8')
          PY
          python scripts/build_txt_bundle.py
          python tests/test_ui_density_contract.py
          python desktop/scripts/stage_web.py --check
      - name: Commit integrated density runtime
        shell: bash
        run: |
          git config user.name 'InkDOS automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js apps/documents/index.html apps/spreadsheets/index.html apps/presentations/index.html apps/pdf/index.html apps/epub/index.html apps/txt/page.template.html apps/txt/index.html
          if git diff --cached --quiet; then
            echo 'Density runtime already integrated.'
            exit 0
          fi
          git commit -m 'feat(ui): integrate adaptive density runtime'
          git push origin HEAD:feature/inkdos-2.3
