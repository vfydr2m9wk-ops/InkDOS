name: Bootstrap InkDOS 2.5 RUN38

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-run38-main.yml

permissions:
  contents: write

concurrency:
  group: inkdos-2.5-run38-bootstrap
  cancel-in-progress: false

jobs:
  import_validate_tag:
    name: Import, validate and tag RUN38
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require expected pre-bootstrap main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD^)" = "053a015977e4465d2c074f1c23ceba75c035a867" || {
            echo "main advanced unexpectedly before bootstrap; refusing stale RUN38 import." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "bootstrap checkout is not current main." >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin refs/tags/v2.5.0 >/dev/null 2>&1; then
            echo "Refusing to replace existing v2.5.0 tag." >&2
            exit 1
          fi

      - name: Fetch staged RUN38 transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/2.5.0-import-run38:refs/remotes/origin/release/2.5.0-import-run38
          mkdir -p /tmp/run38-transfer
          for n in 00 01 02 03; do
            git show "origin/release/2.5.0-import-run38:release-import/chunk4_${n}.b64" > "/tmp/run38-transfer/chunk4_${n}.b64"
          done
          cat /tmp/run38-transfer/chunk4_00.b64 /tmp/run38-transfer/chunk4_01.b64 /tmp/run38-transfer/chunk4_02.b64 /tmp/run38-transfer/chunk4_03.b64 | base64 -d > /tmp/InkDOS_2.5_RUN38_GITHUB_IMPORT.zip
          echo "67a323cdea42ad6c5a046261e1992ee0839493b03c0b0ecac5124efdaeaaa217  /tmp/InkDOS_2.5_RUN38_GITHUB_IMPORT.zip" | sha256sum -c -

      - name: Apply exact RUN38 repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inkdos-run38
          mkdir -p /tmp/inkdos-run38
          unzip -q /tmp/InkDOS_2.5_RUN38_GITHUB_IMPORT.zip -d /tmp/inkdos-run38
          test -f /tmp/inkdos-run38/VERSION.json
          test -f /tmp/inkdos-run38/config/release-authorization.json
          rsync -a --delete --exclude='.git/' /tmp/inkdos-run38/ ./

      - name: Verify 2.5.0 release identity and explicit Windows waiver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          version=json.loads(Path('VERSION.json').read_text(encoding='utf-8'))
          auth=json.loads(Path('config/release-authorization.json').read_text(encoding='utf-8'))
          assert version['version']=='2.5.0', version
          assert version['status']=='release', version
          assert auth['version']=='2.5.0', auth
          assert auth['windowsDeviceUpgradeValidated'] is False, auth
          assert auth['windowsDeviceUpgradeWaived'] is True, auth
          assert auth['explicitUserAuthorization'] is True, auth
          assert auth['evidence']=='' and auth['evidenceSha256']=='', auth
          assert str(auth['waiverReason']).strip(), auth
          print('InkDOS 2.5.0 identity and explicit pre-publication Windows waiver verified.')
          PY

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run exact imported repository test suite
        run: pytest -q

      - name: Run full release validation
        run: python scripts/run_release_validation.py

      - name: Commit exact validated RUN38 to main and tag v2.5.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE="$(git write-tree)"
          BASE="$(git rev-parse HEAD)"
          COMMIT="$(printf '%s\n' 'Release InkDOS 2.5.0 from validated RUN38 snapshot' | git commit-tree "$TREE" -p "$BASE")"
          git push origin "$COMMIT":refs/heads/main
          git tag -a v2.5.0 "$COMMIT" -m "InkDOS 2.5.0"
          git push origin refs/tags/v2.5.0
          echo "Published release source commit: $COMMIT"
