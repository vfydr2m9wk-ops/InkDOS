name: PPTX first-slide decode diagnostic

on:
  push:
    branches:
      - perf/pptx-first-slide-diagnostic

permissions:
  contents: read

jobs:
  webkit-first-slide-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install WebKit
        run: python -m playwright install --with-deps webkit
      - name: Measure per-slide decode path
        env:
          BROWSER: webkit
          INKDOS_PPTX_SLIDE_DIAG_OUT: artifacts/pptx-first-slide-diagnostic/webkit
        run: python scripts/diagnose_pptx_first_slide_wait.py
      - name: Preserve first-slide diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pptx-first-slide-diagnostic-webkit
          path: artifacts/pptx-first-slide-diagnostic/webkit/
          if-no-files-found: warn
          retention-days: 14
