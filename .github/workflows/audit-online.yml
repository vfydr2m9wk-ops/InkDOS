name: InkDOS online audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/visual-home-routes'

permissions:
  contents: read

jobs:
  visual-matrix:
    name: Visual matrix (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            click_sweep: '1'
          - browser: webkit
            click_sweep: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Audit published GitHub Pages
        env:
          INKDOS_ONLINE_BASE: https://vfydr2m9wk-ops.github.io/InkDOS/
          INKDOS_AUDIT_BROWSER: ${{ matrix.browser }}
          INKDOS_CLICK_SWEEP: ${{ matrix.click_sweep }}
          INKDOS_AUDIT_OUT: audit-online-${{ matrix.browser }}
        run: python tests/test_online_pages_visual_matrix_browser.py
      - name: Audit light/dark context surfaces and Home routes
        env:
          INKDOS_ONLINE_BASE: https://vfydr2m9wk-ops.github.io/InkDOS/
          INKDOS_AUDIT_BROWSER: ${{ matrix.browser }}
          INKDOS_SURFACE_OUT: audit-online-surfaces-${{ matrix.browser }}
        run: python tests/_audit_visual_surfaces_browser.py
      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkdos-online-visual-${{ matrix.browser }}
          path: |
            audit-online-${{ matrix.browser }}/
            audit-online-surfaces-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

  stateful-controls:
    name: Stateful controls
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Audit active control surfaces
        env:
          INKDOS_ONLINE_BASE: https://vfydr2m9wk-ops.github.io/InkDOS/
          INKDOS_STATEFUL_OUT: audit-stateful-controls
        run: python tests/test_online_stateful_control_surfaces_browser.py
      - name: Upload stateful audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkdos-online-stateful-controls
          path: audit-stateful-controls/
          if-no-files-found: warn
          retention-days: 14
