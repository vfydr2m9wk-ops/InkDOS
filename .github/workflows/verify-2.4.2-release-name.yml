name: Verify InkDOS 2.4.2 metadata fix

on:
  push:
    branches:
      - fix/2.4.2-release-name
    paths:
      - '.github/workflows/verify-2.4.2-release-name.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify 2.4.2 metadata consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
      - name: Run desktop UX contract
        run: python tests/test_desktop_ux_contract.py
      - name: Validate release metadata
        run: python desktop/scripts/release_version.py --check-config
