name: Recover CI and deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkdesk-ci-pages-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Restore workflows, checksums, and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RELEASE_PAT: ${{ secrets.INKDESK_RELEASE_PAT }}
      RECOVERY_REF: v0.19.2-beta
      ONE_SHOT_WORKFLOW: .github/workflows/recover-ci-and-deploy-pages.yml

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.INKDESK_RELEASE_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Confirm authorization and recovery source
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RELEASE_PAT" || {
            echo "Repository secret INKDESK_RELEASE_PAT is missing." >&2
            exit 1
          }

          git rev-parse --is-inside-work-tree >/dev/null

          test "$(git branch --show-current)" = "main" || {
            echo "The workflow must operate on the main branch." >&2
            exit 1
          }

          git rev-parse --verify "$RECOVERY_REF^{commit}" >/dev/null || {
            echo "Recovery ref was not found: $RECOVERY_REF" >&2
            exit 1
          }

          test -f "$ONE_SHOT_WORKFLOW" || {
            echo "The one-shot recovery workflow was not found." >&2
            exit 1
          }

      - name: Restore required workflows from release tag
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/workflows

          for name in \
            browser-regression.yml \
            pages.yml \
            prerelease.yml \
            quality-gate.yml
          do
            source_path=".github/workflows/$name"

            git cat-file -e "$RECOVERY_REF:$source_path" || {
              echo "Required workflow is missing from $RECOVERY_REF: $source_path" >&2
              exit 1
            }

            git show "$RECOVERY_REF:$source_path" > "$source_path"
            echo "Restored $source_path"
          done

          rm -f "$ONE_SHOT_WORKFLOW"

      - name: Stabilize temporary Git checkout cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_release_packaging.py")
          text = path.read_text(encoding="utf-8")

          old = "with tempfile.TemporaryDirectory() as temporary:"
          new = "with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as temporary:"

          occurrences = text.count(old)

          if occurrences:
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(
                  f"Updated {occurrences} TemporaryDirectory statement(s)."
              )
          elif new in text:
              print("Temporary-directory cleanup stabilization is already present.")
          else:
              raise SystemExit(
                  "Expected TemporaryDirectory statement was not found."
              )
          PY

      - name: Regenerate and verify checksums
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate_checksums.py
          python3 scripts/verify_checksums.py

      - name: Run full repository quality checks
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p "test_*.py"

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Commit recovery and trigger deployment
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository recovery changes were required."
          else
            git commit \
              -m "fix: restore CI workflows and redeploy Pages"

            git push origin HEAD:main
          fi

      - name: Report expected follow-up runs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "Recovery committed successfully."
          echo "The push should start:"
          echo "- InkDesk quality gate"
          echo "- Deploy GitHub Pages"
          echo "- Browser regression matrix"
          echo "This one-shot recovery workflow removes itself from main."
