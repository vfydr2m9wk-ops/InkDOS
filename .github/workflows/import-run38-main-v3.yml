name: Bootstrap InkDOS 2.5 RUN38 v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-run38-main-v3.yml

permissions:
  contents: write

concurrency:
  group: inkdos-2.5-run38-bootstrap-v3
  cancel-in-progress: false

jobs:
  import_validate_tag:
    name: Promote, release-validate and tag RUN38
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Require expected RUN38 base
        shell: bash
        run: |
          set -euo pipefail
          BASE="053a015977e4465d2c074f1c23ceba75c035a867"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^\.github/workflows/import-run38-main(-v[0-9]+)?\.yml$' || true)"
          test -z "$CHANGED" || { printf '%s\n' "$CHANGED" >&2; exit 1; }
          ! git ls-remote --exit-code --tags origin refs/tags/v2.5.0 >/dev/null 2>&1

      - name: Reconstruct verified RUN38 bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/2.5.0-import-run38:refs/remotes/origin/release/2.5.0-import-run38
          mkdir -p /tmp/run38-transfer /tmp/inkdos-run38
          for n in 00 01 02 03; do
            git show "origin/release/2.5.0-import-run38:release-import/chunk4_${n}.b64" > "/tmp/run38-transfer/chunk4_${n}.b64"
          done
          cat /tmp/run38-transfer/chunk4_00.b64 /tmp/run38-transfer/chunk4_01.b64 /tmp/run38-transfer/chunk4_02.b64 /tmp/run38-transfer/chunk4_03.b64 | base64 -d > /tmp/InkDOS_2.5_RUN38_GITHUB_IMPORT.zip
          echo "67a323cdea42ad6c5a046261e1992ee0839493b03c0b0ecac5124efdaeaaa217  /tmp/InkDOS_2.5_RUN38_GITHUB_IMPORT.zip" | sha256sum -c -
          unzip -q /tmp/InkDOS_2.5_RUN38_GITHUB_IMPORT.zip -d /tmp/inkdos-run38
          test -f /tmp/inkdos-run38/VERSION.json
          test -f /tmp/inkdos-run38/config/release-authorization.json
          rsync -a --delete --exclude='.git/' /tmp/inkdos-run38/ ./

      - name: Promote stable release metadata and verify waiver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('VERSION.json')
          v=json.loads(p.read_text(encoding='utf-8'))
          assert v['version']=='2.5.0' and v['releaseName']=='InkDOS 2.5.0', v
          v['releaseChannel']='stable'
          v['status']='release'
          v['date']='2026-09-22'
          p.write_text(json.dumps(v,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sw=Path('service-worker.js')
          s=sw.read_text(encoding='utf-8')
          assert 'inkdos-v2.5.0-local-1' in s
          sw.write_text(s.replace('inkdos-v2.5.0-local-1','inkdos-v2.5.0-1',1),encoding='utf-8')
          a=json.loads(Path('config/release-authorization.json').read_text(encoding='utf-8'))
          assert a['version']=='2.5.0'
          assert a['windowsDeviceUpgradeValidated'] is False
          assert a['windowsDeviceUpgradeWaived'] is True
          assert a['explicitUserAuthorization'] is True
          assert a['evidence']=='' and a['evidenceSha256']==''
          assert str(a['waiverReason']).strip()
          PY

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run complete repository release validation
        run: python scripts/run_release_validation.py

      - name: Publish source head and v2.5.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE="$(git write-tree)"
          BASE="$(git rev-parse HEAD)"
          COMMIT="$(printf '%s\n' 'Release InkDOS 2.5.0 from validated RUN38 snapshot' | git commit-tree "$TREE" -p "$BASE")"
          git push origin "$COMMIT":refs/heads/main
          git tag -a v2.5.0 "$COMMIT" -m "InkDOS 2.5.0"
          git push origin refs/tags/v2.5.0
