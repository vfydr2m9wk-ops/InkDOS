name: InkDOS exhaustive button audit

on:
  push:
    branches:
      - 'release/*-candidate'

permissions:
  contents: read

concurrency:
  group: inkdos-button-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaustive:
    name: Reachable buttons (${{ matrix.app }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [home, documents, spreadsheets, presentations, pdf, txt, epub]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - name: Audit every reachable button
        env:
          INKDOS_BUTTON_AUDIT_APP: ${{ matrix.app }}
          INKDOS_ONLINE_BASE: http://127.0.0.1:8768/
          INKDOS_BUTTON_AUDIT_OUT: artifacts/button-audit-${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8768 --bind 127.0.0.1 >/tmp/inkdos-button-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import socket,time
          deadline=time.time()+10
          while time.time()<deadline:
              with socket.socket() as s:
                  s.settimeout(.2)
                  if s.connect_ex(('127.0.0.1',8768))==0: break
              time.sleep(.1)
          else: raise SystemExit('button audit server did not start')
          PY
          python tests/test_exhaustive_button_audit_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-button-${{ matrix.app }}
          path: artifacts/button-audit-${{ matrix.app }}/
          if-no-files-found: warn
          retention-days: 14

  conditional:
    name: Conditional buttons (${{ matrix.app }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [documents, spreadsheets, presentations, pdf, txt, epub]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - name: Audit conditional buttons
        env:
          INKDOS_BUTTON_TARGET_APP: ${{ matrix.app }}
          INKDOS_ONLINE_BASE: http://127.0.0.1:8769/
          INKDOS_BUTTON_TARGET_OUT: artifacts/button-target-${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8769 --bind 127.0.0.1 >/tmp/inkdos-button-target-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import socket,time
          deadline=time.time()+10
          while time.time()<deadline:
              with socket.socket() as s:
                  s.settimeout(.2)
                  if s.connect_ex(('127.0.0.1',8769))==0: break
              time.sleep(.1)
          else: raise SystemExit('conditional button audit server did not start')
          PY
          python tests/test_conditional_button_audit_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-button-${{ matrix.app }}
          path: artifacts/button-target-${{ matrix.app }}/
          if-no-files-found: warn
          retention-days: 14

  help:
    name: Help buttons
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - env:
          BROWSER: chromium
        run: python tests/test_app_help_stability_browser.py

  presentations-diagnostic:
    name: Presentations button diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_presentations_button_diagnostic.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentations-button-diagnostic
          path: artifacts/presentations-button-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
