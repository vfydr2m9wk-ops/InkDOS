name: InkDOS integrity gate

# Read-only merge gate: PRs and main use the same complete repository validation.
# Workflow-only touch to verify bot-refreshed metadata on PR #139.
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'InkDOS-update-v*.zip'
      - 'InkDOS-update-v*.zip.sha256'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-integrity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          if command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"CHROMIUM_PATH={playwright.chromium.executable_path}")
          PY
          fi

      - name: Verify generated metadata is current
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_metadata.py
          git diff --exit-code -- BUILD_INFO.json SOURCE_MANIFEST.json RELEASE_MANIFEST.json

      - name: Verify CI process contract
        run: python tests/test_ci_flow_contract.py

      - name: Verify workflow trigger contract
        run: python tests/test_ci_trigger_contract.py

      - name: Run complete integrity gate
        run: python scripts/run_release_validation.py
