name: Plain Text stability regression

on:
  push:
    branches:
      - "audit/stability-functional-isolation"
    paths:
      - "apps/txt/**"
      - "tests/test_txt_stability_*.py"
      - "scripts/build_txt_bundle.py"
      - "service-worker.js"
      - ".github/workflows/txt-stability-regression.yml"
  pull_request:
    paths:
      - "apps/txt/**"
      - "tests/test_txt_stability_*.py"
      - "scripts/build_txt_bundle.py"
      - "service-worker.js"
      - ".github/workflows/txt-stability-regression.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python tests/test_txt_stability_contract.py

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/test_txt_stability_browser.py
