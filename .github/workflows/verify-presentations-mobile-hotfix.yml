name: Verify Presentations mobile WebKit hotfix
on:
  push:
    branches:
      - fix/2.5.2-presentations-mobile
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentations-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps webkit
      - name: Diagnostic release chunk 1 (0-9)
        continue-on-error: true
        run: python -c "import subprocess,sys; from scripts.run_release_validation import CMDS; [subprocess.run(c,check=True) for c in CMDS[0:10]]"
      - name: Diagnostic release chunk 2 (10-19)
        continue-on-error: true
        run: python -c "import subprocess,sys; from scripts.run_release_validation import CMDS; [subprocess.run(c,check=True) for c in CMDS[10:20]]"
      - name: Diagnostic release chunk 3 (20-29)
        continue-on-error: true
        run: python -c "import subprocess,sys; from scripts.run_release_validation import CMDS; [subprocess.run(c,check=True) for c in CMDS[20:30]]"
      - name: Diagnostic release chunk 4 (30-39)
        continue-on-error: true
        run: python -c "import subprocess,sys; from scripts.run_release_validation import CMDS; [subprocess.run(c,check=True) for c in CMDS[30:40]]"
      - name: Diagnostic release chunk 5 (40-49)
        continue-on-error: true
        run: python -c "import subprocess,sys; from scripts.run_release_validation import CMDS; [subprocess.run(c,check=True) for c in CMDS[40:50]]"
      - name: Diagnostic release chunk 6 (50-59)
        continue-on-error: true
        run: python -c "import subprocess,sys; from scripts.run_release_validation import CMDS; [subprocess.run(c,check=True) for c in CMDS[50:60]]"
      - name: Diagnostic 2.5.2 static contract
        continue-on-error: true
        run: python tests/test_presentations_252_webkit_zoom_contract.py
      - name: Diagnostic final version consistency
        continue-on-error: true
        run: python tests/test_243_final_version_consistency_harness.py
      - name: Diagnostic release authorization contract
        continue-on-error: true
        run: python tests/test_243_release_authorization_contract.py
      - name: Diagnostic repository validation
        continue-on-error: true
        run: python scripts/validate_repository.py
      - name: Diagnostic app isolation
        continue-on-error: true
        run: python scripts/validate_app_isolation.py
      - name: Diagnostic source audit
        continue-on-error: true
        run: python scripts/audit_source.py
      - name: Diagnostic suite contracts
        continue-on-error: true
        run: python scripts/validate_suite_contracts.py
      - name: Probe mobile canvas dimensions
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py dimensions
      - name: Probe mobile canvas intersection
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py intersection
      - name: Probe mobile thumbnail visibility
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py thumbs
      - name: Probe mobile painted surface
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py paint
      - name: Probe mobile page errors
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py pageerrors
      - name: Probe mobile console errors (diagnostic)
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py consoleerrors
