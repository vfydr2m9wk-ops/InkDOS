name: Verify Presentations mobile WebKit hotfix
on:
  push:
    branches:
      - fix/2.5.2-presentations-mobile
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentations-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps webkit
      - name: Probe mobile canvas dimensions
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py dimensions
      - name: Probe mobile canvas intersection
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py intersection
      - name: Probe mobile thumbnail visibility
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py thumbs
      - name: Probe mobile painted surface
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py paint
      - name: Probe mobile page errors
        continue-on-error: true
        run: python tests/test_presentations_mobile_webkit_visibility.py pageerrors
      - name: Probe mobile console errors
        run: python tests/test_presentations_mobile_webkit_visibility.py consoleerrors
