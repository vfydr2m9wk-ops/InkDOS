name: Verify Presentations mobile WebKit hotfix
on:
  push:
    branches:
      - fix/2.5.2-presentations-mobile
      - main
    paths:
      - 'apps/presentations/**'
      - 'tests/test_presentations_mobile_webkit_visibility.py'
      - '.github/workflows/verify-presentations-mobile-hotfix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/presentations/**'
      - 'tests/test_presentations_mobile_webkit_visibility.py'
      - '.github/workflows/verify-presentations-mobile-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentations-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps webkit
      - name: Verify iPhone/WebKit canvas dimensions
        run: python tests/test_presentations_mobile_webkit_visibility.py dimensions
      - name: Verify iPhone/WebKit canvas intersection
        run: python tests/test_presentations_mobile_webkit_visibility.py intersection
      - name: Verify iPhone/WebKit thumbnail strip
        run: python tests/test_presentations_mobile_webkit_visibility.py thumbs
      - name: Verify iPhone/WebKit painted surface
        run: python tests/test_presentations_mobile_webkit_visibility.py paint
      - name: Verify no WebKit page errors
        run: python tests/test_presentations_mobile_webkit_visibility.py pageerrors
