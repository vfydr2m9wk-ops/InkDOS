name: PPTX context cache diagnostic

on:
  push:
    branches:
      - perf/pptx-context-cache-diagnostic

permissions:
  contents: read

jobs:
  webkit-context-cache-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install WebKit
        run: python -m playwright install --with-deps webkit
      - name: Measure cached PPTX context work
        env:
          BROWSER: webkit
          INKDOS_PPTX_DIAG_ITERATIONS: "5"
          INKDOS_PPTX_DIAG_OUT: artifacts/pptx-context-cache-diagnostic/webkit
        run: python scripts/diagnose_pptx_context_repetition.py
      - name: Preserve PPTX context cache diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pptx-context-cache-diagnostic-webkit
          path: artifacts/pptx-context-cache-diagnostic/webkit/
          if-no-files-found: warn
          retention-days: 14
