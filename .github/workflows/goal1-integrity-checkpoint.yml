name: Goal 1 integrity checkpoint

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/goal1-integrity-trigger'

permissions:
  contents: read

concurrency:
  group: goal1-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.patch.outputs.base_sha }}
      changed: ${{ steps.patch.outputs.changed }}
      patch_b64: ${{ steps.patch.outputs.patch_b64 }}
      patch_sha256: ${{ steps.patch.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build generated entry points
        run: |
          python scripts/build_txt_bundle.py
          python scripts/generate_csp.py
      - name: Refresh integrated app locks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          lock_path=root/'SOURCE_LOCK.json'
          lock=json.loads(lock_path.read_text(encoding='utf-8'))
          version=json.loads((root/'VERSION.json').read_text(encoding='utf-8'))['version']
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def tree_digest(path, exclude=()):
              path=Path(path); excluded=set(exclude); digest=hashlib.sha256()
              for item in sorted(path.rglob('*')):
                  if not item.is_file(): continue
                  rel=item.relative_to(path).as_posix()
                  if rel in excluded: continue
                  rb=rel.encode(); digest.update(len(rb).to_bytes(4,'big')); digest.update(rb); digest.update(bytes.fromhex(sha(item)))
              return digest.hexdigest()
          lock['release']=version
          for app,entry in lock['apps'].items():
              app_root=root/'apps'/app
              entry['integratedIndexSha256']=sha(app_root/'index.html')
              entry['nonIndexTreeSha256']=tree_digest(app_root,exclude=('index.html',))
          lock_path.write_text(json.dumps(lock,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Refresh integrity metadata
        run: |
          python scripts/generate_release_metadata.py
          python scripts/generate_checksums.py
      - name: Validate refreshed snapshot
        run: python scripts/run_release_validation.py
      - name: Export immutable validated patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(index\.html|apps/(documents|spreadsheets|presentations|pdf|txt|epub)/index\.html|SOURCE_LOCK\.json|BUILD_INFO\.json|SOURCE_MANIFEST\.json|RELEASE_MANIFEST\.json|CHECKSUMS\.sha256)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            [[ "$path" =~ $allowed ]] || { echo "Unexpected generated path: $path" >&2; exit 1; }
          done < <(git diff --name-only)
          git diff --check
          git diff --binary -- index.html apps/documents/index.html apps/spreadsheets/index.html apps/presentations/index.html apps/pdf/index.html apps/txt/index.html apps/epub/index.html SOURCE_LOCK.json BUILD_INFO.json SOURCE_MANIFEST.json RELEASE_MANIFEST.json CHECKSUMS.sha256 > /tmp/goal1.patch
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          data=Path('/tmp/goal1.patch').read_bytes()
          print('base_sha='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('changed='+('true' if data else 'false'))
          print('patch_sha256='+hashlib.sha256(data).hexdigest())
          print('patch_b64='+base64.b64encode(gzip.compress(data,compresslevel=9,mtime=0)).decode())
          PY

  commit:
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - name: Verify branch and apply validated patch
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PATCH_B64: ${{ needs.prepare.outputs.patch_b64 }}
          PATCH_SHA256: ${{ needs.prepare.outputs.patch_sha256 }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          [[ "$(git rev-parse origin/$TARGET_BRANCH)" == "$BASE_SHA" ]] || { echo 'Branch changed after validation.' >&2; exit 1; }
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/goal1.patch
          [[ "$(sha256sum /tmp/goal1.patch | awk '{print $1}')" == "$PATCH_SHA256" ]] || { echo 'Patch hash mismatch.' >&2; exit 1; }
          git apply --check /tmp/goal1.patch
          git apply /tmp/goal1.patch
          git diff --check
      - name: Commit validated metadata
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps/documents/index.html apps/spreadsheets/index.html apps/presentations/index.html apps/pdf/index.html apps/txt/index.html apps/epub/index.html SOURCE_LOCK.json BUILD_INFO.json SOURCE_MANIFEST.json RELEASE_MANIFEST.json CHECKSUMS.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh InkDOS integrity metadata'
          git push origin "HEAD:$TARGET_BRANCH"
