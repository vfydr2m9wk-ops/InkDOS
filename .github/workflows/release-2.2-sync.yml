name: InkDOS 2.2 release sync

on:
  push:
    branches:
      - fix/release-2.2.0

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/release-2.2.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Synchronize manual 2.2.0 release surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace(path, old, new, count=-1):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('scripts/validate_repository.py', "if version!='2.1.0': raise SystemExit('Unexpected version')", "if version!='2.2.0': raise SystemExit('Unexpected version')", 1)
          replace('service-worker.js', "const CACHE_NAME='inkdos-v2.1.0-real-device-acceptance-1';", "const CACHE_NAME='inkdos-v2.2.0-desktop-stable-1';", 1)
          replace('desktop/src-tauri/Cargo.toml', 'version = "2.1.0"', 'version = "2.2.0"', 1)
          replace('desktop/src-tauri/tauri.conf.json', '"version": "2.1.0"', '"version": "2.2.0"', 1)

          index = root / 'index.html'
          index_text = index.read_text(encoding='utf-8')
          if '2.1.0' not in index_text:
              raise SystemExit('Expected 2.1.0 release markers missing from index.html')
          index.write_text(index_text.replace('2.1.0', '2.2.0'), encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8').replace('2.1.0', '2.2.0')
          old_intro = (
              'InkDOS is a local-first, static browser productivity suite with six physically independent workspaces behind an optional Home launcher. '
              'It runs entirely client-side, requires no application backend or telemetry service, and keeps document processing in the browser.\n\n'
              'Version 2.2.0 is the post-hardening release that consolidates the stability work performed after the 2.0.12 structural baseline. '
              'The current development focus is real-device acceptance: automated repository, format-preservation and browser regressions are part of the release gate, '
              'while host-specific behavior on iPad/XeOS still requires direct user confirmation where synthetic browsers cannot prove the full file-delivery or WebKit-host interaction path.\n'
          )
          new_intro = (
              'InkDOS is a local-first productivity suite with six physically independent workspaces behind an optional Home launcher. '
              'The same client-side HTML/CSS/JavaScript application is distributed as a web/PWA edition and as installable Tauri desktop editions, with no application backend or telemetry service.\n\n'
              'Version 2.2.0 promotes the unified web/PWA + desktop distribution to the stable release line. '
              'The Windows desktop path has been manually installed and confirmed working, while automated repository, format-preservation, browser and native packaging gates remain part of the release process.\n'
          )
          if old_intro not in text:
              raise SystemExit('README current-release intro did not match expected 2.2.0 text')
          text = text.replace(old_intro, new_intro, 1)
          marker = '## Workspaces and format behavior\n'
          desktop_section = (
              '## Desktop edition\n\n'
              'The desktop edition uses Tauri v2 as a thin native host around the existing InkDOS workspaces. '
              'It uses native open/save dialogs and filesystem access where the desktop bridge is available, while preserving the browser/PWA fallback paths. '
              'Windows installation has been confirmed on a real machine for the 2.2.0 release line; macOS and Linux installers remain produced and validated by native CI runners.\n\n'
          )
          if marker not in text:
              raise SystemExit('README workspace marker missing')
          text = text.replace(marker, desktop_section + marker, 1)
          readme.write_text(text, encoding='utf-8')

          status = root / 'docs/PROJECT_STATUS.md'
          text = status.read_text(encoding='utf-8').replace('2.1.0', '2.2.0')
          text = text.replace('Status: **post-hardening release; real-device acceptance in progress**.', 'Status: **stable unified web/PWA + desktop release; real-device acceptance continues**.', 1)
          marker = 'InkDOS 2.2.0 consolidates the stability and compatibility work performed after the 2.0.12 structural release. The active release identity is defined by `VERSION.json`; generated build/source/release manifests are expected to match it.\n'
          addition = marker + '\nThe 2.2.0 line adds the installable Tauri desktop distribution to the public release identity without replacing the browser/PWA edition or rewriting workspace engines. The Windows installer has been manually installed and confirmed working; Windows, macOS and Linux packaging are also exercised by native CI runners.\n'
          if marker not in text:
              raise SystemExit('PROJECT_STATUS current-release paragraph missing')
          text = text.replace(marker, addition, 1)
          status.write_text(text, encoding='utf-8')

          limits = root / 'docs/KNOWN_LIMITATIONS.md'
          text = limits.read_text(encoding='utf-8').replace('InkDOS 2.1.0', 'InkDOS 2.2.0', 1)
          general_marker = '## General\n\n'
          desktop_limit = (
              '- InkDOS 2.2.0 includes an installable Tauri desktop host. Windows installation has been manually confirmed; macOS/Linux packages are built on native CI runners, but that CI result is not a claim of manual acceptance on every desktop distribution or OS configuration.\n'
              '- The desktop host uses the operating system WebView rather than a custom rendering engine. Memory usage therefore includes the platform WebView/runtime in addition to InkDOS application code.\n'
          )
          if general_marker not in text:
              raise SystemExit('KNOWN_LIMITATIONS General marker missing')
          text = text.replace(general_marker, general_marker + desktop_limit, 1)
          limits.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          if '## 2.2.0 — 2026-09-12' not in text:
              entry = (
                  '## 2.2.0 — 2026-09-12\n\n'
                  '- Promote the unified InkDOS web/PWA and Tauri desktop distribution to the stable 2.2.0 release identity.\n'
                  '- Confirm the installable Windows desktop path on a real machine while retaining native CI packaging for Windows, macOS and Linux.\n'
                  '- Keep the existing client-side workspace engines unchanged; Tauri remains a thin native host that provides desktop open/save dialogs, filesystem delivery and OS integration.\n'
                  '- Synchronize Home cache-busting routes, offline cache identity, release manifests, source locks, desktop package metadata and repository checksums to 2.2.0.\n'
                  '- Preserve the existing browser/PWA edition and all release-validation contracts, including Chromium, Firefox, WebKit and format-preservation regressions.\n\n'
              )
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          lock_path = root / 'SOURCE_LOCK.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['release'] = '2.2.0'
          lock['previousRelease'] = '2.1.0'
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary synchronization workflow
        run: rm .github/workflows/release-2.2-sync.yml

      - name: Refresh deterministic entry points and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_txt_bundle.py
          python scripts/generate_csp.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          lock_path = root / 'SOURCE_LOCK.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          version = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))['version']
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def tree_digest(path, exclude=()):
              path = Path(path); excluded = set(exclude); digest = hashlib.sha256()
              for item in sorted(path.rglob('*')):
                  if not item.is_file(): continue
                  rel = item.relative_to(path).as_posix()
                  if rel in excluded: continue
                  rb = rel.encode(); digest.update(len(rb).to_bytes(4, 'big')); digest.update(rb); digest.update(bytes.fromhex(sha(item)))
              return digest.hexdigest()
          lock['release'] = version
          for app, entry in lock['apps'].items():
              app_root = root / 'apps' / app
              entry['integratedIndexSha256'] = sha(app_root / 'index.html')
              entry['nonIndexTreeSha256'] = tree_digest(app_root, exclude=('index.html',))
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python scripts/generate_release_metadata.py
          python scripts/generate_checksums.py

      - name: Validate 2.2.0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          python desktop/scripts/release_version.py --check-config
          python tests/test_tauri_desktop_contract.py
          python scripts/run_release_validation.py
          git diff --check

      - name: Commit synchronized release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: synchronize InkDOS 2.2.0 metadata'
          git push origin HEAD:fix/release-2.2.0
