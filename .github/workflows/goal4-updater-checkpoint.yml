name: Goal 4 updater checkpoint

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'tests/test_goal4_*.py'
      - 'desktop/desktop-host.js'
      - 'desktop/src-tauri/Cargo.toml'
      - 'desktop/src-tauri/src/main.rs'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/scripts/build_updater_manifest.py'
      - 'desktop/scripts/prepare_updater_release_config.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/goal4-updater-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal4-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Run Goal 4 updater contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_goal4_*contract.py; do
            echo "==> $test"
            python "$test"
          done
      - name: Check desktop bridge syntax
        run: node --check desktop/desktop-host.js

  browser-ui:
    name: Manual updater UI (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install browser test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify manual-only updater UI
        env:
          BROWSER: ${{ matrix.browser }}
        run: python tests/test_goal4_updater_ui_browser.py

  cargo-check:
    name: Goal 4 Tauri compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py
      - name: Check Tauri updater host
        working-directory: desktop/src-tauri
        run: cargo check --locked
