name: Goal 4 updater checkpoint

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'tests/test_goal4_*.py'
      - 'desktop/desktop-host.js'
      - 'desktop/src-tauri/Cargo.toml'
      - 'desktop/src-tauri/src/main.rs'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/scripts/build_updater_manifest.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/goal4-updater-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal4-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Run Goal 4 manual updater contract
        run: python tests/test_goal4_desktop_updater_contract.py
