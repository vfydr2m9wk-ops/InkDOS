name: Publish clean InkDOS v2.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v2.3.0-tag.yml'

permissions:
  actions: write
  contents: write

jobs:
  publish:
    name: Point v2.3.0 to clean release commit and dispatch publisher
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Move v2.3.0 to clean validated release commit
        shell: bash
        env:
          RELEASE_SHA: c8fb35e9a1d9d813b9b9b8db3b27aea9977415dd
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          test "$(git show "$RELEASE_SHA:VERSION.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.3.0"
          git tag -f v2.3.0 "$RELEASE_SHA"
          git push --force origin refs/tags/v2.3.0
      - name: Dispatch official release publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f 'inputs[release_tag]=v2.3.0'
          echo "Dispatched official InkDOS v2.3.0 release publisher."
