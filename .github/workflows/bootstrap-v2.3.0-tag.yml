name: Publish validated InkDOS v2.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v2.3.0-tag.yml'

permissions:
  actions: write
  contents: write

jobs:
  publish:
    name: Retag validated commit and dispatch release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Move v2.3.0 to validated release commit
        shell: bash
        env:
          RELEASE_SHA: ba39b205fb3bed62af055bba9c196c6c5c99bdec
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD^)" = "$RELEASE_SHA"
          test "$(git show "$RELEASE_SHA:VERSION.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.3.0"
          git tag -f v2.3.0 "$RELEASE_SHA"
          git push --force origin refs/tags/v2.3.0
      - name: Dispatch official release publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f 'inputs[release_tag]=v2.3.0'
          echo "Dispatched official InkDOS v2.3.0 release publisher."
