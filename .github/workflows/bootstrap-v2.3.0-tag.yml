name: Dispatch InkDOS v2.3.0 integrity refresh

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v2.3.0-tag.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch final integrity refresh
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch refresh on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-integrity-metadata.yml/dispatches" \
            -f ref=main
          echo "Dispatched final InkDOS 2.3.0 integrity refresh."
