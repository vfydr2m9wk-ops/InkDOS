name: Goal 2 progress checkpoint

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-progress-checkpoint.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Record Goal 2 targeted-fidelity checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/INKDOS-2.3-IMPLEMENTATION-CHECKPOINT.md')
          text=path.read_text(encoding='utf-8')
          text=text.replace('- Open development PR: #132, `InkDOS 2.3 Goal 1 — format expansion`','- Open development PR: #132, `InkDOS 2.3 — Goal 2 PPTX fidelity`')
          text=text.replace('2. Goal 2 — PPTX/PowerPoint fidelity: **READY — NOT STARTED**','2. Goal 2 — PPTX/PowerPoint fidelity: **IN PROGRESS — TARGETED REAL-REGRESSION GREEN**')
          text=text.replace('- Goal 2: **READY — NOT STARTED**.','- Goal 2: **IN PROGRESS — TARGETED REAL-REGRESSION GREEN**.')
          text=text.replace('Proceed to Goal 2 only: diagnose and fix PPTX/PowerPoint fidelity using the supplied real regression first, then focused synthetic regression tests. Use systematic debugging to isolate fidelity root causes and TDD for every production change. Do not begin Goal 3 until Goal 2 has its own verified checkpoint.','Continue Goal 2 only: run the coherent cross-browser/repository checkpoint validation with the retained real-title, character-spacing, normAutofit, background, and preservation regressions. Do not begin Goal 3 until Goal 2 is COMPLETE — VERIFIED.')
          section='''\n\n## Goal 2 targeted fidelity checkpoint — 2026-09-13\n\nThe supplied real regression `5 Anticonvulsivantes_e_antipsic_ticos_bipolares.pptx` was inspected directly before the final synthetic fixture was frozen. Slide 1 uses the title `Anticonvulsi\u00advantes & antipsicóticos` as three Arial Bold 112.5 pt runs, each with `spc=-337`, 92% paragraph line spacing, 2 pt text insets, the original soft hyphen, and a bare `normAutofit` element.\n\nSystematic debugging isolated a concrete importer defect: a bare `normAutofit` has no `fontScale` attribute, but `Number(null)` made the importer clamp the missing value to 0.35. This incorrectly scaled 112.5 pt title text and -3.37 tracking to 35% size.\n\n- RED isolated at head `22b473f574c7c34912ba8475fce9c7b67cf5d7a3`: `tests/test_pptx_norm_autofit_default_scale_browser.py` observed `autoFitScale=0.35` and rendered letter spacing `-1.1795px`.\n- Minimal production fix: `41b58c439a41cab9345e192ac82b05c8778f773d`, defaulting a missing `normAutofit@fontScale` to 1 while retaining explicit PowerPoint scale values.\n- Fix verification run: GitHub Actions `34746864039` — PASS for the isolated normAutofit regression, existing character-spacing regression, slide-background regression, and importer syntax.\n- Final real-title synthetic regression: `tests/test_pptx_real_title_fidelity_browser.py`, frozen from the actual slide 1 XML metrics rather than an approximate title.\n- Exact real-title verification run: GitHub Actions `34747079211` — PASS. The imported title retains three runs, U+00AD soft hyphen, `spc=-337` / `-3.37px` tracking, 92% line spacing, scale 1, and the expected two-line geometry. The same run also passed the isolated normAutofit, character-spacing, and slide-background regressions.\n- Superseded diagnostic fixtures and one-shot workflows were removed in `df809a3320f749c46b2acbd6cb9bc92ae7454791`.\n\nGoal 2 is not yet declared complete. The remaining gate is the coherent Goal-sized cross-browser/repository validation required by the approved cadence, followed by checkpoint review. Goal 3 remains untouched.\n'''
          if '## Goal 2 targeted fidelity checkpoint — 2026-09-13' not in text:
              text += section
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit checkpoint and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/inkdos-2.3
          test "$(git rev-parse origin/feature/inkdos-2.3)" = "${GITHUB_SHA}" || { echo 'Branch advanced during checkpoint run' >&2; exit 1; }
          git rm .github/workflows/goal2-progress-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/INKDOS-2.3-IMPLEMENTATION-CHECKPOINT.md
          git commit -m 'docs: checkpoint Goal 2 real-regression fidelity'
          git push origin HEAD:feature/inkdos-2.3
