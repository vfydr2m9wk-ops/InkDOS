name: First-slide preview A-B

on:
  push:
    branches:
      - perf/first-slide-ab-baseline
      - perf/first-slide-ab-candidate

permissions:
  contents: read

jobs:
  measure:
    name: First-slide A-B (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Measure first-slide pipeline
        env:
          BROWSER: ${{ matrix.browser }}
          INKDOS_AB_VARIANT: ${{ github.ref_name }}
          INKDOS_PRODUCT_COMMIT: ${{ github.event.before }}
          INKDOS_FIRST_SLIDE_AB_OUT: artifacts/first-slide-ab/${{ matrix.browser }}
        run: python scripts/benchmark_first_slide_preview.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-slide-ab-${{ matrix.browser }}
          path: artifacts/first-slide-ab/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
