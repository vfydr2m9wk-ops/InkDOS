name: InkDOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-validation:
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'perf/xeros-exp-') && github.head_ref != 'perf/xeros-optimization-workbench') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Enforce product/release change boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/check_change_boundaries.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
      - name: Run Documents interaction regression
        run: python tests/test_documents_243_interaction_browser.py
      - name: Run Home Windows-scale layout harness
        run: python tests/test_home_density_layout_browser.py
      - name: Run workspace-local settings regression
        run: python tests/test_localization_settings_browser.py
      - name: Run workspace-local density regression
        run: python tests/test_ui_density_stability_browser.py
      - name: Run workspace-local appearance regression
        run: python tests/test_workspace_appearance_isolation_browser.py
      - name: Run launchQueue file routing regression
        run: python tests/test_web_file_launch_browser.py
      - name: Run Spreadsheets fill/clear regression
        run: python tests/test_spreadsheets_243_fill_clear_browser.py
      - name: Run Plain Text multi-instance recovery isolation
        run: python tests/test_txt_multi_instance_recovery_browser.py
      - name: Run Presentations color-control hitbox regression
        run: python tests/test_presentations_disabled_background_hitbox_browser.py
      - name: Run PPTX security and single-read regression
        env:
          BROWSER: chromium
        run: python tests/test_pptx_security_browser.py
      - name: Run PDF toolbar hitbox regression
        run: python tests/test_pdf_toolbar_hitbox_browser.py
      - name: Run behavioral stability gate
        env:
          BROWSER: chromium
          INKDOS_STATEFUL_CYCLES: "3"
        run: python scripts/run_behavioral_stability_validation.py
      - name: Upload behavioral stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-stability-report
          path: artifacts/behavioral-stability/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check

  candidate-distribution:
    name: Candidate distribution (${{ matrix.browser }})
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'perf/xeros-exp-') && github.head_ref != 'perf/xeros-optimization-workbench'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Audit exact candidate without deployment
        env:
          INKDOS_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          INKDOS_AUDIT_BROWSER: ${{ matrix.browser }}
          INKDOS_CLICK_SWEEP: ${{ matrix.browser == 'chromium' && '1' || '0' }}
        run: python scripts/run_candidate_audit.py
      - name: Benchmark numeric and visual workspace performance
        continue-on-error: true
        env:
          BROWSER: ${{ matrix.browser }}
          INKDOS_PERF_ITERATIONS: "3"
          INKDOS_PERF_VISUAL: "1"
          INKDOS_PERF_OUT: artifacts/performance/${{ matrix.browser }}
        run: python scripts/benchmark_workspace_performance.py
      - name: Preserve performance benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-${{ matrix.browser }}
          path: artifacts/performance/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve candidate audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-distribution-${{ matrix.browser }}
          path: artifacts/candidate-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14


  performance-lab-quick:
    name: Performance lab quick WebKit gate
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'perf/xeros-exp-') || github.head_ref == 'perf/xeros-optimization-workbench')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install WebKit
        run: python -m playwright install --with-deps webkit
      - name: Run changed-component tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          ran=0
          for component in presentations pdf documents spreadsheets epub txt; do
            case "$component" in
              presentations) prefix='apps/presentations/' ;;
              pdf) prefix='apps/pdf/' ;;
              documents) prefix='apps/documents/' ;;
              spreadsheets) prefix='apps/spreadsheets/' ;;
              epub) prefix='apps/epub/' ;;
              txt) prefix='apps/txt/' ;;
            esac
            if grep -q "^$prefix" /tmp/changed.txt; then
              python scripts/agent_test.py "$component"
              ran=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "No product component changed; focused component tests skipped."
          fi
      - name: Benchmark quick WebKit numeric and visual evidence
        env:
          BROWSER: webkit
          INKDOS_PERF_ITERATIONS: "2"
          INKDOS_PERF_VISUAL: "1"
          INKDOS_PERF_OUT: artifacts/performance-lab-quick/webkit
        run: python scripts/benchmark_workspace_performance.py
      - name: Preserve quick performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-lab-quick-webkit
          path: artifacts/performance-lab-quick/webkit/
          if-no-files-found: warn
          retention-days: 7
