name: InkDOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Enforce product/release change boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/check_change_boundaries.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD
      - name: Run clean-snapshot release validation
        run: python scripts/run_release_validation.py
      - name: Run Documents interaction regression
        run: python tests/test_documents_243_interaction_browser.py
      - name: Run Home Windows-scale layout harness
        run: python tests/test_home_density_layout_browser.py
      - name: Run Spreadsheets fill/clear regression
        run: python tests/test_spreadsheets_243_fill_clear_browser.py
      - name: Run Plain Text multi-instance recovery isolation
        run: python tests/test_txt_multi_instance_recovery_browser.py
      - name: Run Presentations color-control hitbox regression
        run: python tests/test_presentations_disabled_background_hitbox_browser.py
      - name: Run PDF toolbar hitbox regression
        run: python tests/test_pdf_toolbar_hitbox_browser.py
      - name: Run behavioral stability gate
        env:
          BROWSER: chromium
          INKDOS_STATEFUL_CYCLES: "3"
        run: python scripts/run_behavioral_stability_validation.py
      - name: Upload behavioral stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-stability-report
          path: artifacts/behavioral-stability/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check

  cleanup-actions-history:
    name: One-shot Actions history cleanup
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[actions-cleanup]') }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete low-value legacy workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          RELEASE_WORKFLOW_ID: "356719870"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          current_sha = os.environ["CURRENT_SHA"]
          release_workflow = int(os.environ["RELEASE_WORKFLOW_ID"])
          api = f"https://api.github.com/repos/{repo}"

          def request(url, method="GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "inkdos-actions-history-cleanup",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          runs = []
          page = 1
          while True:
              data = request(f"{api}/actions/runs?per_page=100&page={page}")
              batch = data.get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          keep = []
          delete = []
          for run in runs:
              rid = int(run["id"])
              workflow_id = int(run["workflow_id"])
              conclusion = run.get("conclusion")
              status = run.get("status")
              head_sha = run.get("head_sha")

              reason = None
              if rid == current_run:
                  reason = "current cleanup run"
              elif status != "completed":
                  reason = "still active"
              elif head_sha == current_sha:
                  reason = "current main commit"
              elif workflow_id == release_workflow and conclusion == "success":
                  reason = "successful published release"

              if reason:
                  keep.append((rid, run.get("name"), run.get("run_number"), reason))
              else:
                  delete.append((rid, run.get("name"), run.get("run_number"), conclusion))

          failures = []
          for index, (rid, name, number, conclusion) in enumerate(delete, 1):
              try:
                  request(f"{api}/actions/runs/{rid}", method="DELETE")
                  print(f"DELETE {rid} | {name} #{number} | {conclusion}")
              except urllib.error.HTTPError as exc:
                  failures.append((rid, exc.code, exc.read().decode("utf-8", "replace")[:500]))
                  print(f"FAILED {rid}: HTTP {exc.code}")
              if index % 50 == 0:
                  time.sleep(0.2)

          print(f"Runs discovered: {len(runs)}")
          print(f"Runs retained: {len(keep)}")
          print(f"Runs requested for deletion: {len(delete)}")
          for rid, name, number, reason in keep:
              print(f"KEEP {rid} | {name} #{number} | {reason}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Actions history cleanup\n\n")
                  fh.write(f"- discovered: {len(runs)}\n")
                  fh.write(f"- retained: {len(keep)}\n")
                  fh.write(f"- deletion attempts: {len(delete)}\n")
                  fh.write(f"- deletion failures: {len(failures)}\n")

          if failures:
              raise SystemExit(f"Actions cleanup had {len(failures)} deletion failures: {failures[:5]}")
          PY

