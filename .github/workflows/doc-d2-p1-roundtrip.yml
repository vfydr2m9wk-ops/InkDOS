name: DOC-D2 P1 browser roundtrip

on:
  push:
    branches:
      - 'feature/doc-d2-*'
    paths:
      - 'apps/documents/**'
      - 'tests/test_doc_d2_p1_roundtrip.py'
      - 'tests/test_doc_d2_sections_roundtrip.py'
      - 'tests/test_doc_d2_rtf_roundtrip.py'
      - 'requirements-ci.txt'
      - '.github/workflows/doc-d2-p1-roundtrip.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/documents/**'
      - 'tests/test_doc_d2_p1_roundtrip.py'
      - 'tests/test_doc_d2_sections_roundtrip.py'
      - 'tests/test_doc_d2_rtf_roundtrip.py'
      - 'requirements-ci.txt'
      - '.github/workflows/doc-d2-p1-roundtrip.yml'

permissions:
  contents: read

concurrency:
  group: doc-d2-p1-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Run DOC-D2 review roundtrip
        run: python tests/test_doc_d2_p1_roundtrip.py
      - name: Run DOC-D2 section roundtrip
        run: python tests/test_doc_d2_sections_roundtrip.py
      - name: Run DOC-D2 RTF import roundtrip
        run: python tests/test_doc_d2_rtf_roundtrip.py
