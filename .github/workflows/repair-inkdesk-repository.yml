name: Repair InkDesk repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail

          test -f InkDesk-source.zip
          rm -rf "$RUNNER_TEMP/inkdesk-source"
          mkdir -p "$RUNNER_TEMP/inkdesk-source"
          unzip -q InkDesk-source.zip -d "$RUNNER_TEMP/inkdesk-source"

          echo "SOURCE_DIR=$RUNNER_TEMP/inkdesk-source" >> "$GITHUB_ENV"

      - name: Apply repository corrections
        shell: bash
        run: |
          set -euo pipefail

          cp "$SOURCE_DIR/README.md" README.md
          cp "$SOURCE_DIR/.editorconfig" .editorconfig
          cp "$SOURCE_DIR/.gitignore" .gitignore
          cp "$SOURCE_DIR/.nojekyll" .nojekyll

          rm -rf tests/compatibility-fixtures
          mkdir -p tests/compatibility-fixtures
          cp -R "$SOURCE_DIR/tests/compatibility-fixtures/." tests/compatibility-fixtures/

          find . \
            -path './.git' -prune -o \
            -type f -name '.gitkeep' -print -delete

          python3 scripts/generate_checksums.py

      - name: Validate corrected repository
        shell: bash
        run: |
          set -euo pipefail

          test -d tests/compatibility-fixtures/documents
          test -d tests/compatibility-fixtures/spreadsheets
          test -d tests/compatibility-fixtures/presentations

          if find . \
            -path './.git' -prune -o \
            -type f -name '.gitkeep' -print -quit | grep -q .; then
            echo "A .gitkeep file still exists." >&2
            exit 1
          fi

          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify_checksums.py

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows

          if git diff --cached --quiet; then
            echo "No repository corrections are required."
            exit 0
          fi

          git diff --cached --name-status
          git commit -m "Repair fixtures, README, and placeholders"
          git push origin HEAD:main
