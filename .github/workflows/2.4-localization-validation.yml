name: InkDOS 2.4 localization validation

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'service-worker.js'
      - 'tests/test_localization_settings_*.py'
      - 'tests/test_ui_density_*.py'
      - '.github/workflows/2.4-localization-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Localization and isolation contracts
        run: |
          python tests/test_localization_settings_contract.py
          python tests/test_ui_density_contract.py
          python tests/test_app_isolation_shared_density_contract.py
          python scripts/validate_app_isolation.py

  browser:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Localization/settings browser regression
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python tests/test_localization_settings_browser.py
          python tests/test_ui_density_stability_browser.py
