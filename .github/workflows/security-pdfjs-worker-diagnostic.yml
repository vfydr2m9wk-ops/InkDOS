name: Security PDF.js worker diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - audit/stability-functional-isolation
    paths:
      - scripts/security_analyze_pdfjs_worker.py
      - .github/workflows/security-pdfjs-worker-diagnostic.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Compare vendored worker with verified upstream
        run: python scripts/security_analyze_pdfjs_worker.py
