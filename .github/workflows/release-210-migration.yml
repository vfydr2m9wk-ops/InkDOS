name: Temporary InkDOS 2.1.0 release migration

on:
  push:
    branches:
      - feature/release-2.1.0-docs
    paths:
      - .github/workflows/release-210-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/release-2.1.0-docs
          fetch-depth: 0

      - name: Update release-aware validators and offline cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected migration marker missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'service-worker.js',
              "const CACHE_NAME='inkdos-v2.0.12-stability-remediation-1';",
              "const CACHE_NAME='inkdos-v2.1.0-real-device-acceptance-1';",
          )

          replace(
              'scripts/validate_repository.py',
              "v=json.loads((ROOT/'VERSION.json').read_text()); state=json.loads((ROOT/'DEVELOPMENT_STATE.json').read_text()); lock=json.loads((ROOT/'SOURCE_LOCK.json').read_text()); stability=stability_changes(); frozen=frozen_stability()\n    if v.get('version')!='2.0.12': raise SystemExit('Unexpected version')",
              "v=json.loads((ROOT/'VERSION.json').read_text()); state=json.loads((ROOT/'DEVELOPMENT_STATE.json').read_text()); lock=json.loads((ROOT/'SOURCE_LOCK.json').read_text()); stability=stability_changes(); frozen=frozen_stability()\n    version=v.get('version')\n    if version!='2.1.0': raise SystemExit('Unexpected version')",
          )
          replace(
              'scripts/validate_repository.py',
              "if f'./apps/{app}/index.html?v=2.0.12&amp;suite=1' not in home",
              "if f'./apps/{app}/index.html?v={version}&amp;suite=1' not in home",
          )
          replace(
              'scripts/validate_repository.py',
              "    sw=(ROOT/'service-worker.js').read_text(encoding='utf-8')\n    if stability or frozen:\n        if not re.search(r\"const CACHE_NAME=['\\\"]inkdos-v2\\.0\\.12-stability-[^'\\\"]+['\\\"]\",sw): raise SystemExit('Stability offline cache rotation missing')\n    elif \"inkdos-v2.0.12-modularity-epub-polish-seq80\" not in sw:\n        raise SystemExit('2.0.12 offline cache rotation missing')",
              "    sw=(ROOT/'service-worker.js').read_text(encoding='utf-8')\n    if not re.search(rf\"const CACHE_NAME=['\\\"]inkdos-v{re.escape(version)}-[^'\\\"]+['\\\"]\",sw):\n        raise SystemExit(f'{version} offline cache rotation missing')",
          )

          replace(
              'scripts/validate_app_isolation.py',
              "ACTIVE=('documents','spreadsheets','presentations','txt','epub','pdf')\nTEXT_SUFFIXES=",
              "ACTIVE=('documents','spreadsheets','presentations','txt','epub','pdf')\nVERSION=json.loads((ROOT/'VERSION.json').read_text(encoding='utf-8'))['version']\nTEXT_SUFFIXES=",
          )
          replace(
              'scripts/validate_app_isolation.py',
              "expected=f'./apps/{app}/index.html?v=2.0.12&amp;suite=1'",
              "expected=f'./apps/{app}/index.html?v={VERSION}&amp;suite=1'",
          )
          replace(
              'scripts/validate_app_isolation.py',
              "if lock.get('release')!='2.0.12':errors.append('SOURCE_LOCK: release must be 2.0.12')",
              "if lock.get('release')!=VERSION:errors.append(f'SOURCE_LOCK: release must match VERSION.json ({VERSION})')",
          )
          replace(
              'scripts/validate_app_isolation.py',
              "if marker not in policy:errors.append(f'SOURCE_LOCK: 2.0.12 integration policy missing {marker}')",
              "if marker not in policy:errors.append(f'SOURCE_LOCK: integration policy missing {marker}')",
          )
          replace(
              'scripts/validate_app_isolation.py',
              "if '2.0.12' not in allowed or 'Home' not in allowed:\n            errors.append(f'SOURCE_LOCK: optional Home change not recorded for {app}')",
              "if 'Home' not in allowed:\n            errors.append(f'SOURCE_LOCK: optional Home change not recorded for {app}')",
          )

          replace(
              'scripts/validate_suite_contracts.py',
              "ACTIVE=('documents','spreadsheets','presentations','txt','epub','pdf')\nclass SuiteIntegration",
              "ACTIVE=('documents','spreadsheets','presentations','txt','epub','pdf')\nVERSION=json.loads((ROOT/'VERSION.json').read_text(encoding='utf-8'))['version']\nclass SuiteIntegration",
          )
          replace(
              'scripts/validate_suite_contracts.py',
              "self.assertIn(f'./apps/{app}/index.html?v=2.0.12&amp;suite=1',text)",
              "self.assertIn(f'./apps/{app}/index.html?v={VERSION}&amp;suite=1',text)",
          )
          replace(
              'scripts/validate_suite_contracts.py',
              "self.assertIn('./apps/presentations/index.html?v=2.0.12&amp;suite=1',home)",
              "self.assertIn(f'./apps/presentations/index.html?v={VERSION}&amp;suite=1',home)",
          )
          PY
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js scripts/validate_repository.py scripts/validate_app_isolation.py scripts/validate_suite_contracts.py
          git commit -m "release: align validators and offline cache with 2.1.0"
          git push origin HEAD:feature/release-2.1.0-docs
