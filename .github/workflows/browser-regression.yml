name: Browser regression matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright ${{ matrix.browser }} / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        group: [package-security, lifecycle, isolation-offline, documents-presentations, spreadsheets]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright engine
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Run browser regressions
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          CHROMIUM_PATH: ""
        run: python3 scripts/run_browser_regressions.py --group "${{ matrix.group }}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.group }}-${{ github.sha }}
          path: tests/browser/results/
          if-no-files-found: error
          retention-days: 30
