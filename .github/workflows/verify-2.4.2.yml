# candidate all-workspace-help-green
name: Verify InkDOS 2.4.2 localization

on:
  push:
    branches:
      - release/2.4.2-localization-completeness
    paths:
      - '.github/workflows/verify-2.4.2.yml'
      - 'tests/test_localization_completeness_contract.py'

permissions:
  contents: read

jobs:
  localization-red-green:
    name: Localization completeness contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run 2.4.2 localization contract
        run: python tests/test_localization_completeness_contract.py
