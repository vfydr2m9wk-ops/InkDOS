name: Regenerate InkDOS 2.4.2 Plain Text bundle

on:
  push:
    branches:
      - release/2.4.2-localization-completeness
    paths:
      - '.github/workflows/verify-2.4.2.yml'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate deterministic TXT bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          ref: release/2.4.2-localization-completeness
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Regenerate canonical Plain Text bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_txt_bundle.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/txt/index.html
          git diff --cached --quiet && exit 0
          git commit -m "build: regenerate Plain Text bundle for 2.4.2"
          git push origin HEAD:release/2.4.2-localization-completeness
