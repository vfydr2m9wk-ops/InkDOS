name: Apply InkDesk update package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Root ZIP name. Leave empty when only one InkDesk-update-v*.zip exists.
        required: false
        type: string
      dry_run:
        description: Validate and show the plan without committing changes.
        required: true
        default: false
        type: boolean
      validation_profile:
        description: Validation level. "package" uses the profile declared by the ZIP.
        required: true
        default: package
        type: choice
        options:
          - package
          - standard
          - full
          - none

permissions:
  contents: write

concurrency:
  group: inkdesk-incremental-update
  cancel-in-progress: false

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pillow pypdf

      - name: Select update package
        id: package
        shell: bash
        env:
          REQUESTED_PACKAGE: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_PACKAGE}" ]]; then
            if [[ "${REQUESTED_PACKAGE}" == */* || "${REQUESTED_PACKAGE}" == *\\* ]]; then
              echo "package_name must be a root file name, not a path." >&2
              exit 1
            fi
            package="${REQUESTED_PACKAGE}"
            [[ -f "${package}" ]] || { echo "Package not found: ${package}" >&2; exit 1; }
          else
            mapfile -t packages < <(find . -maxdepth 1 -type f -name 'InkDesk-update-v*.zip' -printf '%f\n' | sort)
            if [[ ${#packages[@]} -ne 1 ]]; then
              echo "Expected exactly one root InkDesk-update-v*.zip, found ${#packages[@]}." >&2
              printf '%s\n' "${packages[@]:-}" >&2
              exit 1
            fi
            package="${packages[0]}"
          fi
          cp -- "${package}" /tmp/update-package.zip
          rm -- "${package}"
          echo "original_name=${package}" >> "${GITHUB_OUTPUT}"
          echo "Selected ${package}; the committed copy will be removed after application."

      - name: Prepare updater
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/apply_update_package.py ]]; then
            cp scripts/apply_update_package.py /tmp/apply_update_package.py
          else
            python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          package = Path('/tmp/update-package.zip')
          member = 'files/scripts/apply_update_package.py'
          with zipfile.ZipFile(package) as archive:
              names = {item.filename for item in archive.infolist()}
              if member not in names:
                  raise SystemExit('Bootstrap package does not contain the permanent updater script.')
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename:
                      raise SystemExit(f'Unsafe ZIP member: {item.filename}')
              Path('/tmp/apply_update_package.py').write_bytes(archive.read(member))
          PY
          fi
          chmod +x /tmp/apply_update_package.py

      - name: Apply package transaction
        id: apply
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        run: |
          set -euo pipefail
          args=(
            --package /tmp/update-package.zip
            --repo "${GITHUB_WORKSPACE}"
            --allow-workflow-changes
            --report /tmp/update-report.json
          )
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${VALIDATION_PROFILE}" != "package" ]]; then
            args+=(--validation-profile "${VALIDATION_PROFILE}")
          fi
          python /tmp/apply_update_package.py "${args[@]}"

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/update-report.json ]]; then
            python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/update-report.json').read_text())
          print(f"## InkDesk update {report['packageLabel']}")
          print()
          print(f"- Target release: `{report['targetRelease']}`")
          print(f"- Sequence: `{report['sequence']}`")
          print(f"- Validation: `{report['validationProfile']}`")
          print(f"- Dry run: `{report['dryRun']}`")
          print(f"- Files copied or replaced: `{len(report['copied'])}`")
          print(f"- Paths deleted: `{len(report['deleted'])}`")
          if report['copied']:
              print('\n<details><summary>Copied or replaced</summary>\n')
              for path in report['copied']:
                  print(f"- `{path}`")
              print('\n</details>')
          if report['deleted']:
              print('\n<details><summary>Deleted</summary>\n')
              for path in report['deleted']:
                  print(f"- `{path}`")
              print('\n</details>')
          PY
          else
            echo "## InkDesk update failed before a report was produced" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Commit applied update
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes were produced."
            exit 0
          fi
          label="$(python -c "import json; print(json.load(open('/tmp/update-report.json'))['packageLabel'])")"
          git commit -m "Apply InkDesk update ${label}"
          git push origin HEAD:main
