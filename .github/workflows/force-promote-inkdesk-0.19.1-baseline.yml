name: Force promote InkDesk 0.19.1 as main baseline

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: Source ZIP already uploaded to the repository root
        required: true
        default: InkDesk_v0.19.1-beta_source-update.zip
        type: string
      expected_version:
        description: Version that must be declared by the candidate source
        required: true
        default: 0.19.1-beta
        type: string
      tag:
        description: Tag to move to the promoted main commit
        required: true
        default: v0.19.1-beta
        type: string
      create_backup_branch:
        description: Preserve the previous main commit in a backup branch
        required: true
        default: true
        type: boolean
      confirmation:
        description: Type PROMOTE to replace main and the existing prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inkdesk-force-baseline-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Replace main and prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_PAT: ${{ secrets.INKDESK_RELEASE_PAT }}
      SOURCE_ARCHIVE: ${{ inputs.source_archive }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      RELEASE_TAG: ${{ inputs.tag }}
      BACKUP_ENABLED: ${{ inputs.create_backup_branch }}
      STAGING_DIR: ${{ runner.temp }}/inkdesk-promoted-source
      FORCE_WORKFLOW_PATH: .github/workflows/force-promote-inkdesk-0.19.1-baseline.yml

    steps:
      - name: Check out current main with release token
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.INKDESK_RELEASE_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Confirm forced promotion
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "PROMOTE" || {
            echo "The confirmation input must be exactly PROMOTE." >&2
            exit 1
          }
          test -n "$RELEASE_PAT" || {
            echo "Repository secret INKDESK_RELEASE_PAT is missing." >&2
            exit 1
          }
          test "$RELEASE_TAG" = "v$EXPECTED_VERSION" || {
            echo "Tag must equal v + expected_version (expected v$EXPECTED_VERSION)." >&2
            exit 1
          }
          [[ "$SOURCE_ARCHIVE" =~ ^[A-Za-z0-9._-]+\.zip$ ]] || {
            echo "source_archive must be a ZIP filename in the repository root." >&2
            exit 1
          }
          test -f "$SOURCE_ARCHIVE" || {
            echo "Source archive not found: $SOURCE_ARCHIVE" >&2
            exit 1
          }
          test -f "$FORCE_WORKFLOW_PATH" || {
            echo "This workflow must be stored as $FORCE_WORKFLOW_PATH" >&2
            exit 1
          }

      - name: Extract candidate with minimal integrity protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import shutil
          import stat
          import unicodedata
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZIP_STORED, BadZipFile, ZipFile

          archive = Path(os.environ["SOURCE_ARCHIVE"]).resolve()
          destination = Path(os.environ["STAGING_DIR"]).resolve()
          required = (
              "index.html",
              "README.md",
              "VERSION.json",
              "RELEASE_MANIFEST.json",
              "package.json",
              "apps/documents/index.html",
              "apps/spreadsheets/index.html",
              "apps/presentations/index.html",
              "scripts/build_release.py",
              "scripts/generate_checksums.py",
          )

          try:
              package = ZipFile(archive)
          except BadZipFile as error:
              raise SystemExit(f"Invalid source ZIP: {error}") from error

          with package:
              entries = package.infolist()
              if not entries:
                  raise SystemExit("Source ZIP is empty.")
              if len(entries) > 5000:
                  raise SystemExit(f"Source ZIP has too many entries: {len(entries)}")

              total_compressed = sum(entry.compress_size for entry in entries)
              total_expanded = sum(entry.file_size for entry in entries)
              if total_compressed > 100 * 1024 * 1024:
                  raise SystemExit("Source ZIP exceeds 100 MiB compressed.")
              if total_expanded > 300 * 1024 * 1024:
                  raise SystemExit("Source ZIP exceeds 300 MiB expanded.")
              if total_compressed and total_expanded / total_compressed > 250:
                  raise SystemExit("Source ZIP compression ratio is unreasonable.")

              exact: set[str] = set()
              normalized: set[str] = set()
              for entry in entries:
                  name = entry.filename
                  if not name or "\\" in name or any(ord(char) < 32 for char in name):
                      raise SystemExit(f"Invalid ZIP path: {name!r}")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if path.parts and path.parts[0].endswith(":"):
                      raise SystemExit(f"Drive-qualified ZIP path: {name}")
                  folded = unicodedata.normalize("NFC", name).casefold()
                  if name in exact or folded in normalized:
                      raise SystemExit(f"Duplicate or colliding ZIP path: {name}")
                  exact.add(name)
                  normalized.add(folded)
                  if entry.flag_bits & 0x1:
                      raise SystemExit(f"Encrypted ZIP entry is unsupported: {name}")
                  if entry.compress_type not in {ZIP_STORED, ZIP_DEFLATED}:
                      raise SystemExit(f"Unsupported compression method: {name}")
                  if ((entry.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {name}")

              for entry in entries:
                  target = (destination / entry.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"ZIP entry escapes destination: {entry.filename}")
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with package.open(entry) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)

          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit("Candidate is missing required files: " + ", ".join(missing))
          print(f"Extracted {len(entries)} entries into {destination}")
          PY

      - name: Confirm candidate version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STAGING_DIR"])
          expected = os.environ["EXPECTED_VERSION"]
          for filename in ("VERSION.json", "RELEASE_MANIFEST.json", "package.json", "app-manifest.json"):
              document = json.loads((root / filename).read_text(encoding="utf-8"))
              observed = str(document.get("version", ""))
              if observed != expected:
                  raise SystemExit(f"{filename} declares {observed!r}; expected {expected!r}")
          print(f"Candidate consistently declares {expected}.")
          PY

      - name: Make candidate the persistent repository baseline
        shell: bash
        run: |
          set -euo pipefail

          # Keep this direct-promotion workflow in the promoted tree and retire
          # obsolete bootstrap/synchronization workflows that could overwrite it.
          mkdir -p "$STAGING_DIR/.github/workflows"
          cp "$FORCE_WORKFLOW_PATH" "$STAGING_DIR/$FORCE_WORKFLOW_PATH"
          rm -f \
            "$STAGING_DIR/.github/workflows/sync-source-and-prerelease.yml" \
            "$STAGING_DIR/.github/workflows/bootstrap-inkdesk.yml" \
            "$STAGING_DIR/.github/workflows/repair-inkdesk-repository.yml" \
            "$STAGING_DIR/.github/workflows/apply-inkdesk-0.19.1-beta.yml"

          rsync -a --delete \
            --exclude='/.git/' \
            "$STAGING_DIR/" ./

          rm -f "$SOURCE_ARCHIVE" InkDesk-source.zip
          python3 scripts/generate_checksums.py
          python3 scripts/verify_checksums.py

          # This is intentionally not a Playwright/review gate. It only catches
          # incomplete copying or syntactically invalid first-party JavaScript.
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Commit and force-update main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          BACKUP_BRANCH="backup/main-before-${EXPECTED_VERSION}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$BACKUP_ENABLED" = "true" ]; then
            git push origin "$BASE_SHA:refs/heads/$BACKUP_BRANCH"
            echo "Previous main preserved at $BACKUP_BRANCH ($BASE_SHA)."
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "The current main already matches the promoted source."
          else
            git commit -m "Promote InkDesk ${EXPECTED_VERSION} as main baseline"
          fi

          NEW_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/main:$BASE_SHA" origin HEAD:main

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "backup_branch=$BACKUP_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Move release tag to the new baseline
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA="${{ steps.commit.outputs.new_sha }}"
          git tag -f -a "$RELEASE_TAG" "$NEW_SHA" -m "InkDesk $EXPECTED_VERSION main baseline"
          git push --force origin "refs/tags/$RELEASE_TAG"
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')" = "$NEW_SHA"

      - name: Build release assets from the promoted commit
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA="${{ steps.commit.outputs.new_sha }}"
          rm -rf dist
          python3 scripts/build_release.py \
            --output-dir dist \
            --commit "$NEW_SHA" \
            --tag "$RELEASE_TAG"

          cat > dist/BASELINE_PROMOTION_REPORT.md <<EOF
          # InkDesk baseline promotion

          - Version: \`$EXPECTED_VERSION\`
          - Tag: \`$RELEASE_TAG\`
          - Previous main: \`${{ steps.commit.outputs.base_sha }}\`
          - Promoted main: \`$NEW_SHA\`
          - Backup branch: \`${{ steps.commit.outputs.backup_branch }}\`
          - Promotion mode: maintainer-authorized direct baseline replacement
          - Candidate source: \`$SOURCE_ARCHIVE\`
          - Browser matrix: intentionally not used as a publication gate
          - Maintainer validation: package reported as locally tested and functional
          EOF

          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Replace prerelease assets and metadata
        env:
          GH_TOKEN: ${{ secrets.INKDESK_RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="InkDesk v${EXPECTED_VERSION} — New Main Baseline"
          NOTES_FILE="RELEASE_NOTES.md"
          test -f "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[].id' \
              | while read -r ASSET_ID; do
                  test -z "$ASSET_ID" || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
                done
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f -print | sort)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Promotion summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # InkDesk $EXPECTED_VERSION promoted

          The supplied 0.19.1 source is now the repository's main baseline.

          - Previous main: \`${{ steps.commit.outputs.base_sha }}\`
          - New main: \`${{ steps.commit.outputs.new_sha }}\`
          - Backup branch: \`${{ steps.commit.outputs.backup_branch }}\`
          - Tag moved: \`$RELEASE_TAG\`
          - Prerelease assets replaced: yes
          - Playwright matrix used as a gate: no
          EOF
