name: Replace main from source ZIP

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: ZIP already stored in the repository root
        required: true
        default: InkDesk_v0.19.3-beta.7.zip
        type: string
      expected_version:
        description: Version expected inside VERSION.json
        required: true
        default: 0.19.3-beta.7
        type: string
      confirmation:
        description: Type REPLACE_ALL to confirm the full replacement
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: inkdesk-replace-main
  cancel-in-progress: false

jobs:
  replace:
    name: Validate ZIP and replace main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_ARCHIVE: ${{ inputs.source_archive }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.INKDESK_RELEASE_PAT || github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Authorize replacement and verify archive
        shell: bash
        run: |
          set -euo pipefail

          test "$CONFIRMATION" = "REPLACE_ALL" || {
            echo "Confirmation must be exactly REPLACE_ALL." >&2
            exit 1
          }

          [[ "$SOURCE_ARCHIVE" =~ ^[A-Za-z0-9._-]+\.zip$ ]] || {
            echo "source_archive must be a ZIP filename in the repository root." >&2
            exit 1
          }

          test -f "$SOURCE_ARCHIVE" || {
            echo "Archive not found: $SOURCE_ARCHIVE" >&2
            exit 1
          }

          staging_dir="$RUNNER_TEMP/inkdesk-staging"
          archive_copy="$RUNNER_TEMP/inkdesk-source.zip"
          echo "STAGING_DIR=$staging_dir" >> "$GITHUB_ENV"
          echo "ARCHIVE_COPY=$archive_copy" >> "$GITHUB_ENV"

          cp "$SOURCE_ARCHIVE" "$archive_copy"
          actual_sha="$(sha256sum "$archive_copy" | awk '{print $1}')"
          echo "Archive SHA-256: $actual_sha"

          if test -f "$SOURCE_ARCHIVE.sha256"; then
            expected_sha="$(awk 'NR == 1 {print tolower($1)}' "$SOURCE_ARCHIVE.sha256")"
            [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || {
              echo "Invalid SHA-256 sidecar: $SOURCE_ARCHIVE.sha256" >&2
              exit 1
            }
            test "$actual_sha" = "$expected_sha" || {
              echo "The ZIP does not match its SHA-256 sidecar." >&2
              exit 1
            }
          fi

      - name: Extract ZIP safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          python - <<'PY'
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_COPY"])
          target = Path(os.environ["STAGING_DIR"])
          expected_version = os.environ["EXPECTED_VERSION"]

          with zipfile.ZipFile(archive) as package:
              entries = package.infolist()
              if not entries:
                  raise SystemExit("The replacement ZIP is empty.")
              if len(entries) > 20_000:
                  raise SystemExit("The replacement ZIP contains too many entries.")
              if sum(item.file_size for item in entries) > 2_000_000_000:
                  raise SystemExit("The uncompressed replacement ZIP is too large.")

              for item in entries:
                  path = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  unsafe = (
                      not item.filename
                      or "\\" in item.filename
                      or any(ord(char) < 32 for char in item.filename)
                      or path.is_absolute()
                      or ".." in path.parts
                      or ".git" in path.parts
                      or (path.parts and ":" in path.parts[0])
                  )
                  if unsafe:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename!r}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not allowed: {item.filename}")

              package.extractall(target)

          children = list(target.iterdir())
          source = children[0] if len(children) == 1 and children[0].is_dir() else target

          required = ["VERSION.json", "index.html", "scripts/check_no_legacy_runtime.py"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Missing required source files: " + ", ".join(missing))

          version = json.loads((source / "VERSION.json").read_text(encoding="utf-8"))["version"]
          if version != expected_version:
              raise SystemExit(f"Expected {expected_version}, but the ZIP contains {version}.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"SOURCE_ROOT={source}\n")
          PY

      - name: Test replacement before changing main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow pypdf
          cd "$SOURCE_ROOT"
          python scripts/check_no_legacy_runtime.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_repository.py
          python scripts/audit_source.py

      - name: Replace all tracked source files
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --is-inside-work-tree >/dev/null

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SOURCE_ROOT"/. ./

          git rev-parse --is-inside-work-tree >/dev/null
          test -f index.html
          test -f VERSION.json

      - name: Commit replacement to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The repository already matches the ZIP."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "release: replace repository with InkDesk $EXPECTED_VERSION"
          git push origin HEAD:main
