name: Build InkDesk main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pillow pypdf

      - name: Validate and test
        run: |
          python scripts/generate_release_metadata.py
          python scripts/check_no_legacy_runtime.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_repository.py
          python scripts/audit_source.py

      - name: Build release
        run: python scripts/build_release.py --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: InkDesk-v0.19.3-beta.7
          path: |
            dist/InkDesk_v0.19.3-beta.7.zip
            dist/InkDesk_v0.19.3-beta.7.zip.sha256
          if-no-files-found: error
