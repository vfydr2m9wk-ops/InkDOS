name: Publish InkDesk v0.20.0

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Complete source ZIP in the repository root
        required: false
        default: InkDesk_v0.20.0.zip
      create_backup_branch:
        description: Create backup/pre-v0.20.0-<run id>
        required: true
        type: boolean
        default: true
      create_tag:
        description: Create and push tag v0.20.0
        required: true
        type: boolean
        default: true
      dry_run:
        description: Validate without replacing the repository
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.20.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate complete package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.package_name }}'
          if [[ -n "$requested" && -f "$requested" ]]; then
            package="$requested"
          else
            mapfile -t matches < <(find . -maxdepth 1 -type f -name 'InkDesk_v0.20.0*.zip' -printf '%f\n' | sort)
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly one InkDesk_v0.20.0*.zip in the repository root; found %s.\n' "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]:-none}" >&2
              exit 1
            fi
            package="${matches[0]}"
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"
          sha256sum "$package"

      - name: Inspect and extract package safely
        shell: python
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          from pathlib import Path, PurePosixPath
          import os, shutil, zipfile

          package = Path(os.environ['PACKAGE'])
          stage = Path('.release-stage')
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()

          with zipfile.ZipFile(package) as archive:
              names = set()
              total = 0
              for info in archive.infolist():
                  raw = info.filename.rstrip('/')
                  if not raw:
                      continue
                  path = PurePosixPath(raw)
                  if path.is_absolute() or any(part in {'', '.', '..'} for part in path.parts):
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
                  if raw.casefold() in names:
                      raise SystemExit(f'Duplicate ZIP path: {info.filename}')
                  names.add(raw.casefold())
                  total += info.file_size
                  if info.file_size > 128 * 1024 * 1024 or total > 512 * 1024 * 1024:
                      raise SystemExit('ZIP size limits exceeded')
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == 0o120000:
                      raise SystemExit(f'Symlink is not allowed: {info.filename}')
              archive.extractall(stage)

          if not (stage / 'VERSION.json').is_file():
              children = [item for item in stage.iterdir() if item.is_dir()]
              if len(children) == 1 and (children[0] / 'VERSION.json').is_file():
                  nested = children[0]
                  for item in list(nested.iterdir()):
                      shutil.move(str(item), stage / item.name)
                  nested.rmdir()

      - name: Verify release identity
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('.release-stage')
          version = json.loads((root / 'VERSION.json').read_text())
          package = json.loads((root / 'package.json').read_text())
          manifest = json.loads((root / 'app-manifest.json').read_text())
          expected = '0.20.0'
          observed = [version.get('version'), package.get('version'), manifest.get('version')]
          if observed != [expected, expected, expected]:
              raise SystemExit(f'Version mismatch: {observed}')
          required = [
              'index.html', 'LICENSE', 'README.md', 'service-worker.js',
              'apps/documents/index.html', 'apps/spreadsheets/index.html',
              'apps/presentations/index.html', 'apps/pdf/index.html',
              'apps/txt/index.html', 'apps/epub/index.html'
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit('Missing release files: ' + ', '.join(missing))


      - name: Install Python validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            -r .release-stage/requirements-ci.txt

      - name: Vendor pinned PDF.js runtime
        shell: bash
        run: |
          set -euo pipefail
          cd .release-stage
          vendor_dir='shared/vendor/pdfjs'
          rm -rf "$vendor_dir"
          mkdir -p "$vendor_dir"
          package_archive="$(npm pack pdfjs-dist@3.11.174 --silent)"
          test -n "$package_archive"
          tar -xzf "$package_archive"
          install -m 0644 package/build/pdf.min.js "$vendor_dir/pdf.min.js"
          install -m 0644 package/build/pdf.worker.min.js "$vendor_dir/pdf.worker.min.js"
          install -m 0644 package/LICENSE "$vendor_dir/LICENSE-PDFJS.txt"
          rm -rf package "$package_archive"
          test -s "$vendor_dir/pdf.min.js"
          test -s "$vendor_dir/pdf.worker.min.js"
          grep -q '3.11.174' "$vendor_dir/pdf.min.js"
          python3 scripts/generate_checksums.py
          echo 'Vendored pdfjs-dist 3.11.174 from npm.'

      - name: Validate staged source
        shell: bash
        run: |
          set -euo pipefail
          cd .release-stage
          python3 scripts/generate_module_registry.py --check
          python3 scripts/check_no_legacy_runtime.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify_checksums.py

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo 'Dry run passed. Repository was not changed.'
          find .release-stage -type f | wc -l

      - name: Create backup branch
        if: ${{ !inputs.dry_run && inputs.create_backup_branch }}
        shell: bash
        run: |
          set -euo pipefail
          backup="backup/pre-v0.20.0-${GITHUB_RUN_ID}"
          git branch "$backup" HEAD
          git push origin "$backup"
          echo "Created $backup"

      - name: Replace repository with v0.20.0
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.release-stage/' \
            --exclude="$PACKAGE" \
            .release-stage/ ./
          rm -rf .release-stage
          rm -f "$PACKAGE"

      - name: Validate replaced repository
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_module_registry.py --check
          python3 scripts/check_no_legacy_runtime.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify_checksums.py

      - name: Commit v0.20.0
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes detected.'
          else
            git commit -m 'Release InkDesk v0.20.0'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Create release tag
        if: ${{ !inputs.dry_run && inputs.create_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse 'refs/tags/v0.20.0' >/dev/null 2>&1; then
            echo 'Tag v0.20.0 already exists; leaving it unchanged.'
          else
            git tag -a v0.20.0 -m 'InkDesk v0.20.0'
            git push origin v0.20.0
          fi
