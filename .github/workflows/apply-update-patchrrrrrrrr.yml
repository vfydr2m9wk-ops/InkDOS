name: Apply validated update patch

run-name: Apply patch to ${{ inputs.target_branch }} from ${{ inputs.base_ref }}

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch that will remain unchanged
        required: true
        default: main
        type: string
      payload_ref:
        description: Branch containing the patch file
        required: true
        default: update/payload-0.19.1-beta
        type: string
      patch_path:
        description: Relative path of the patch file in the payload branch
        required: true
        default: InkDesk_0.19.1-beta_hardening.patch
        type: string
      patch_sha256:
        description: Expected SHA-256 of the patch file
        required: true
        default: 41e922c8a4122de1a68379eaa0b4323b7ba0bb646fdd1bcfc2176c399549a2ad
        type: string
      target_branch:
        description: New branch to create; it must not already exist
        required: true
        default: hardening/0.19.1-beta
        type: string
      expected_base_sha:
        description: Optional exact base commit; leave empty to use the current base branch head
        required: false
        default: ""
        type: string
      run_browser_tests:
        description: Run the five isolated Chromium regression groups before creating the branch
        required: true
        default: true
        type: boolean
      draft_pr:
        description: Open the pull request as a draft
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: apply-update-${{ inputs.target_branch }}
  cancel-in-progress: false

env:
  PATCH_MAX_BYTES: "10485760"
  PLAYWRIGHT_VERSION: "1.57.0"
  BEAUTIFULSOUP_VERSION: "4.14.3"
  OPENPYXL_VERSION: "3.1.5"

jobs:
  validate:
    name: Validate patch and static test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.metadata.outputs.base_sha }}
      payload_sha: ${{ steps.metadata.outputs.payload_sha }}
      patch_sha256: ${{ steps.metadata.outputs.patch_sha256 }}
      changed_files: ${{ steps.metadata.outputs.changed_files }}

    steps:
      - name: Check out the base branch without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate inputs and obtain the checksum-pinned patch
        id: metadata
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          PATCH_PATH: ${{ inputs.patch_path }}
          EXPECTED_PATCH_SHA256: ${{ inputs.patch_sha256 }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -Eeuo pipefail

          validate_branch() {
            local value="$1"
            local label="$2"
            if [[ -z "$value" ]] || ! git check-ref-format --branch "$value" >/dev/null 2>&1; then
              echo "Invalid ${label}: ${value}" >&2
              exit 1
            fi
          }

          validate_branch "$BASE_REF" "base branch"
          validate_branch "$PAYLOAD_REF" "payload branch"
          validate_branch "$TARGET_BRANCH" "target branch"

          if [[ "$TARGET_BRANCH" == "$BASE_REF" || "$TARGET_BRANCH" == "$PAYLOAD_REF" ]]; then
            echo "The target branch must be different from the base and payload branches." >&2
            exit 1
          fi

          if [[ "$PATCH_PATH" == /* || "$PATCH_PATH" == *".."* || "$PATCH_PATH" == *":"* || "$PATCH_PATH" == *"\\"* || "$PATCH_PATH" != *.patch ]]; then
            echo "The patch path must be a safe relative path ending in .patch." >&2
            exit 1
          fi

          expected_patch_sha="${EXPECTED_PATCH_SHA256,,}"
          if [[ ! "$expected_patch_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "patch_sha256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          base_sha="$(git rev-parse HEAD^{commit})"
          if [[ -n "$EXPECTED_BASE_SHA" && "$base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Base commit mismatch." >&2
            echo "Expected: $EXPECTED_BASE_SHA" >&2
            echo "Actual:   $base_sha" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi

          git fetch --no-tags --prune origin \
            "+refs/heads/${PAYLOAD_REF}:refs/remotes/origin/${PAYLOAD_REF}"
          payload_sha="$(git rev-parse "refs/remotes/origin/${PAYLOAD_REF}^{commit}")"

          patch_file="$RUNNER_TEMP/inkdesk-update.patch"
          git show "refs/remotes/origin/${PAYLOAD_REF}:${PATCH_PATH}" > "$patch_file"

          patch_bytes="$(wc -c < "$patch_file")"
          if (( patch_bytes == 0 || patch_bytes > PATCH_MAX_BYTES )); then
            echo "Patch size is outside the permitted range: ${patch_bytes} bytes." >&2
            exit 1
          fi

          actual_patch_sha="$(sha256sum "$patch_file" | awk '{print $1}')"
          if [[ "$actual_patch_sha" != "$expected_patch_sha" ]]; then
            echo "Patch checksum mismatch." >&2
            echo "Expected: $expected_patch_sha" >&2
            echo "Actual:   $actual_patch_sha" >&2
            exit 1
          fi

          PATCH_FILE="$patch_file" python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import PurePosixPath

          patch_path = os.environ["PATCH_FILE"]
          data = open(patch_path, "rb").read()
          if b"\x00" in data:
              raise SystemExit("Patch contains a NUL byte.")

          text = data.decode("utf-8", "strict")
          paths: set[str] = set()
          header = re.compile(r"^diff --git a/(.+) b/(.+)$")

          for line in text.splitlines():
              match = header.match(line)
              if not match:
                  continue
              for raw in match.groups():
                  path = PurePosixPath(raw)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in patch: {raw}")
                  if not path.parts or path.parts[0] == ".git":
                      raise SystemExit(f"Forbidden path in patch: {raw}")
                  if raw == ".gitmodules":
                      raise SystemExit("The patch may not add or modify .gitmodules.")
                  if any(ord(char) < 32 for char in raw):
                      raise SystemExit(f"Control character in patch path: {raw!r}")
                  paths.add(raw)

          if not paths:
              raise SystemExit("No file changes were found in the patch.")
          if len(paths) > 500:
              raise SystemExit(f"Patch changes too many files: {len(paths)}")

          print(f"Patch path inventory accepted: {len(paths)} files")
          for path in sorted(paths):
              print(path)
          PY

          git apply --check --binary --3way "$patch_file"
          git apply --binary --3way --index --whitespace=nowarn "$patch_file"

          # This one-use installer is removed from the proposed update tree so
          # the supplied package and CHECKSUMS.sha256 remain exact.
          git rm --force --ignore-unmatch .github/workflows/apply-update-patch.yml

          whitespace_report="$(git diff --cached --check 2>&1 || true)"
          if [[ -n "$whitespace_report" ]]; then
            unexpected_whitespace="$(printf '%s\n' "$whitespace_report" | grep -vE '^[^:]+:[0-9]+: new blank line at EOF\.$' || true)"
            if [[ -n "$unexpected_whitespace" ]]; then
              echo "Unexpected whitespace errors were introduced:" >&2
              printf '%s\n' "$unexpected_whitespace" >&2
              exit 1
            fi
            echo "::notice::The supplied checksum-pinned patch contains a trailing blank line at EOF; no other whitespace errors were found."
          fi

          if git diff --cached --quiet; then
            echo "The patch produced no staged changes." >&2
            exit 1
          fi

          if git diff --cached --summary | grep -Eq 'mode (120000|160000)'; then
            echo "Symbolic links and submodules are not permitted in this update." >&2
            git diff --cached --summary >&2
            exit 1
          fi

          changed_files="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "payload_sha=$payload_sha" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$actual_patch_sha" >> "$GITHUB_OUTPUT"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

          {
            echo "### Validated update input"
            echo
            echo "- Base branch: \`$BASE_REF\`"
            echo "- Base commit: \`$base_sha\`"
            echo "- Payload branch: \`$PAYLOAD_REF\`"
            echo "- Payload commit: \`$payload_sha\`"
            echo "- Patch: \`$PATCH_PATH\`"
            echo "- Patch SHA-256: \`$actual_patch_sha\`"
            echo "- Changed files: \`$changed_files\`"
            echo "- Requested target branch: \`$TARGET_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

          git diff --cached --name-status

      - name: Run repository integrity and static validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          node tests/js/security-modules.test.js
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m unittest tests.test_release_packaging -v
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Confirm validation did not alter the proposed update
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Validation modified tracked files unexpectedly:" >&2
            git diff --name-status >&2
            exit 1
          fi

  browser:
    name: Chromium / ${{ matrix.group }}
    if: ${{ inputs.run_browser_tests }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group:
          - package-security
          - lifecycle
          - isolation-offline
          - documents-presentations
          - spreadsheets

    steps:
      - name: Check out the exact validated base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Re-obtain and apply the validated patch
        shell: bash
        env:
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          EXPECTED_PAYLOAD_SHA: ${{ needs.validate.outputs.payload_sha }}
          PATCH_PATH: ${{ inputs.patch_path }}
          EXPECTED_PATCH_SHA256: ${{ needs.validate.outputs.patch_sha256 }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${PAYLOAD_REF}:refs/remotes/origin/${PAYLOAD_REF}"
          actual_payload_sha="$(git rev-parse "refs/remotes/origin/${PAYLOAD_REF}^{commit}")"
          test "$actual_payload_sha" = "$EXPECTED_PAYLOAD_SHA"

          patch_file="$RUNNER_TEMP/inkdesk-update.patch"
          git show "refs/remotes/origin/${PAYLOAD_REF}:${PATCH_PATH}" > "$patch_file"
          actual_patch_sha="$(sha256sum "$patch_file" | awk '{print $1}')"
          test "$actual_patch_sha" = "$EXPECTED_PATCH_SHA256"
          git apply --check --binary --3way "$patch_file"
          git apply --binary --3way --whitespace=nowarn "$patch_file"
          rm -f -- .github/workflows/apply-update-patch.yml

      - name: Install pinned browser-test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check \
            "playwright==${PLAYWRIGHT_VERSION}" \
            "beautifulsoup4==${BEAUTIFULSOUP_VERSION}" \
            "openpyxl==${OPENPYXL_VERSION}"
          python3 -m playwright install --with-deps chromium

      - name: Run isolated Chromium regression group
        env:
          PLAYWRIGHT_BROWSER: chromium
          CHROMIUM_PATH: ""
        run: python3 scripts/run_browser_regressions.py --group "${{ matrix.group }}"

  publish_branch:
    name: Create branch and draft pull request
    needs: [validate, browser]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (needs.browser.result == 'success' || needs.browser.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out the exact validated base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Re-verify the immutable inputs and create the new branch
        id: branch
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          EXPECTED_PAYLOAD_SHA: ${{ needs.validate.outputs.payload_sha }}
          PATCH_PATH: ${{ inputs.patch_path }}
          EXPECTED_PATCH_SHA256: ${{ needs.validate.outputs.patch_sha256 }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
        run: |
          set -Eeuo pipefail

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch appeared after validation and will not be overwritten: $TARGET_BRANCH" >&2
            exit 1
          fi

          test "$(git rev-parse HEAD^{commit})" = "$BASE_SHA"

          git fetch --no-tags origin \
            "+refs/heads/${PAYLOAD_REF}:refs/remotes/origin/${PAYLOAD_REF}"
          actual_payload_sha="$(git rev-parse "refs/remotes/origin/${PAYLOAD_REF}^{commit}")"
          test "$actual_payload_sha" = "$EXPECTED_PAYLOAD_SHA"

          patch_file="$RUNNER_TEMP/inkdesk-update.patch"
          git show "refs/remotes/origin/${PAYLOAD_REF}:${PATCH_PATH}" > "$patch_file"
          actual_patch_sha="$(sha256sum "$patch_file" | awk '{print $1}')"
          test "$actual_patch_sha" = "$EXPECTED_PATCH_SHA256"

          git switch --create "$TARGET_BRANCH"
          git apply --check --binary --3way "$patch_file"
          git apply --binary --3way --index --whitespace=nowarn "$patch_file"
          git rm --force --ignore-unmatch .github/workflows/apply-update-patch.yml

          whitespace_report="$(git diff --cached --check 2>&1 || true)"
          unexpected_whitespace="$(printf '%s\n' "$whitespace_report" | grep -vE '^[^:]+:[0-9]+: new blank line at EOF\.$' || true)"
          if [[ -n "$unexpected_whitespace" ]]; then
            echo "Unexpected whitespace errors were introduced:" >&2
            printf '%s\n' "$unexpected_whitespace" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply InkDesk 0.19.1-beta hardening update"
          commit_sha="$(git rev-parse HEAD)"
          git push --set-upstream origin "HEAD:refs/heads/${TARGET_BRANCH}"

          branch_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TARGET_BRANCH}"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "branch_url=$branch_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Update branch created"
            echo
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Commit: \`$commit_sha\`"
            echo "- Base commit: \`$BASE_SHA\`"
            echo "- Branch URL: $branch_url"
            echo
            echo "No tag, release, or merge was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request when repository settings allow it
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          PAYLOAD_SHA: ${{ needs.validate.outputs.payload_sha }}
          PATCH_PATH: ${{ inputs.patch_path }}
          PATCH_SHA256: ${{ needs.validate.outputs.patch_sha256 }}
          CHANGED_FILES: ${{ needs.validate.outputs.changed_files }}
          DRAFT_PR: ${{ inputs.draft_pr }}
          BRANCH_URL: ${{ steps.branch.outputs.branch_url }}
        run: |
          set -Eeuo pipefail

          body_file="$RUNNER_TEMP/pull-request-body.md"
          cat > "$body_file" <<EOF
          ## Summary

          Applies the checksum-pinned InkDesk 0.19.1-beta hardening patch in a dedicated branch.

          ## Provenance

          - Base branch: \`$BASE_REF\`
          - Base commit: \`$BASE_SHA\`
          - Payload branch: \`$PAYLOAD_REF\`
          - Payload commit: \`$PAYLOAD_SHA\`
          - Patch path: \`$PATCH_PATH\`
          - Patch SHA-256: \`$PATCH_SHA256\`
          - Changed files: \`$CHANGED_FILES\`

          ## Automated validation

          - Repository checksum verification
          - Repository structure validation
          - Source risk audit
          - Direct JavaScript security assertions
          - Python unit/package tests
          - Deterministic release-packaging test
          - First-party JavaScript syntax checks
          - Five isolated Chromium regression groups, unless explicitly disabled at dispatch time

          ## Safety properties

          - The base branch was not modified by this workflow.
          - The target branch did not exist before publication.
          - The patch was applied only after its SHA-256 matched.
          - Tests ran in read-only jobs.
          - The write-enabled job did not execute modified project code.
          - The one-use installer workflow is removed from the proposed update tree.
          - No merge, tag, or release was created.

          ## Manual review

          Review the complete diff and required status checks before merging. Native Safari/iPadOS validation remains separate.
          EOF

          args=(
            pr create
            --base "$BASE_REF"
            --head "$TARGET_BRANCH"
            --title "Harden document lifecycle and Office parsing for 0.19.1-beta"
            --body-file "$body_file"
          )
          if [[ "$DRAFT_PR" == "true" ]]; then
            args+=(--draft)
          fi

          set +e
          output="$(gh "${args[@]}" 2>&1)"
          status=$?
          set -e

          if (( status == 0 )); then
            pr_url="$(printf '%s\n' "$output" | tail -n 1)"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "### Pull request"
              echo
              echo "$pr_url"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The branch was created, but GitHub did not allow this workflow to open the pull request."
            printf '%s\n' "$output" >&2
            {
              echo
              echo "### Pull request was not opened automatically"
              echo
              echo "The validated branch exists at: $BRANCH_URL"
              echo
              echo "Open a pull request manually from \`$TARGET_BRANCH\` into \`$BASE_REF\`."
              echo "Repository setting to check: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
