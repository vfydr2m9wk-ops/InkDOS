name: Apply validated update bundle

run-name: Create ${{ inputs.target_branch }} from validated update bundle

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch that will remain unchanged
        required: true
        default: main
        type: string

      payload_ref:
        description: Branch containing the update bundle
        required: true
        default: update/payload-0.19.1-beta-clean
        type: string

      bundle_path:
        description: Bundle file located in the payload branch
        required: true
        default: InkDesk_0.19.1-beta_hardening.bundle
        type: string

      bundle_sha256:
        description: Expected SHA-256 of the bundle
        required: true
        default: 19e60fef1bcc1b596d4ddc933f1e32ba35cbdd5038d865cc245bb8cc6fc56449
        type: string

      bundle_commit:
        description: Exact final commit contained in the bundle
        required: true
        default: cf96539b36c277f1ac4af54147da49f3ac5c4fef
        type: string

      target_branch:
        description: New branch to create; it must not already exist
        required: true
        default: hardening/0.19.1-beta
        type: string

      run_browser_tests:
        description: Run Chromium browser regression tests
        required: true
        default: true
        type: boolean

      draft_pr:
        description: Open the pull request as a draft
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: apply-update-bundle-${{ inputs.target_branch }}
  cancel-in-progress: false

env:
  BUNDLE_MAX_BYTES: "10485760"
  PLAYWRIGHT_VERSION: "1.57.0"
  BEAUTIFULSOUP_VERSION: "4.14.3"
  OPENPYXL_VERSION: "3.1.5"

jobs:
  validate:
    name: Validate bundle and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      payload_sha: ${{ steps.prepare.outputs.payload_sha }}
      bundle_sha256: ${{ steps.prepare.outputs.bundle_sha256 }}
      final_commit: ${{ steps.prepare.outputs.final_commit }}

    steps:
      - name: Check out the current base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate inputs and obtain bundle
        id: prepare
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          EXPECTED_BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -Eeuo pipefail

          validate_branch() {
            local value="$1"
            local label="$2"

            if [[ -z "$value" ]] || ! git check-ref-format --branch "$value" >/dev/null 2>&1; then
              echo "Invalid ${label}: ${value}" >&2
              exit 1
            fi
          }

          validate_branch "$BASE_REF" "base branch"
          validate_branch "$PAYLOAD_REF" "payload branch"
          validate_branch "$TARGET_BRANCH" "target branch"

          if [[ "$TARGET_BRANCH" == "$BASE_REF" || "$TARGET_BRANCH" == "$PAYLOAD_REF" ]]; then
            echo "The target branch must differ from the base and payload branches." >&2
            exit 1
          fi

          if [[ "$BUNDLE_PATH" == /* ||
                "$BUNDLE_PATH" == *".."* ||
                "$BUNDLE_PATH" == *":"* ||
                "$BUNDLE_PATH" == *"\\"* ||
                "$BUNDLE_PATH" != *.bundle ]]; then
            echo "The bundle path must be a safe relative path ending in .bundle." >&2
            exit 1
          fi

          expected_sha="${EXPECTED_BUNDLE_SHA256,,}"

          if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "bundle_sha256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_BUNDLE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "bundle_commit must contain exactly 40 hexadecimal characters." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "The target branch already exists: $TARGET_BRANCH" >&2
            echo "Delete it or choose another target branch before retrying." >&2
            exit 1
          fi

          base_sha="$(git rev-parse HEAD^{commit})"

          git fetch --no-tags --prune origin \
            "+refs/heads/${PAYLOAD_REF}:refs/remotes/origin/${PAYLOAD_REF}"

          payload_sha="$(git rev-parse "refs/remotes/origin/${PAYLOAD_REF}^{commit}")"

          bundle_file="$RUNNER_TEMP/inkdesk-update.bundle"

          git show \
            "refs/remotes/origin/${PAYLOAD_REF}:${BUNDLE_PATH}" \
            > "$bundle_file"

          bundle_bytes="$(wc -c < "$bundle_file" | tr -d ' ')"

          if (( bundle_bytes == 0 || bundle_bytes > BUNDLE_MAX_BYTES )); then
            echo "Bundle size is outside the permitted range: ${bundle_bytes} bytes." >&2
            exit 1
          fi

          actual_sha="$(sha256sum "$bundle_file" | awk '{print $1}')"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Bundle checksum mismatch." >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

          mapfile -t bundle_heads < <(git bundle list-heads "$bundle_file")

          expected_line="${EXPECTED_BUNDLE_COMMIT} refs/heads/hardening/0.19.1-beta"

          if (( ${#bundle_heads[@]} != 1 )); then
            echo "The bundle must expose exactly one branch." >&2
            printf '%s\n' "${bundle_heads[@]}" >&2
            exit 1
          fi

          if [[ "${bundle_heads[0]}" != "$expected_line" ]]; then
            echo "The bundle contains an unexpected branch or commit." >&2
            echo "Expected: $expected_line" >&2
            echo "Actual:   ${bundle_heads[0]}" >&2
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "payload_sha=$payload_sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "final_commit=${EXPECTED_BUNDLE_COMMIT,,}" >> "$GITHUB_OUTPUT"

      - name: Import the final tree from the bundle
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.bundle_commit }}
        run: |
          set -Eeuo pipefail

          bundle_file="$RUNNER_TEMP/inkdesk-update.bundle"
          final_tree="$RUNNER_TEMP/final-tree"

          rm -rf "$final_tree"
          mkdir -p "$final_tree"

          git -C "$final_tree" init

          git -C "$final_tree" fetch             "$bundle_file"             "refs/heads/hardening/0.19.1-beta:refs/remotes/bundle/hardening/0.19.1-beta"

          cd "$final_tree"

          actual_commit="$(
            git rev-parse               "refs/remotes/bundle/hardening/0.19.1-beta^{commit}"
          )"

          if [[ "$actual_commit" != "${EXPECTED_COMMIT,,}" ]]; then
            echo "Imported commit does not match the expected commit." >&2
            echo "Expected: ${EXPECTED_COMMIT,,}" >&2
            echo "Actual:   $actual_commit" >&2
            exit 1
          fi

          git checkout --detach "$actual_commit"

          if [[ -f .gitmodules ]]; then
            echo "The final update tree may not contain .gitmodules." >&2
            exit 1
          fi

          if find . -type l -print -quit | grep -q .; then
            echo "The final update tree may not contain symbolic links." >&2
            exit 1
          fi

          if [[ -e .github/workflows/apply-update-patch.yml ]]; then
            echo "The temporary installer workflow unexpectedly exists in the final tree." >&2
            exit 1
          fi

      - name: Install test dependencies
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 -m pip install --disable-pip-version-check \
            "beautifulsoup4==${BEAUTIFULSOUP_VERSION}" \
            "openpyxl==${OPENPYXL_VERSION}" \
            "playwright==${PLAYWRIGHT_VERSION}"

          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts
          fi

      - name: Run repository validation
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 scripts/verify_checksums.py
          python3 scripts/validate_repository.py
          python3 scripts/audit_source.py
          node tests/js/security-modules.test.js
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m unittest tests.test_release_packaging -v

      - name: Check JavaScript syntax
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps shared -type f -name '*.js' -print0)

      - name: Install Chromium
        if: ${{ inputs.run_browser_tests }}
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m playwright install --with-deps chromium

      - name: Run Chromium browser regressions
        if: ${{ inputs.run_browser_tests }}
        working-directory: ${{ runner.temp }}/final-tree
        shell: bash
        env:
          PLAYWRIGHT_BROWSER: chromium
        run: |
          set -Eeuo pipefail

          python3 scripts/run_browser_regressions.py --group package-security
          python3 scripts/run_browser_regressions.py --group lifecycle
          python3 scripts/run_browser_regressions.py --group isolation-offline
          python3 scripts/run_browser_regressions.py --group documents-presentations
          python3 scripts/run_browser_regressions.py --group spreadsheets

      - name: Create validated tree artifact
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.bundle_commit }}
        run: |
          set -Eeuo pipefail

          final_tree="$RUNNER_TEMP/final-tree"
          artifact="$RUNNER_TEMP/inkdesk-validated-tree.tar"

          tar --exclude='.git' --format=posix -C "$final_tree" -cf "$artifact" .

          artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          printf '%s\n' "$artifact_sha" > "$RUNNER_TEMP/inkdesk-validated-tree.tar.sha256"
          printf '%s\n' "${EXPECTED_COMMIT,,}" > "$RUNNER_TEMP/inkdesk-validated-tree.commit"

      - name: Upload validated tree
        uses: actions/upload-artifact@v4
        with:
          name: inkdesk-validated-tree
          path: |
            ${{ runner.temp }}/inkdesk-validated-tree.tar
            ${{ runner.temp }}/inkdesk-validated-tree.tar.sha256
            ${{ runner.temp }}/inkdesk-validated-tree.commit
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Create branch and draft pull request
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out the exact validated base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated tree
        uses: actions/download-artifact@v4
        with:
          name: inkdesk-validated-tree
          path: ${{ runner.temp }}/validated-artifact

      - name: Verify artifact and create the new branch
        id: branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          EXPECTED_FINAL_COMMIT: ${{ needs.validate.outputs.final_commit }}
          EXPECTED_BUNDLE_SHA: ${{ needs.validate.outputs.bundle_sha256 }}
        run: |
          set -Eeuo pipefail

          artifact_dir="$RUNNER_TEMP/validated-artifact"
          artifact="$artifact_dir/inkdesk-validated-tree.tar"

          expected_artifact_sha="$(tr -d '[:space:]' < "$artifact_dir/inkdesk-validated-tree.tar.sha256")"
          actual_artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"

          if [[ "$actual_artifact_sha" != "$expected_artifact_sha" ]]; then
            echo "Validated tree artifact checksum mismatch." >&2
            exit 1
          fi

          artifact_commit="$(tr -d '[:space:]' < "$artifact_dir/inkdesk-validated-tree.commit")"

          if [[ "$artifact_commit" != "$EXPECTED_FINAL_COMMIT" ]]; then
            echo "Validated tree commit metadata mismatch." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "The target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi

          git switch --create "$TARGET_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +

          tar -C . -xf "$artifact"

          if [[ -e .github/workflows/apply-update-patch.yml ]]; then
            echo "The temporary workflow unexpectedly exists in the final tree." >&2
            exit 1
          fi

          git add --all

          if git diff --cached --quiet; then
            echo "The validated final tree produces no changes." >&2
            exit 1
          fi

          git commit \
            -m "Apply InkDesk 0.19.1-beta hardening update" \
            -m "Validated bundle commit: $EXPECTED_FINAL_COMMIT" \
            -m "Validated bundle SHA-256: $EXPECTED_BUNDLE_SHA"

          created_commit="$(git rev-parse HEAD^{commit})"

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "created_commit=$created_commit" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pull_request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          DRAFT_PR: ${{ inputs.draft_pr }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          PAYLOAD_SHA: ${{ needs.validate.outputs.payload_sha }}
          BUNDLE_SHA: ${{ needs.validate.outputs.bundle_sha256 }}
          FINAL_COMMIT: ${{ needs.validate.outputs.final_commit }}
          CREATED_COMMIT: ${{ steps.branch.outputs.created_commit }}
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Summary

          Applies the supplied and checksum-validated InkDesk 0.19.1-beta hardening tree in a new branch.

          ## Validation metadata

          - Base commit: \`${BASE_SHA}\`
          - Payload commit: \`${PAYLOAD_SHA}\`
          - Bundle SHA-256: \`${BUNDLE_SHA}\`
          - Bundled source commit: \`${FINAL_COMMIT}\`
          - Created repository commit: \`${CREATED_COMMIT}\`

          ## Safety

          - The base branch was not modified.
          - No tag or release was created.
          - Merge remains a manual repository-owner decision.
          EOF

          draft_argument=()

          if [[ "$DRAFT_PR" == "true" ]]; then
            draft_argument+=(--draft)
          fi

          pr_url="$(
            gh pr create \
              --base "$BASE_REF" \
              --head "$TARGET_BRANCH" \
              --title "Apply InkDesk 0.19.1-beta hardening update" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              "${draft_argument[@]}"
          )"

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Explain manual pull request creation when needed
        if: ${{ steps.pull_request.outcome == 'failure' }}
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          {
            echo "### Branch created, but the pull request was not opened automatically"
            echo
            echo "Open:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${TARGET_BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
