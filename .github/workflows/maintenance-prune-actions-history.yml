name: Maintenance - prune Actions history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-prune-actions-history.yml'

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune obsolete workflow runs safely
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          all_runs="$(mktemp)"
          keep_ids="$(mktemp)"
          page=1

          while :; do
            payload="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page")"
            count="$(jq '.workflow_runs | length' <<<"$payload")"
            if [ "$count" -eq 0 ]; then
              break
            fi
            jq -c '.workflow_runs[]' <<<"$payload" >> "$all_runs"
            page=$((page + 1))
          done

          before="$(wc -l < "$all_runs" | tr -d ' ')"

          # Never delete this maintenance run, active/queued runs, or runs for the exact
          # maintenance commit while they may still be executing.
          printf '%s\n' "$GITHUB_RUN_ID" >> "$keep_ids"
          jq -r 'select(.status != "completed") | .id' "$all_runs" >> "$keep_ids"
          jq -r --arg sha "$GITHUB_SHA" 'select(.head_sha == $sha) | .id' "$all_runs" >> "$keep_ids"

          # Keep a small useful diagnostic window for the workflows that remain in main.
          active_paths=(
            '.github/workflows/apply-inkdos-update.yml'
            '.github/workflows/refresh-integrity-metadata.yml'
            '.github/workflows/stability-freeze-regression.yml'
            'dynamic/pages/pages-build-deployment'
          )
          for path in "${active_paths[@]}"; do
            jq -r --arg path "$path" 'select(.path == $path) | .id' "$all_runs" | head -n 10 >> "$keep_ids" || true
          done
          sort -u -o "$keep_ids" "$keep_ids"

          deleted=0
          kept=0
          while IFS= read -r run; do
            id="$(jq -r '.id' <<<"$run")"
            status="$(jq -r '.status' <<<"$run")"
            if grep -Fxq "$id" "$keep_ids"; then
              kept=$((kept + 1))
              continue
            fi
            if [ "$status" != "completed" ]; then
              kept=$((kept + 1))
              continue
            fi
            gh api --method DELETE "repos/$repo/actions/runs/$id"
            deleted=$((deleted + 1))
          done < "$all_runs"

          after="$(gh api "repos/$repo/actions/runs?per_page=1" --jq '.total_count')"
          echo "BEFORE=$before"
          echo "DELETED=$deleted"
          echo "KEPT=$kept"
          echo "AFTER=$after"
