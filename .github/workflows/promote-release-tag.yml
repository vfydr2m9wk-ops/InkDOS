name: Promote release tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-promotion.json'

permissions:
  actions: write
  contents: write

concurrency:
  group: inkdos-release-tag-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Create or verify release tag and dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out promoted main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate promotion request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import json
          version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))['version']
          request = json.loads(Path('.github/release-promotion.json').read_text(encoding='utf-8'))
          tag = request.get('tag', '')
          expected = f'v{version}'
          if tag != expected:
              raise SystemExit(f'release promotion mismatch: marker={tag!r}, expected={expected!r}')
          mode = request.get('mode')
          if mode not in {'current-main-commit', 'existing-validated-tag'}:
              raise SystemExit(f'unsupported release promotion mode: {mode!r}')
          print(f'RELEASE_TAG={tag}')
          print(f'PROMOTION_MODE={mode}')
          PY

      - name: Create or verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$RELEASE_TAG")"
            git merge-base --is-ancestor "$existing" "$GITHUB_SHA" || {
              echo "Existing tag $RELEASE_TAG is not an ancestor of current main." >&2
              exit 1
            }
            tagged_version="$(git show "$RELEASE_TAG:VERSION.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            [ "v$tagged_version" = "$RELEASE_TAG" ] || {
              echo "Existing tag/version mismatch: $RELEASE_TAG vs $tagged_version." >&2
              exit 1
            }
            if [ "$PROMOTION_MODE" = "current-main-commit" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already exists at validated ancestor $existing; preserving it rather than moving it."
            else
              echo "Verified existing immutable tag $RELEASE_TAG at $existing."
            fi
          else
            [ "$PROMOTION_MODE" = "current-main-commit" ] || {
              echo "Tag $RELEASE_TAG does not exist; existing-validated-tag mode cannot create it." >&2
              exit 1
            }
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "Created $RELEASE_TAG at $GITHUB_SHA."
          fi

      - name: Dispatch unified release explicitly
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/release-dispatch.json
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'release_tag': os.environ['RELEASE_TAG'],
                  'reuse_run_id': '',
              },
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --data-binary @/tmp/release-dispatch.json
          echo "Dispatched unified release for $RELEASE_TAG."
