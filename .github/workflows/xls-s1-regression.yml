name: XLS-S1 regression

on:
  push:
    branches:
      - "audit/stability-functional-isolation"
    paths:
      - "FUNCTIONAL_STATE.json"
      - "apps/spreadsheets/**"
      - "tests/test_xls_s1_*.py"
      - ".github/workflows/xls-s1-regression.yml"
  pull_request:
    paths:
      - "FUNCTIONAL_STATE.json"
      - "apps/spreadsheets/**"
      - "tests/test_xls_s1_*.py"
      - ".github/workflows/xls-s1-regression.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate XLS-S1 structural formula contract
        run: python tests/test_xls_s1_contract.py
      - name: Check Spreadsheet runtime syntax
        run: |
          node --check apps/spreadsheets/engine/workbook-editor.js
          node --check apps/spreadsheets/engine/formula/evaluator.js
          node --check apps/spreadsheets/ui/editor-controller.js

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Isolate unrelated Chrome apt source
        run: |
          while IFS= read -r source; do
            sudo mv "$source" "$source.inkdos-disabled"
          done < <(grep -RIl 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/test_xls_s1_structural_formulas_browser.py
