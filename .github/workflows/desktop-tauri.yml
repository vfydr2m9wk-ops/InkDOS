name: InkDOS Tauri desktop

on:
  push:
    branches:
      - release/2.4.1-fixes
    paths:
      - '.github/workflows/desktop-tauri.yml'

permissions:
  contents: write

concurrency:
  group: inkdos-cache-rotation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rotate-cache:
    name: Rotate 2.4.1 offline cache
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          ref: release/2.4.1-fixes
      - name: Rotate service-worker cache identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('service-worker.js')
          text = path.read_text(encoding='utf-8')
          old = "const CACHE_NAME='inkdos-v2.4.0-1';"
          new = "const CACHE_NAME='inkdos-v2.4.1-1';"
          if old not in text:
              raise SystemExit('expected 2.4.0 cache identity not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git diff --cached --check
          git commit -m "release: rotate offline cache for 2.4.1"
          git push origin HEAD:release/2.4.1-fixes
