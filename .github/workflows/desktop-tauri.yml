name: InkDOS Tauri desktop

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-tauri.yml'
      - '.github/workflows/release.yml'
      - 'desktop/**'
      - 'apps/**'
      - 'shared/**'
      - 'assets/**'
      - 'index.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'VERSION.json'
      - 'tests/test_tauri_desktop_contract.py'
      - 'tests/test_tauri_goal3_native_window_contract.py'
      - 'tests/test_localization_settings_contract.py'
      - 'tests/test_localization_completeness_contract.py'
      - 'tests/test_desktop_ux_contract.py'
      - 'tests/test_documents_243_insert_table_cancel_contract.py'
      - 'tests/test_documents_243_interaction_contract.py'
      - 'tests/test_home_density_layout_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Desktop contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate release metadata
        run: python desktop/scripts/release_version.py --check-config
      - name: Run desktop contract
        run: python tests/test_tauri_desktop_contract.py
      - name: Run native associated-file contract
        run: python tests/test_tauri_goal3_native_window_contract.py
      - name: Run localization/settings contract
        run: python tests/test_localization_settings_contract.py
      - name: Run localization completeness contract
        run: python tests/test_localization_completeness_contract.py
      - name: Run desktop UX contract
        run: python tests/test_desktop_ux_contract.py
      - name: Run Documents 2.4.3 interaction contracts
        run: |
          python tests/test_documents_243_insert_table_cancel_contract.py
          python tests/test_documents_243_interaction_contract.py
      - name: Run Home density layout contract
        run: python tests/test_home_density_layout_contract.py
      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check
