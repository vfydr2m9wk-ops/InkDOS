name: InkDOS Tauri desktop

on:
  push:
    branches:
      - main
      - desktop-tauri
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Desktop contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate release metadata
        run: python desktop/scripts/release_version.py --check-config
      - name: Run desktop contract
        run: python tests/test_tauri_desktop_contract.py
      - name: Validate staged desktop runtime
        run: python desktop/scripts/stage_web.py --check

  build:
    name: Build ${{ matrix.artifact }}
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: InkDOS-Windows
            bundles: nsis,msi
          - os: macos-latest
            artifact: InkDOS-macOS
            bundles: app,dmg
          - os: ubuntu-22.04
            artifact: InkDOS-Linux
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Validate release metadata
        run: python desktop/scripts/release_version.py --check-config

      - name: Stage InkDOS web runtime
        run: python desktop/scripts/stage_web.py

      - name: Generate desktop icons
        working-directory: desktop/src-tauri
        run: cargo tauri icon ../../assets/icons/office.png

      - name: Check Tauri shell
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Build native installers
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
