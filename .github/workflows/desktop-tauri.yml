name: InkDOS Tauri desktop

on:
  push:
    branches:
      - release/2.4.1-fixes
    paths:
      - '.github/workflows/desktop-tauri.yml'
      - 'desktop/**'
      - 'apps/**'
      - 'shared/**'
      - 'assets/**'
      - 'index.html'
      - 'VERSION.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkdos-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    name: Windows Rust check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Stage desktop runtime
        run: python desktop/scripts/stage_web.py
      - name: Install verified Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Check Windows desktop host
        working-directory: desktop/src-tauri
        run: cargo check
