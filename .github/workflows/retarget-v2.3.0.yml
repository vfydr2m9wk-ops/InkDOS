name: Refresh InkDOS 2.3 integrity checkpoint

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retarget-v2.3.0.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-integrity-refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dispatch repository integrity refresh on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run refresh-integrity-metadata.yml --repo vfydr2m9wk-ops/InkDOS --ref main
