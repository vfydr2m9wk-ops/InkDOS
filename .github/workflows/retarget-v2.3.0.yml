name: Retarget InkDOS 2.3 release tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retarget-v2.3.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  retarget-and-dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify 2.3.0 release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("VERSION.json", encoding="utf-8"))["version"])')" = "2.3.0"
          python desktop/scripts/release_version.py --check-config
      - name: Retarget v2.3.0 and dispatch unified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f v2.3.0 "$GITHUB_SHA"
          git push origin refs/tags/v2.3.0 --force
          gh workflow run release.yml --ref main -f release_tag=v2.3.0
