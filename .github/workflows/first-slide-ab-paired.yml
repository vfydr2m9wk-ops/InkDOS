name: First-slide preview paired A-B

on:
  push:
    branches:
      - perf/first-slide-ab-paired

permissions:
  contents: read

jobs:
  paired:
    name: Paired first-slide A-B (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 25524f0a8135846a3fe78b2236dc93aac547a5e3
          path: target-base
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aee9083aaa7bed2cb6bc270e3ee380a58f2b8bcc
          path: target-candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Measure baseline #209
        env:
          BROWSER: ${{ matrix.browser }}
          INKDOS_TARGET_ROOT: ${{ github.workspace }}/target-base
          INKDOS_AB_VARIANT: baseline-209
          INKDOS_PRODUCT_COMMIT: 25524f0a8135846a3fe78b2236dc93aac547a5e3
          INKDOS_FIRST_SLIDE_AB_OUT: artifacts/paired/${{ matrix.browser }}/baseline
        run: python scripts/benchmark_first_slide_preview.py
      - name: Measure preview candidate
        env:
          BROWSER: ${{ matrix.browser }}
          INKDOS_TARGET_ROOT: ${{ github.workspace }}/target-candidate
          INKDOS_AB_VARIANT: candidate-211
          INKDOS_PRODUCT_COMMIT: aee9083aaa7bed2cb6bc270e3ee380a58f2b8bcc
          INKDOS_FIRST_SLIDE_AB_OUT: artifacts/paired/${{ matrix.browser }}/candidate
        run: python scripts/benchmark_first_slide_preview.py
      - name: Preserve paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-slide-paired-${{ matrix.browser }}
          path: artifacts/paired/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
