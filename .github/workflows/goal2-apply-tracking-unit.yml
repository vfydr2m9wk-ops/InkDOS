name: Goal 2 apply tracking unit fix

on:
  push:
    branches:
      - feature/inkdos-2.3
    paths:
      - '.github/workflows/goal2-apply-tracking-unit.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Apply coordinate-consistent tracking unit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/presentations/view/slide-surface.js')
          text=path.read_text(encoding='utf-8')
          old="span.style.letterSpacing=(Number(r.charSpacingPt)*(o.autoFitScale||1))+'pt'"
          new="span.style.letterSpacing=(Number(r.charSpacingPt)*(o.autoFitScale||1))+'px'"
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one tracking-unit match, found {count}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Syntax check renderer
        run: node --check apps/presentations/view/slide-surface.js
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify background regression
        run: python tests/test_pptx_slide_background_fidelity_browser.py
      - name: Verify character-spacing regression
        run: python tests/test_pptx_character_spacing_fidelity_browser.py
      - name: Commit tested production fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/inkdos-2.3
          test "$(git rev-parse origin/feature/inkdos-2.3)" = "${GITHUB_SHA}" || { echo 'Branch advanced during patch run' >&2; exit 1; }
          git rm .github/workflows/goal2-apply-tracking-unit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/presentations/view/slide-surface.js
          git commit -m 'fix: render PPTX tracking in InkDOS coordinate units'
          git push origin HEAD:feature/inkdos-2.3
