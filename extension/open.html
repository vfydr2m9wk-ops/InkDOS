<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening in InkDOS</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f7f9;--fg:#1d2433;--muted:#5b6475;--accent:#0f766e}
  @media (prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e8ebf1;--muted:#9aa3b5;--accent:#2dd4bf}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:520px;padding:24px;text-align:center}
  img{width:48px;height:48px}
  p{color:var(--muted);word-break:break-word}
  button{margin-top:8px;padding:8px 16px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="icons/inkdos.png" alt="">
  <h1 id="title">Opening in InkDOS…</h1>
  <p id="detail"></p>
  <button id="browser" type="button" hidden>Open in the browser instead</button>
</main>
<script src="open.js"></script>
</body>
</html>
