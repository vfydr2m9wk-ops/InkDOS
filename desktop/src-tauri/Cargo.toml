[package]
name = "inkdos-desktop"
version = "2.7.6"
description = "InkDOS desktop host"
authors = ["InkDOS contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.98.1"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updater = "=2.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Beta tools channel (src/beta.rs); same versions the updater plugin already resolves.
base64 = "=0.22.1"
flate2 = "=1.1.10"
minisign-verify = "=0.2.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"] }
sha2 = "=0.10.9"
tar = "=0.4.46"

[dev-dependencies]
# Signs test packages (beta channel tests); already in the tree through rustls.
ring = "=0.17.14"
tempfile = "=3.27.0"
